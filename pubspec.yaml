name: myco_app
description: "Application mobile de gestion complète d'une ferme mycologique de pleurotes."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase Core & Services
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.4

  # State Management
  flutter_riverpod: ^2.5.1

  # QR Code Scanning & Generation
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0

  # Charts & Visualizations
  fl_chart: ^0.69.0

  # PDF Generation & Printing
  pdf: ^3.11.1
  printing: ^5.13.2

  # URL Launcher (Calls, Maps)
  url_launcher: ^6.3.0

  # Utilities & Formatting
  intl: ^0.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
