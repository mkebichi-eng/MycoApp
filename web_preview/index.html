              </h3>
              <p class="text-[10px] text-[#aaa]">Pesez votre cagette globale et cochez les contenants cueillis</p>
            </div>
            <span class="text-[10px] font-mono bg-[#1f3a1f] text-[#7bc67e] border border-[#7bc67e]/30 px-2 py-0.5 rounded-full font-bold">
              ${selectedCount} sélectionnés
            </span>
          </div>

          <div class="bg-[#142214] p-3 rounded-2xl border border-[#2d4a2d] space-y-2">
            <label class="text-[#7bc67e] font-bold block flex justify-between items-center">
              <span>⚖️ Poids Total Récolté sur la Balance (kg frais) :</span>
              <span class="text-white text-xs font-mono font-bold">${bulkTotalWeightKg} kg</span>
            </label>
            <div class="flex gap-2 items-center">
              <input id="bulk-total-kg" type="number" step="0.05" min="0.1" class="flex-1 bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white text-lg font-bold font-mono" value="${bulkTotalWeightKg}" oninput="onBulkWeightInput(this.value)">
              <div class="flex gap-1">
                <button onclick="adjustBulkWeight(0.5)" class="px-2 py-2 bg-[#2d4a2d] text-white rounded-lg text-xs font-bold hover:bg-[#3a5e3a]">+0.5</button>
                <button onclick="adjustBulkWeight(1.0)" class="px-2 py-2 bg-[#2d4a2d] text-white rounded-lg text-xs font-bold hover:bg-[#3a5e3a]">+1.0</button>
                <button onclick="adjustBulkWeight(-0.5)" class="px-2 py-2 bg-[#2d4a2d] text-white rounded-lg text-xs font-bold hover:bg-[#3a5e3a]">-0.5</button>
              </div>
            </div>
            <div class="flex justify-between items-center text-[11px] text-[#bbb] pt-1">
              <span>Date de récolte :</span>
              <input id="bulk-harvest-date" type="date" class="bg-[#0f1a0f] border border-[#2d4a2d] rounded-lg px-2 py-1 text-white text-xs" value="${new Date().toISOString().slice(0, 10)}">
            </div>
          </div>

          <div class="space-y-2">
            <div class="flex justify-between items-center">
              <label class="text-white font-bold text-xs">Sélection des Sacs & Seaux cueillis :</label>
              <div class="flex gap-1 text-[10px]">
                <button onclick="toggleBulkSelectAll(true)" class="px-2 py-0.5 bg-[#2d4a2d] text-white rounded hover:bg-[#3d6a3d]">Tout cocher</button>
                <button onclick="toggleBulkSelectAll(false)" class="px-2 py-0.5 bg-[#1a2a1a] text-[#888] rounded hover:text-white">Tout décocher</button>
              </div>
            </div>

            <select id="bulk-table-filter" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2 text-white text-xs font-semibold" onchange="renderBulkHarvestModalContent(this.value)">
              ${tablesOptions}
            </select>
          </div>

          <div class="space-y-1.5 max-h-52 overflow-y-auto pr-1">
            ${visibleBags.map(b => {
              const isChecked = bulkSelectedBagIds.has(b.id);
              const nextFlush = (b.harvests ? b.harvests.length : 0) + 1;
              const isSeau = b.type === 'seau';
              const parentTable = tables.find(t => t.id === b.tableId || t.id === b.batchId);
              const tableName = parentTable ? (parentTable.name || parentTable.id) : (b.tableId || 'Table');

              return `
                <div onclick="toggleBulkBag('${b.id}')" class="p-2.5 rounded-xl border cursor-pointer transition-all flex items-center justify-between ${isChecked ? 'bg-[#1f3a1f] border-[#7bc67e]/60 text-white' : 'bg-[#0f1a0f] border-[#2d4a2d] text-[#888] opacity-70'}">
                  <div class="flex items-center gap-2">
                    <input type="checkbox" ${isChecked ? 'checked' : ''} class="w-4 h-4 rounded accent-[#4a9e4e] pointer-events-none">
                    <div>
                      <div class="flex items-center gap-1.5">
                        <span class="font-mono font-bold text-xs text-white">${b.id}</span>
                        <span class="text-[9px] px-1 rounded ${isSeau ? 'bg-amber-900/60 text-amber-300' : 'bg-[#1a2a1a] text-[#aaa]'}">${isSeau ? '🪣 Seau' : '🛍️ Sac'}</span>

                    `}

                </div>

            }).join('')}
          </div>

          <div class="bg-[#0f1a0f] p-2.5 rounded-xl border border-[#2d4a2d] text-center space-y-1">
            <div class="flex justify-between text-xs font-bold">
              <span class="text-[#bbb]">${selectedCount} contenant(s) sélectionné(s)</span>
              <span class="text-[#7bc67e]">Moyenne : ${avgKg} kg / contenant</span>
            </div>
            <p class="text-[9px] text-[#888]">Chaque sac recevra sa pesée équitable calculée et sa volée sera automatiquement incrémentée.</p>
          </div>

          <div class="pt-2 flex gap-2">
            <button onclick="closeModal()" class="flex-1 py-2.5 bg-[#2d4a2d] rounded-xl text-white font-bold">Annuler</button>
            <button onclick="saveBulkHarvest()" class="flex-1 py-2.5 bg-[#4a9e4e] rounded-xl text-white font-bold shadow hover:bg-emerald-600 transition-all ${selectedCount === 0 ? 'opacity-50 pointer-events-none' : ''}">
              Valider la Récolte (${bulkTotalWeightKg} kg)
            </button>
          </div>
        </div>
      `);
    }

    function onBulkWeightInput(val) {
      bulkTotalWeightKg = Math.max(0.1, parseFloat(val) || 0.1);
      const activeTable = document.getElementById('bulk-table-filter') ? document.getElementById('bulk-table-filter').value : null;
      renderBulkHarvestModalContent(activeTable);
    }

    function adjustBulkWeight(delta) {
      bulkTotalWeightKg = Math.max(0.1, Math.round((bulkTotalWeightKg + delta) * 100) / 100);
      const activeTable = document.getElementById('bulk-table-filter') ? document.getElementById('bulk-table-filter').value : null;
      renderBulkHarvestModalContent(activeTable);
    }

    function toggleBulkBag(bagId) {
      if (bulkSelectedBagIds.has(bagId)) {
        bulkSelectedBagIds.delete(bagId);
      } else {
        bulkSelectedBagIds.add(bagId);
      }
      const activeTable = document.getElementById('bulk-table-filter') ? document.getElementById('bulk-table-filter').value : null;
      renderBulkHarvestModalContent(activeTable);
    }

    function toggleBulkSelectAll(select) {
      const fruitingBags = state.bags.filter(b => b.status === 'fruiting');
      const activeTable = document.getElementById('bulk-table-filter') ? document.getElementById('bulk-table-filter').value : null;
      const targetBags = activeTable 
        ? fruitingBags.filter(b => b.tableId === activeTable || b.batchId === activeTable)
        : fruitingBags;

      if (select) {
        targetBags.forEach(b => bulkSelectedBagIds.add(b.id));
      } else {
        targetBags.forEach(b => bulkSelectedBagIds.delete(b.id));
      }
      renderBulkHarvestModalContent(activeTable);
    }

    function saveBulkHarvest() {
      if (bulkSelectedBagIds.size === 0) {
        alert('Veuillez cocher au moins un sac ou seau récolté.');
        return;
      }
      const weightInput = document.getElementById('bulk-total-kg');
      const totalWeight = weightInput ? (parseFloat(weightInput.value) || bulkTotalWeightKg) : bulkTotalWeightKg;
      const dateInput = document.getElementById('bulk-harvest-date');
      const harvestDate = dateInput ? dateInput.value : new Date().toISOString().slice(0, 10);
      const selectedCount = bulkSelectedBagIds.size;
      const weightPerBag = Math.round((totalWeight / selectedCount) * 100) / 100;

      bulkSelectedBagIds.forEach(id => {
        const b = state.bags.find(x => x.id === id);
        if (b) {
          if (!b.harvests) b.harvests = [];
          const flushNum = b.harvests.length + 1;
          b.harvests.push({
            flush: flushNum,
            date: harvestDate,
            weightKg: weightPerBag
          });
          b.harvestedKg = Math.round(b.harvests.reduce((sum, h) => sum + h.weightKg, 0) * 100) / 100;
        }
      });

      saveState();
      closeModal();
      showToast(`🎉 Récolte enregistrée : ${totalWeight} kg répartis sur ${selectedCount} contenants !`);
    }

    function openPrintLabelsModal(tableId = null, singleBagId = null) {
      let targetBags = [];
      let title = '';

      if (singleBagId) {
        const b = state.bags.find(x => x.id === singleBagId);
        if (b) targetBags = [b];
        title = `Étiquette : ${singleBagId}`;
      } else if (tableId) {
        targetBags = state.bags.filter(b => b.tableId === tableId || b.batchId === tableId);
        title = `Étiquettes Table : ${tableId} (${targetBags.length} étiquettes)`;
      } else {
        targetBags = state.bags;
        title = `Toutes les étiquettes (${targetBags.length})`;
      }

      const tables = state.tables || [];

      const labelsHtml = targetBags.map(b => {
        const parentTable = tables.find(t => t.id === b.tableId || t.id === b.batchId);
        const tableName = parentTable ? (parentTable.name || parentTable.id) : (b.tableId || 'Table');
        const strain = b.strain || (parentTable ? parentTable.strain : 'Pleurote Gris HK35');
        const date = b.incubationDate || (parentTable ? parentTable.date : '');
        const isSeau = b.type === 'seau';
        const typeLabel = isSeau ? 'SEAU PLASTIQUE' : 'SAC DE CULTURE';
        const weightLabel = `${b.weight || 4.5} KG`;

        return `
          <div class="thermal-label-sticker border border-black p-2 bg-white text-black rounded-lg shadow-sm font-mono text-[10px] w-full max-w-[240px] mx-auto select-all">
            <div class="flex justify-between items-center border-b border-black pb-0.5 font-bold text-[9px]">
              <span>🍄 MYCOAPP</span>
              <span class="tracking-widest uppercase">${typeLabel}</span>
            </div>

            <div class="text-center py-1">
              <div class="text-base font-black tracking-wider text-black">${b.id}</div>
              <div class="text-[9px] font-bold text-gray-700">${tableName}</div>
            </div>

            <div class="w-full flex justify-center">
              ${generateSvgBarcode(b.id)}
            </div>

            <div class="flex justify-between items-center text-[8px] font-bold border-t border-black pt-0.5">
              <span>${strain}</span>
              <span>${date} • ${weightLabel}</span>
            </div>
          </div>
        `;
      }).join('');

      showModal(`
        <div class="space-y-3 text-xs max-h-[85vh] overflow-y-auto pr-1">
          <div class="flex justify-between items-center border-b border-[#2d4a2d] pb-2">
            <div>
              <h3 class="text-sm font-bold text-white flex items-center gap-1.5">
                <span>🖨️</span> <span>Impression Thermique (50x30mm)</span>
              </h3>
              <p class="text-[10px] text-[#aaa]">${title}</p>
            </div>
            <button onclick="triggerThermalPrint()" class="px-3 py-1.5 bg-[#4a9e4e] text-white rounded-xl text-xs font-bold shadow hover:bg-emerald-600 transition-all flex items-center gap-1">
              <span>🖨️</span> <span>Imprimer</span>
            </button>
          </div>

          <div class="bg-[#0f1a0f] p-2.5 rounded-xl border border-[#2d4a2d] text-[11px] text-[#bbb] space-y-1">
            <p>🏷️ <strong>Format d'étiquette standard :</strong> 50mm × 30mm (Compatible mini-imprimantes thermiques Niimbot, Phomemo, Zebra, Xprinter).</p>
            <p class="text-[10px] text-[#888]">💡 En attendant l'imprimante thermique, écrivez simplement le code <strong class="text-white">${targetBags[0] ? targetBags[0].id : 'TAB01-S01'}</strong> au marqueur indélébile sur vos contenants !</p>
          </div>

          <div id="labels-preview-area" class="space-y-3 p-3 bg-neutral-900 rounded-2xl border border-[#2d4a2d]">
            ${labelsHtml}
          </div>

          <div class="pt-2 flex gap-2">
            <button onclick="closeModal()" class="flex-1 py-2.5 bg-[#2d4a2d] rounded-xl text-white font-bold">Fermer</button>
            <button onclick="triggerThermalPrint()" class="flex-1 py-2.5 bg-[#4a9e4e] rounded-xl text-white font-bold shadow hover:bg-emerald-600 transition-all flex items-center justify-center gap-1">
              <span>🖨️</span> <span>Lancer l'Impression (${targetBags.length})</span>
            </button>
          </div>
        </div>
      `);
    }

    function triggerThermalPrint() {
      const previewArea = document.getElementById('labels-preview-area');
      const printArea = document.getElementById('thermal-print-area');
      if (previewArea && printArea) {
        printArea.innerHTML = previewArea.innerHTML;
        window.print();
      }
    }

    function generateSvgBarcode(code) {
      let bars = '';
      let x = 4;
      for (let i = 0; i < code.length; i++) {
        const charCode = code.charCodeAt(i);
        const w1 = (charCode % 2 === 0) ? 2 : 1;
        const w2 = (charCode % 3 === 0) ? 3 : 1.5;
        bars += `<rect x="${x}" y="0" width="${w1}" height="28" fill="black" />`;
        x += w1 + 1.5;
        bars += `<rect x="${x}" y="0" width="${w2}" height="28" fill="black" />`;
        x += w2 + 2;
      }
      return `<svg viewBox="0 0 ${Math.max(x + 4, 120)} 28" class="w-full h-6 my-0.5" preserveAspectRatio="none">${bars}</svg>`;
    }

    // ==========================================
    // 8. DÉPENSES EXPLOITATION & ACHATS STOCKS
    // ==========================================
    function renderExpensesView() {
      stockSubTab = 'expenses';
      renderStockView();
    }

    function openNewExpenseModal(preselectedStockId = null) {
      const isStockPreset = !!preselectedStockId;
      const presetStock = isStockPreset ? state.stocks.find(s => s.id === preselectedStockId) : null;

      const stocksOptions = state.stocks.map(s => `
        <option value="${s.id}" ${s.id === preselectedStockId ? 'selected' : ''}>
          📦 ${s.name} (Actuel: ${s.quantity} ${s.unit})
        </option>
      `).join('');

      const unitsOptions = (state.units || ['kg', 'unités', 'L', 'g']).map(u => `
        <option value="${u}" ${presetStock && presetStock.unit === u ? 'selected' : ''}>${u}</option>
      `).join('');

      const catOptions = (state.expenseCategories || [
        'Matière première (Paille/Blanc)',
        'Sanitation & Hygiène',
        'Consommables & Sacs',
        'Énergie (Sonelgaz/Eau)',
        'Transport & Carburant',
        'Outillage & Équipement',
        'Autre charge'
      ]).map(c => `
        <option value="${c}" ${presetStock && presetStock.category === c ? 'selected' : ''}>${c}</option>
      `).join('');

      showModal(`
        <h3 class="text-sm font-bold text-white mb-2 flex items-center justify-between">
          <span class="flex items-center gap-1.5">
            <span>💸</span> <span>Enregistrer une Dépense / Achat</span>
          </span>
          <span class="text-[10px] text-[#7bc67e] font-mono">DZD (DA)</span>
        </h3>

        <div class="space-y-2.5 text-xs max-h-[75vh] overflow-y-auto pr-1">
          <!-- 1. Liaison avec un article du Stock -->
          <div class="bg-[#142214] p-2.5 rounded-xl border border-[#2d4a2d]">
            <label class="text-[#7bc67e] font-bold block mb-1 flex items-center justify-between">
              <span>📦 Article en Stock concerné :</span>
              <span class="text-[9px] text-[#aaa] font-normal">Optionnel pour frais</span>
            </label>
            <select id="exp-stock-id" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2 text-white text-xs font-semibold" onchange="onExpenseStockChange(this.value)">
              <option value="">-- Dépense générale (Frais / Énergie / Transport sans impact stock) --</option>
              <optgroup label="Articles existants en stock :">
                ${stocksOptions}
              </optgroup>
              <option value="__NEW_STOCK__">✨ + Créer un nouvel article dans le stock...</option>
            </select>

            <!-- Champ nouveau stock si sélectionné -->
            <div id="exp-new-stock-box" class="hidden mt-2 pt-2 border-t border-[#2d4a2d]/60 space-y-1.5">
              <label class="text-[10px] text-[#aaa] block">Nom du nouvel article à ajouter au catalogue :</label>
              <input id="exp-new-stock-name" class="w-full bg-[#0f1a0f] border border-[#7bc67e] rounded-xl p-2 text-white text-xs" placeholder="ex: Blanc Pleurote Jaune">
            </div>

            <!-- Aperçu de l'impact stock en direct -->
            <div id="exp-stock-preview" class="${presetStock ? '' : 'hidden'} mt-2 p-2 bg-[#1f3a1f] border border-[#7bc67e]/40 rounded-xl text-[10px] text-[#7bc67e] flex items-center justify-between">
              <span id="exp-preview-text">
                ${presetStock ? `Stock actuel : ${presetStock.quantity} ${presetStock.unit} ➔ Deviendra : ${presetStock.quantity + 1} ${presetStock.unit}` : ''}
              </span>
              <span>🟢 Auto-sync</span>
            </div>
          </div>

          <!-- 2. Motif / Désignation -->
          <div>
            <label class="text-[#888] block mb-1">Motif / Désignation de la dépense</label>
            <input id="exp-label" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white font-medium" 
                   value="${presetStock ? 'Achat ' + presetStock.name : ''}" 
                   placeholder="ex: Achat 300 kg paille de blé hachée">
          </div>

          <!-- 3. Catégorie (Non figée) -->
          <div>
            <label class="text-[#888] block mb-1">Catégorie comptable</label>
            <select id="exp-cat" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2 text-white" onchange="onExpenseCatChange(this.value)">
              ${catOptions}
              <option value="__NEW_CAT__">+ Ajouter une nouvelle catégorie...</option>
            </select>
            <div id="new-cat-container" class="hidden mt-1.5">
              <input id="exp-custom-cat" class="w-full bg-[#0f1a0f] border border-[#7bc67e] rounded-xl p-2 text-white text-xs" placeholder="Nom de la nouvelle catégorie personnalisée...">
            </div>
          </div>

          <!-- 4. Quantité & Unité (Non figée) -->
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[#888] block mb-1">Quantité achetée</label>
              <input id="exp-qty" type="number" step="any" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white font-bold text-sm" value="1" oninput="onExpenseCalcChange('qty')">
            </div>
            <div>
              <label class="text-[#888] block mb-1">Unité</label>
              <select id="exp-unit" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white" onchange="onExpenseUnitChange(this.value)">
                ${unitsOptions}
                <option value="__NEW_UNIT__">+ Ajouter une unité...</option>
              </select>
              <div id="new-unit-container" class="hidden mt-1.5">
                <input id="exp-custom-unit" class="w-full bg-[#0f1a0f] border border-[#7bc67e] rounded-xl p-2 text-white text-xs" placeholder="ex: paquet, palette, botte...">
              </div>
            </div>
          </div>

          <!-- 5. Calcul Prix Unitaire & Total (Calcul bidirectionnel interactif) -->
          <div class="bg-[#142214] p-2.5 rounded-xl border border-[#2d4a2d] space-y-2">
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="text-[#888] block mb-1">Prix par unité (DA)</label>
                <input id="exp-unit-price" type="number" step="any" 
                       class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2 text-white font-bold font-mono" 
                       value="${presetStock ? (presetStock.cost || '') : ''}" 
                       placeholder="ex: 15" 
                       oninput="onExpenseCalcChange('unitPrice')">
              </div>
              <div>
                <label class="text-[#7bc67e] font-bold block mb-1">Prix Total Payé (DA)</label>
                <input id="exp-amount" type="number" step="any" 
                       class="w-full bg-[#0f1a0f] border border-[#7bc67e] rounded-xl p-2 text-[#7bc67e] font-bold text-sm font-mono" 
                       value="${presetStock ? (presetStock.cost || '') : ''}" 
                       placeholder="ex: 4500" 
                       oninput="onExpenseCalcChange('total')">
              </div>
            </div>
            <p class="text-[9px] text-[#888] leading-tight">
              💡 <em>Saisissez Quantité × Prix unitaire OU tapez directement le Prix total : le calcul s'ajuste automatiquement dans les deux sens !</em>
            </p>
          </div>

          <!-- 6. Fournisseur / Établissement (Optionnel) -->
          <div>
            <label class="text-[#888] block mb-1">Fournisseur / Lieu d'achat (Optionnel)</label>
            <input id="exp-supplier" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2 text-white" placeholder="ex: Ferme agricole Boufarik, Naftal...">
          </div>

          <!-- 7. Option de mise à jour du Stock -->
          <label class="flex items-center gap-2 cursor-pointer p-2 bg-[#0f1a0f] rounded-xl border border-[#2d4a2d]">
            <input id="exp-auto-stock" type="checkbox" ${isStockPreset ? 'checked' : 'checked'} class="accent-[#4a9e4e] w-4 h-4">
            <span class="text-[11px] text-slate-200">
              Mettre à jour le stock automatiquement (+quantité au stock et actualise le prix unitaire)
            </span>
          </label>

          <!-- Boutons de validation -->
          <div class="pt-2 flex gap-2">
            <button onclick="closeModal()" class="flex-1 py-2.5 bg-[#2d4a2d] rounded-xl text-white font-bold">Annuler</button>
            <button onclick="saveNewExpense()" class="flex-1 py-2.5 bg-[#4a9e4e] rounded-xl text-white font-bold shadow hover:bg-emerald-600 transition-all flex items-center justify-center gap-1">
              <span>💾</span> <span>Enregistrer Dépense</span>
            </button>
          </div>
        </div>
      `);
    }

    function onExpenseStockChange(val) {
      const newStockBox = document.getElementById('exp-new-stock-box');
      const preview = document.getElementById('exp-stock-preview');
      const autoStockCheck = document.getElementById('exp-auto-stock');
      const labelInput = document.getElementById('exp-label');
      const unitSelect = document.getElementById('exp-unit');
      const unitPriceInput = document.getElementById('exp-unit-price');

      if (val === '__NEW_STOCK__') {
        newStockBox.classList.remove('hidden');
        preview.classList.add('hidden');
        autoStockCheck.checked = true;
      } else if (val) {
        newStockBox.classList.add('hidden');
        preview.classList.remove('hidden');
        autoStockCheck.checked = true;

        const s = state.stocks.find(x => x.id === val);
        if (s) {
          if (!labelInput.value || labelInput.value.startsWith('Achat ')) {
            labelInput.value = 'Achat ' + s.name;
          }
          if (s.unit && unitSelect) {
            unitSelect.value = s.unit;
          }
          if (s.cost && unitPriceInput) {
            unitPriceInput.value = s.cost;
          }
          onExpenseCalcChange('unitPrice');
        }
      } else {
        newStockBox.classList.add('hidden');
        preview.classList.add('hidden');
        autoStockCheck.checked = false;
      }
    }

    function onExpenseCatChange(val) {
      const container = document.getElementById('new-cat-container');
      const input = document.getElementById('exp-custom-cat');
      if (val === '__NEW_CAT__') {
        container.classList.remove('hidden');
        if (input) input.focus();
      } else {
        container.classList.add('hidden');
      }
    }

    function onExpenseUnitChange(val) {
      const container = document.getElementById('new-unit-container');
      const input = document.getElementById('exp-custom-unit');
      if (val === '__NEW_UNIT__') {
        container.classList.remove('hidden');
        if (input) input.focus();
      } else {
        container.classList.add('hidden');
      }
      onExpenseCalcChange('unit');
    }

    function onExpenseCalcChange(source) {
      const qtyEl = document.getElementById('exp-qty');
      const upEl = document.getElementById('exp-unit-price');
      const amountEl = document.getElementById('exp-amount');
      const stockIdEl = document.getElementById('exp-stock-id');
      const previewEl = document.getElementById('exp-stock-preview');
      const previewTextEl = document.getElementById('exp-preview-text');
      const unitEl = document.getElementById('exp-unit');

      if (!qtyEl || !upEl || !amountEl) return;

      const qty = parseFloat(qtyEl.value) || 0;
      const unit = unitEl ? (unitEl.value === '__NEW_UNIT__' ? (document.getElementById('exp-custom-unit')?.value || 'u') : unitEl.value) : 'u';

      if (source === 'qty' || source === 'unitPrice' || source === 'unit') {
        const up = parseFloat(upEl.value) || 0;
        if (qty > 0 && up > 0) {
          amountEl.value = Math.round(qty * up);
        }
      } else if (source === 'total') {
        const total = parseFloat(amountEl.value) || 0;
        if (qty > 0 && total > 0) {
          upEl.value = Math.round((total / qty) * 100) / 100;
        }
      }

      // Mettre à jour l'aperçu dynamique du stock
      if (stockIdEl && stockIdEl.value && stockIdEl.value !== '__NEW_STOCK__' && previewTextEl) {
        const s = state.stocks.find(x => x.id === stockIdEl.value);
        if (s) {
          const newQty = Math.round((s.quantity + qty) * 100) / 100;
          previewTextEl.innerText = `Stock actuel : ${s.quantity} ${s.unit} ➔ Deviendra : ${newQty} ${s.unit}`;
          if (previewEl) previewEl.classList.remove('hidden');
        }
      }
    }

    function saveNewExpense() {
      const stockIdVal = document.getElementById('exp-stock-id').value;
      let label = document.getElementById('exp-label').value.trim();
      const amount = parseFloat(document.getElementById('exp-amount').value) || 0;
      const qty = parseFloat(document.getElementById('exp-qty').value) || 1;
      const unitPrice = parseFloat(document.getElementById('exp-unit-price').value) || (amount / qty);
      const supplier = document.getElementById('exp-supplier').value.trim();
      const autoStock = document.getElementById('exp-auto-stock').checked;

      // 1. Résolution de la catégorie
      let category = document.getElementById('exp-cat').value;
      if (category === '__NEW_CAT__') {
        const customCat = (document.getElementById('exp-custom-cat').value || '').trim();
        if (customCat) {
          category = customCat;
          if (!state.expenseCategories.includes(category)) {
            state.expenseCategories.push(category);
          }
        } else {
          category = 'Autre charge';
        }
      }

      // 2. Résolution de l'unité
      let unit = document.getElementById('exp-unit').value;
      if (unit === '__NEW_UNIT__') {
        const customUnit = (document.getElementById('exp-custom-unit').value || '').trim();
        if (customUnit) {
          unit = customUnit;
          if (!state.units.includes(unit)) {
            state.units.push(unit);
          }
        } else {
          unit = 'unités';
        }
      }

      if (!label && stockIdVal && stockIdVal !== '__NEW_STOCK__') {
        const s = state.stocks.find(x => x.id === stockIdVal);
        if (s) label = 'Achat ' + s.name;
      }
      if (!label) return alert('Veuillez saisir un libellé / motif pour la dépense.');
      if (amount <= 0) return alert('Le montant total doit être supérieur à 0 DA.');

      // 3. Mise à jour ou création du Stock si lié
      let linkedStockId = null;
      let isStockable = false;
      let stockMsg = '';

      if (stockIdVal === '__NEW_STOCK__') {
        const newStockName = (document.getElementById('exp-new-stock-name').value || '').trim() || label;
        const newStockId = 'stk_' + Date.now();
        state.stocks.push({
          id: newStockId,
          name: newStockName,
          category: category.includes('Sanitation') ? 'Sanitation' : (category.includes('Consommable') ? 'Consommable' : 'Matière première'),
          quantity: autoStock ? qty : 0,
          unit: unit,
          threshold: 5,
          cost: unitPrice > 0 ? unitPrice : 100
        });
        linkedStockId = newStockId;
        isStockable = true;
        stockMsg = ` • Nouvel article "${newStockName}" créé dans le stock (${qty} ${unit})`;
      } else if (stockIdVal) {
        linkedStockId = stockIdVal;
        isStockable = true;
        const s = state.stocks.find(x => x.id === stockIdVal);
        if (s && autoStock) {
          const oldQty = s.quantity;
          s.quantity = Math.round((s.quantity + qty) * 100) / 100;
          if (unitPrice > 0) s.cost = unitPrice;
          stockMsg = ` • Stock "${s.name}" actualisé : ${oldQty} ➔ ${s.quantity} ${s.unit}`;
        }
      }

      // 4. Enregistrement de la dépense
      const today = new Date();
      const dateStr = today.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
      const dateIso = today.toISOString().slice(0, 10);

      state.expenses.unshift({
        id: 'exp_' + Date.now(),
        label,
        amount,
        category,
        qty,
        unit,
        unitPrice: Math.round(unitPrice * 100) / 100,
        supplier,
        isStockable,
        stockItemId: linkedStockId,
        date: dateStr,
        dateIso
      });

      saveState();
      closeModal();
      showToast(`Dépense de ${amount.toLocaleString()} DA enregistrée !${stockMsg}`);
    }

    function deleteExpense(id) {
      const exp = state.expenses.find(e => e.id === id);
      if (!exp) return;

      let extraWarning = '';
      const linkedStock = (exp.isStockable && exp.stockItemId) ? state.stocks.find(s => s.id === exp.stockItemId) : null;
      if (linkedStock) {
        extraWarning = `\n\nCet achat avait augmenté le stock de "${linkedStock.name}" de +${exp.qty} ${exp.unit}.`;
      }

      if (confirm(`Supprimer la dépense "${exp.label}" (-${exp.amount.toLocaleString()} DA) ?${extraWarning}`)) {
        if (linkedStock && exp.qty > 0) {
          if (confirm(`Voulez-vous aussi déduire les ${exp.qty} ${exp.unit} qui avaient été ajoutés au stock de "${linkedStock.name}" ?`)) {
            linkedStock.quantity = Math.max(0, Math.round((linkedStock.quantity - exp.qty) * 100) / 100);
            showToast(`Dépense supprimée et ${exp.qty} ${exp.unit} retirés du stock.`);
          } else {
            showToast('Dépense supprimée (stock conservé).');
          }
        } else {
          showToast('Dépense retirée.');
        }

        state.expenses = state.expenses.filter(e => e.id !== id);
        saveState();
      }
    }

    // Modal Helpers
    function showModal(content) {
      document.getElementById('modal-container').innerHTML = content;
      document.getElementById('modal-backdrop').classList.remove('hidden');
    }
    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    function openScanModal() {
      showModal(`
        <h3 class="text-sm font-bold text-white mb-2 text-center flex items-center justify-center gap-1.5">
          <span>📷</span> <span>Scanner QR / Code Contenant</span>
        </h3>
        <p class="text-[10px] text-[#aaa] text-center mb-2">Sélectionnez ou simulez le scan d'un sac ou seau :</p>
        <div class="space-y-1.5 max-h-64 overflow-y-auto pr-1">
          ${state.bags.map(b => `
            <button onclick="closeModal(); switchTab('production'); openPrintLabelsModal(null, '${b.id}'); showToast('Contenant scanné : ' + '${b.id}');" class="w-full text-left bg-[#0f1a0f] p-2.5 rounded-xl border border-[#2d4a2d] text-xs flex justify-between items-center hover:border-[#7bc67e] transition-all">
              <div>
                <div class="flex items-center gap-1.5">
                  <span class="font-mono text-white font-bold">${b.id}</span>
                  <span class="text-[9px] px-1 rounded ${b.type === 'seau' ? 'bg-amber-900/60 text-amber-300' : 'bg-[#1a2a1a] text-[#aaa]'}">${b.type === 'seau' ? '🪣 Seau' : '🛍️ Sac'}</span>
                </div>
                <span class="text-[10px] text-[#888]">${b.tableId || 'Table'} • ${b.weight || 4.5} kg</span>
              </div>
              <span class="text-[10px] font-bold ${b.status === 'fruiting' ? 'text-[#7bc67e]' : (b.status === 'contaminated' ? 'text-[#e07a7a]' : 'text-[#e0b87a]')}">
                ${b.status === 'fruiting' ? '💧 Fructification' : (b.status === 'contaminated' ? '☣️ Contaminé' : '🌡️ Incubation')}
              </span>
            </button>
          `).join('')}
        </div>
        <button onclick="closeModal()" class="w-full mt-3 py-2.5 bg-[#2d4a2d] rounded-xl text-white text-xs font-bold">Fermer</button>
      `);
    }

    function updateClock() {
      const d = new Date();
      const h = d.getHours().toString().padStart(2, '0');
      const m = d.getMinutes().toString().padStart(2, '0');
      const el = document.getElementById('live-clock');
      if (el) el.innerText = `${h}:${m}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Initialisation
    checkBadges();
    setRole('admin');
  </script>
</body>
