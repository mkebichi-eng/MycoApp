<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MycoTrack - Simulateur Interactif</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    body { background-color: #050a05; color: #ffffff; }
    .bg-myco-dark { background-color: #0f1a0f; }
    .bg-myco-card { background-color: #1a2a1a; }
    .border-myco { border-color: #2d4a2d; }
    .text-myco-green { color: #7bc67e; }
    .bg-myco-green { background-color: #4a9e4e; }
    .text-myco-red { color: #e07a7a; }
    .text-myco-yellow { color: #e0b87a; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #2d4a2d; border-radius: 4px; }
  </style>
</head>
<body class="p-4 md:p-6 flex flex-col items-center justify-center min-h-screen">

  <!-- Header Banner -->
  <div class="max-w-4xl w-full mb-6 flex flex-col md:flex-row items-center justify-between gap-4 bg-[#1a2a1a] p-4 rounded-2xl border border-[#2d4a2d]">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl flex items-center justify-center text-2xl">
        🍄
      </div>
      <div>
        <h1 class="text-lg font-bold text-white flex items-center gap-2">
          <span>MycoTrack</span>
          <span class="text-[10px] bg-[#4a9e4e]/20 text-[#7bc67e] border border-[#7bc67e]/30 px-2 py-0.5 rounded-full">Design MycoTrack_01</span>
        </h1>
        <p class="text-xs text-slate-400">Gestion mycologique • Thème Dark Forest & Sécurité Firebase</p>
      </div>
    </div>

    <!-- Sélecteur de Rôles Interactif -->
    <div class="flex items-center bg-[#0f1a0f] p-1.5 rounded-xl border border-[#2d4a2d]">
      <button onclick="setRole('admin')" id="role-admin-btn" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-[#4a9e4e] text-white shadow">
        👑 Admin
      </button>
      <button onclick="setRole('prod')" id="role-prod-btn" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all">
        🌱 Opérateur
      </button>
      <button onclick="setRole('delivery')" id="role-delivery-btn" class="px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all">
        🛵 Livreur
      </button>
    </div>
  </div>

  <!-- Smartphone Frame -->
  <div class="w-full max-w-sm bg-[#0f1a0f] rounded-[40px] shadow-2xl border-[10px] border-slate-900 overflow-hidden flex flex-col relative" style="height: 760px;">

    <!-- Top Speaker Notch -->
    <div class="h-6 bg-slate-900 flex items-center justify-center">
      <div class="w-20 h-3.5 bg-black rounded-full flex items-center justify-end px-2">
        <div class="w-1.5 h-1.5 rounded-full bg-slate-800"></div>
      </div>
    </div>

    <!-- Header App Bar -->
    <header class="bg-[#0f1a0f] px-5 py-3.5 flex items-center justify-between border-b border-[#2d4a2d]/60">
      <div class="flex items-center gap-2">
        <span class="text-lg">🍄</span>
        <span class="font-bold text-base text-white tracking-wide">MycoTrack</span>
      </div>
      <div class="flex items-center gap-3">
        <span id="role-badge" class="bg-[#1a2a1a] text-[#7bc67e] text-[10px] uppercase font-bold px-2 py-0.5 rounded-md border border-[#2d4a2d]">
          Admin
        </span>
        <button onclick="alert('Notification FCM : 2 articles sous le seuil critique !')" class="text-sm">
          🔔
        </button>
      </div>
    </header>

    <!-- Scrollable Content -->
    <main id="app-content" class="flex-1 overflow-y-auto p-4 space-y-4 bg-[#0f1a0f]">
      <!-- Dynamic View Rendered by JS -->
    </main>

    <!-- Bottom Tab Bar -->
    <nav id="bottom-nav" class="bg-[#1a2a1a] border-t border-[#2d4a2d] px-3 py-2 flex justify-around text-center text-xs">
      <button onclick="showTab('dashboard')" id="nav-dash" class="flex flex-col items-center text-[#7bc67e] font-bold">
        <span class="text-base">🏠</span>
        <span class="text-[10px]">Accueil</span>
      </button>
      <button onclick="showTab('stock')" id="nav-stock" class="flex flex-col items-center text-slate-500 hover:text-[#7bc67e]">
        <span class="text-base">📦</span>
        <span class="text-[10px]">Stock</span>
      </button>
      <button onclick="showTab('bags')" id="nav-bags" class="flex flex-col items-center text-slate-500 hover:text-[#7bc67e]">
        <span class="text-base">🍄</span>
        <span class="text-[10px]">Sacs</span>
      </button>
      <button onclick="showTab('clients')" id="nav-clients" class="flex flex-col items-center text-slate-500 hover:text-[#7bc67e]">
        <span class="text-base">👤</span>
        <span class="text-[10px]">Clients</span>
      </button>
      <button onclick="showTab('sales')" id="nav-sales" class="flex flex-col items-center text-slate-500 hover:text-[#7bc67e]">
        <span class="text-base">💸</span>
        <span class="text-[10px]">Dépenses</span>
      </button>
    </nav>
  </div>

  <script>
    let currentRole = 'admin';
    let currentPeriod = 'month';

    const deliveriesData = [
      { id: '1', num: 'LIV-001', client: 'Restaurant Le Cèdre Bleu', addr: '14 Rue Didouche Mourad, Alger', phone: '+213550112233', qty: 8.5, fee: 400, status: 'pending' },
      { id: '2', num: 'LIV-002', client: 'Pizzeria Bella Vista', addr: '8 Boulevard Colonel Amirouche', phone: '+213661445566', qty: 5.0, fee: 350, status: 'pending' }
    ];

    function setRole(role) {
      currentRole = role;
      ['admin', 'prod', 'delivery'].forEach(r => {
        const btn = document.getElementById(`role-${r}-btn`);
        if (r === role) {
          btn.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-[#4a9e4e] text-white shadow";
        } else {
          btn.className = "px-3 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all";
        }
      });

      const roleBadge = document.getElementById('role-badge');
      const bottomNav = document.getElementById('bottom-nav');

      if (role === 'delivery') {
        roleBadge.innerText = "Livreur";
        roleBadge.className = "bg-[#3a2e1a] text-[#e0b87a] text-[10px] uppercase font-bold px-2 py-0.5 rounded-md border border-[#e0b87a]/30";
        bottomNav.classList.add('hidden');
        renderDeliveryView();
      } else {
        roleBadge.innerText = role === 'admin' ? "Admin" : "Opérateur";
        roleBadge.className = "bg-[#1a2a1a] text-[#7bc67e] text-[10px] uppercase font-bold px-2 py-0.5 rounded-md border border-[#2d4a2d]";
        bottomNav.classList.remove('hidden');
        renderDashboardView();
      }
    }

    function showTab(tab) {
      ['dash', 'stock', 'bags', 'clients', 'sales'].forEach(t => {
        const el = document.getElementById(`nav-${t}`);
        if (el) {
          if ((tab === 'dashboard' && t === 'dash') || 
              (tab === 'stock' && t === 'stock') || 
              (tab === 'bags' && t === 'bags') || 
              (tab === 'clients' && t === 'clients') || 
              (tab === 'sales' && t === 'sales')) {
            el.className = "flex flex-col items-center text-[#7bc67e] font-bold";
          } else {
            el.className = "flex flex-col items-center text-slate-500 hover:text-[#7bc67e]";
          }
        }
      });

      if (tab === 'dashboard') renderDashboardView();
      else if (tab === 'bags') renderBagsView();
      else if (tab === 'stock') renderStockView();
      else if (tab === 'clients') renderClientsView();
      else if (tab === 'sales') renderExpensesView();
    }

    // 1. DASHBOARD PRINCIPAL (STYLE EXACT MYCOTRACK)
    function renderDashboardView() {
      const container = document.getElementById('app-content');
      container.innerHTML = `
        <h2 class="text-xs font-bold text-[#7bc67e] tracking-wider uppercase mb-2">Résumé financier global</h2>
        
        <!-- KPI Cards Grid -->
        <div class="grid grid-cols-2 gap-2.5">
          <div class="bg-[#1a2a1a] p-3.5 rounded-2xl border border-[#2d4a2d]">
            <p class="text-[11px] text-[#888]">Chiffre d'affaires</p>
            <p class="text-base font-bold text-white mt-1">35 950 DA</p>
            <p class="text-[10px] text-[#666] mt-0.5">Total livraisons</p>
          </div>
          <div class="bg-[#1a2a1a] p-3.5 rounded-2xl border border-[#2d4a2d]">
            <p class="text-[11px] text-[#888]">Frais livreurs</p>
            <p class="text-base font-bold text-[#e0b87a] mt-1">1 350 DA</p>
            <p class="text-[10px] text-[#666] mt-0.5">Total courses</p>
          </div>
          <div class="bg-[#1a2a1a] p-3.5 rounded-2xl border border-[#2d4a2d]">
            <p class="text-[11px] text-[#888]">Dépenses</p>
            <p class="text-base font-bold text-[#e07a7a] mt-1">7 125 DA</p>
            <p class="text-[10px] text-[#666] mt-0.5">Achats + matériel</p>
          </div>
          <div class="bg-[#1a2a1a] p-3.5 rounded-2xl border border-[#2d4a2d]">
            <p class="text-[11px] text-[#888]">Bénéfice net</p>
            <p class="text-base font-bold text-[#7bc67e] mt-1">27 475 DA</p>
            <p class="text-[10px] text-[#666] mt-0.5">Marge réelle</p>
          </div>
          <div class="bg-[#1a2a1a] p-3.5 rounded-2xl border border-[#2d4a2d]">
            <p class="text-[11px] text-[#888]">Encaissé</p>
            <p class="text-base font-bold text-[#7bc67e] mt-1">30 450 DA</p>
          </div>
          <div class="bg-[#1a2a1a] p-3.5 rounded-2xl border border-[#2d4a2d]">
            <p class="text-[11px] text-[#888]">Impayés</p>
            <p class="text-base font-bold text-[#e0b87a] mt-1">5 500 DA</p>
            <p class="text-[10px] text-[#666] mt-0.5">1 client(s) +30j</p>
          </div>
        </div>

        <!-- Bénéfice net Graphique BarChart -->
        <h2 class="text-xs font-bold text-[#7bc67e] tracking-wider uppercase mt-4 mb-2">Bénéfice net</h2>
        <div class="flex gap-2 overflow-x-auto pb-1 text-xs">
          ${[['day','7 jours'],['month1','1 mois'],['month','6 mois'],['month12','12 mois'],['all','Tout']].map(([k,l]) => `
            <button onclick="currentPeriod='${k}'; renderDashboardView();" class="px-3 py-1.5 rounded-full border text-xs font-medium whitespace-nowrap ${currentPeriod === k ? 'bg-[#4a9e4e] text-white border-[#4a9e4e]' : 'border-[#2d4a2d] text-[#aaa]'}">
              ${l}
            </button>
          `).join('')}
        </div>

        <div class="bg-[#1a2a1a] p-4 rounded-2xl border border-[#2d4a2d] mt-2">
          <div class="flex items-end justify-between h-28 px-2 gap-2">
            ${[
              { lbl: 'Avr', val: '12.5k', h: '45%' },
              { lbl: 'Mai', val: '18.0k', h: '65%' },
              { lbl: 'Jun', val: '22.0k', h: '80%' },
              { lbl: 'Jul', val: '19.5k', h: '70%' },
              { lbl: 'Aoû', val: '25.0k', h: '90%' },
              { lbl: 'Sep', val: '27.4k', h: '100%' },
            ].map(b => `
              <div class="flex flex-col items-center flex-1">
                <span class="text-[9px] text-[#7bc67e] mb-1 font-mono">${b.val}</span>
                <div class="w-full bg-[#4a9e4e] rounded-t-sm transition-all" style="height: ${b.h}"></div>
                <span class="text-[9px] text-[#888] mt-1">${b.lbl}</span>
              </div>
            `).join('')}
          </div>
        </div>

        <!-- Alertes -->
        <h2 class="text-xs font-bold text-[#7bc67e] tracking-wider uppercase mt-4 mb-2">⚠️ Alertes</h2>
        <div class="space-y-2">
          <div class="bg-[#2a1a1a] p-3 rounded-xl border border-[#5a2a2a] text-xs text-[#e07a7a]">
            🔴 Stock bas — Sacs micro-perforés : 45 unités (Seuil : 50)
          </div>
          <div class="bg-[#2a1a1a] p-3 rounded-xl border border-[#5a2a2a] text-xs text-[#e07a7a]">
            🔴 Impayé +30j — Pizzeria Bella Vista : 5 500 DA
          </div>
        </div>

        <!-- Production sacs actifs -->
        <h2 class="text-xs font-bold text-[#7bc67e] tracking-wider uppercase mt-4 mb-2">🍄 Production — sacs actifs</h2>
        <div class="bg-[#1a2a1a] px-4 py-2 rounded-2xl border border-[#2d4a2d] text-xs divide-y divide-[#2d4a2d]">
          <div class="flex justify-between py-2 text-[#aaa]"><span>🧪 Ensemencement</span> <span class="font-bold text-white">0</span></div>
          <div class="flex justify-between py-2 text-[#aaa]"><span>🌡️ Incubation</span> <span class="font-bold text-white">21</span></div>
          <div class="flex justify-between py-2 text-[#aaa]"><span>🍄 Fructification</span> <span class="font-bold text-white">10</span></div>
          <div class="flex justify-between py-2 text-[#aaa]"><span>☣️ Contaminés</span> <span class="font-bold text-[#e07a7a]">1</span></div>
        </div>
      `;
    }

    // 2. VUE LIVREUR (STYLE EXACT MYDELIVERIES SCREEN)
    function renderDeliveryView() {
      const container = document.getElementById('app-content');
      container.innerHTML = `
        <h2 class="text-xs font-bold text-[#e0b87a] tracking-wider uppercase mb-2">🚚 Mes Livraisons du Jour</h2>
        <div class="space-y-3">
          ${deliveriesData.map(d => `
            <div class="bg-[#1a2a1a] p-4 rounded-2xl border ${d.status === 'confirmed' ? 'border-[#4a9e4e]' : 'border-[#2d4a2d]'} space-y-3">
              <div class="flex justify-between items-center">
                <span class="text-xs text-[#888] font-bold">${d.num}</span>
                <span class="px-2.5 py-1 rounded-full text-[10px] font-bold ${d.status === 'confirmed' ? 'bg-[#1f3a1f] text-[#7bc67e] border border-[#7bc67e]/30' : 'bg-[#3a2e1a] text-[#e0b87a] border border-[#e0b87a]/30'}">
                  ${d.status === 'confirmed' ? '✅ Confirmée' : '⏳ En attente'}
                </span>
              </div>

              <div>
                <h3 class="font-bold text-white text-sm">${d.client}</h3>
                <p class="text-xs text-[#7bc67e] font-semibold mt-0.5">🍄 ${d.qty} kg de pleurotes frais</p>
                <p class="text-xs text-[#aaa] mt-1">📍 ${d.addr}</p>
              </div>

              <div class="bg-[#0f1a0f] p-2 rounded-lg text-xs flex justify-between">
                <span class="text-[#888]">Tarif course :</span>
                <strong class="text-white">${d.fee} DA</strong>
              </div>

              ${d.status !== 'confirmed' ? `
                <div class="grid grid-cols-2 gap-2 pt-1">
                  <a href="tel:${d.phone}" class="py-2.5 bg-[#4a9e4e] text-white rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 shadow">
                    <span>📞</span> Appeler
                  </a>
                  <button onclick="alert('GPS vers : ' + '${d.addr}')" class="py-2.5 bg-[#1a2a1a] text-[#aaa] border border-[#2d4a2d] rounded-xl font-semibold text-xs flex items-center justify-center gap-1.5">
                    <span>🗺️</span> GPS
                  </button>
                </div>
                <button onclick="confirmDeliv('${d.id}')" class="w-full py-3 bg-[#1f3a1f] hover:bg-[#284a28] text-[#7bc67e] border border-[#7bc67e]/40 font-bold rounded-xl text-xs flex items-center justify-center gap-2 shadow">
                  <span>✅</span> Confirmer la livraison
                </button>
              ` : `
                <div class="text-center py-1 text-xs text-[#7bc67e] font-bold">
                  ✓ Course validée avec succès !
                </div>
              `}
            </div>
          `).join('')}
        </div>
      `;
    }

    function confirmDeliv(id) {
      const d = deliveriesData.find(x => x.id === id);
      if (d) d.status = 'confirmed';
      renderDeliveryView();
    }

    // 3. VUE SACS & LOTS (STYLE EXACT BAGSSCREEN)
    function renderBagsView() {
      const container = document.getElementById('app-content');
      container.innerHTML = `
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-xs font-bold text-[#7bc67e] tracking-wider uppercase">Lots & Sacs de culture</h2>
          <button onclick="alert('Ouverture caméra pour scan QR code')" class="text-xs bg-[#4a9e4e] text-white px-2.5 py-1 rounded-lg font-bold">📷 Scanner QR</button>
        </div>

        <div class="bg-[#1a2a1a] p-4 rounded-2xl border border-[#2d4a2d] space-y-2">
          <div class="flex justify-between items-start">
            <div>
              <span class="text-[10px] font-bold text-[#7bc67e] bg-[#0f1a0f] border border-[#2d4a2d] px-2 py-0.5 rounded-md">LOT-2026-09-01</span>
              <h3 class="font-bold text-white text-sm mt-1">Pleurote Gris HK35</h3>
            </div>
            <span class="text-xs font-bold text-[#7bc67e] bg-[#1f3a1f] px-2 py-0.5 rounded-full">🍄 Fructification</span>
          </div>

          <div class="bg-[#0f1a0f] p-2.5 rounded-xl text-xs space-y-1 text-[#aaa]">
            <p>Substrat : <strong class="text-white">Paille hachée</strong> (Fût 200L)</p>
            <p>Sacs générés : <strong class="text-white">32 sacs de 5kg</strong></p>
            <p>Efficacité biologique : <strong class="text-[#7bc67e]">75.0 % BE</strong></p>
          </div>

          <div class="grid grid-cols-2 gap-2 pt-2">
            <button onclick="alert('Pesée Vague 1 enregistrée pour ce lot !')" class="py-2 bg-[#2d4a2d] text-white text-xs font-bold rounded-xl">
              ⚖️ Peser Récolte
            </button>
            <button onclick="alert('Sac marqué comme contaminé Trichoderma et écarté.')" class="py-2 bg-[#3a1a1a] text-[#e07a7a] text-xs font-bold rounded-xl border border-[#5a2a2a]">
              ☣️ Déclarer Avarie
            </button>
          </div>
        </div>
      `;
    }

    // 4. VUE STOCKS (STYLE EXACT STOCKSCREEN)
    function renderStockView() {
      const container = document.getElementById('app-content');
      container.innerHTML = `
        <h2 class="text-xs font-bold text-[#7bc67e] tracking-wider uppercase mb-3">État des Stocks & Intrants</h2>
        <div class="space-y-2">
          <div class="bg-[#1a2a1a] p-3 rounded-2xl border border-[#5a2a2a] bg-[#2a1a1a]/30 flex justify-between items-center">
            <div>
              <p class="font-bold text-white text-xs">🔴 Sacs micro-perforés 5kg</p>
              <p class="text-[11px] text-[#e07a7a]">Reste : 45 unités (Seuil : 50)</p>
            </div>
            <button onclick="alert('Approvisionnement enregistré !')" class="px-2 py-1 bg-[#4a9e4e] text-white rounded-lg text-xs font-bold">+ Réappro</button>
          </div>

          <div class="bg-[#1a2a1a] p-3 rounded-2xl border border-[#2d4a2d] flex justify-between items-center">
            <div>
              <p class="font-bold text-white text-xs">🟢 Paille de blé hachée</p>
              <p class="text-[11px] text-[#aaa]">Stock : 180 kg (Seuil : 50 kg)</p>
            </div>
            <span class="text-xs font-bold text-[#7bc67e] bg-[#1f3a1f] px-2 py-0.5 rounded-md">OK</span>
          </div>

          <div class="bg-[#1a2a1a] p-3 rounded-2xl border border-[#2d4a2d] flex justify-between items-center">
            <div>
              <p class="font-bold text-white text-xs">🟢 Blanc Pleurote HK35</p>
              <p class="text-[11px] text-[#aaa]">Stock : 14 kg (Seuil : 10 kg)</p>
            </div>
            <span class="text-xs font-bold text-[#7bc67e] bg-[#1f3a1f] px-2 py-0.5 rounded-md">OK</span>
          </div>
        </div>
      `;
    }

    // 5. VUE CLIENTS
    function renderClientsView() {
      const container = document.getElementById('app-content');
      container.innerHTML = `
        <h2 class="text-xs font-bold text-[#7bc67e] tracking-wider uppercase mb-3">Répertoire Clients & Tarifs</h2>
        <div class="space-y-2">
          <div class="bg-[#1a2a1a] p-3.5 rounded-2xl border border-[#2d4a2d]">
            <div class="flex justify-between">
              <h3 class="font-bold text-white text-xs">Restaurant Le Cèdre Bleu</h3>
              <span class="text-[#7bc67e] font-bold text-xs">1 200 DA/kg</span>
            </div>
            <p class="text-[11px] text-[#aaa] mt-1">14 Rue Didouche Mourad, Alger</p>
          </div>
          <div class="bg-[#1a2a1a] p-3.5 rounded-2xl border border-[#2d4a2d]">
            <div class="flex justify-between">
              <h3 class="font-bold text-white text-xs">Pizzeria Bella Vista</h3>
              <span class="text-[#7bc67e] font-bold text-xs">1 100 DA/kg</span>
            </div>
            <p class="text-[11px] text-[#e07a7a] text-[10px] mt-1 font-semibold">🔴 Solde impayé : 5 500 DA (+30j)</p>
          </div>
        </div>
      `;
    }

    // 6. VUE DÉPENSES
    function renderExpensesView() {
      const container = document.getElementById('app-content');
      container.innerHTML = `
        <h2 class="text-xs font-bold text-[#7bc67e] tracking-wider uppercase mb-3">Dépenses de l'Exploitation</h2>
        <div class="space-y-2">
          <div class="bg-[#1a2a1a] p-3 rounded-2xl border border-[#2d4a2d] flex justify-between items-center text-xs">
            <div>
              <p class="font-bold text-white">Achat paille de blé (300 kg)</p>
              <p class="text-[10px] text-[#888]">15 Sep • Fournisseur Blida</p>
            </div>
            <span class="text-[#e07a7a] font-bold">-4 500 DA</span>
          </div>
