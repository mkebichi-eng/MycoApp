    .bg-myco-dark { background-color: #0f1a0f; }

    .text-myco-green { color: #7bc67e; }

    .text-myco-red { color: #e07a7a; }
    .text-myco-yellow { color: #e0b87a; }

    ::-webkit-scrollbar-thumb { background: #2d4a2d; border-radius: 4px; }
    @media print {
      body * { visibility: hidden !important; }
      #thermal-print-area, #thermal-print-area * { visibility: visible !important; }
      #thermal-print-area {

        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        background: white !important;
        color: black !important;
        z-index: 999999 !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      .thermal-label-sticker {
        width: 50mm !important;
        height: 30mm !important;
        page-break-after: always !important;
        break-after: page !important;
        margin: 0 !important;
        padding: 1.5mm !important;
        box-sizing: border-box !important;
        background: white !important;
        color: black !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: space-between !important;
        font-family: monospace !important;

    function formatDisplayDate(isoDateStr) {
      if (!isoDateStr) return '';
      const parts = isoDateStr.split('-');
      if (parts.length === 3) {
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
      }
      return isoDateStr;
    }

    function getTodayIso() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getYesterdayIso() {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function getNavDateDisplay(type) {
      const isSales = type === 'sales';
      const filterMode = isSales ? salesFilterMode : expenseFilterMode;
      const dateVal = isSales ? salesDateFilter : expenseDateFilter;
      const today = getTodayIso();
      const yesterday = getYesterdayIso();

      if (filterMode === 'today' || dateVal === today) {
        return 'Aujourd\'hui';
      }
      if (dateVal === yesterday) {
        return 'Hier';
      }
      if (dateVal) {
        const parts = dateVal.split('-');
        if (parts.length === 3) {
          return `${parts[2]}/${parts[1]}`;
        }
        return dateVal;
      }
      return 'Date';
    }

    function navigateDate(type, offset) {
      const isSales = type === 'sales';
      const curIso = isSales ? salesDateFilter : expenseDateFilter;
      const filterMode = isSales ? salesFilterMode : expenseFilterMode;

      let baseDate;
      if (curIso) {
        const [y, m, d] = curIso.split('-').map(Number);
        baseDate = new Date(y, m - 1, d);
      } else if (filterMode === 'today') {
        baseDate = new Date();
      } else {
        baseDate = new Date();
      }

      baseDate.setDate(baseDate.getDate() + offset);

      const y = baseDate.getFullYear();
      const m = String(baseDate.getMonth() + 1).padStart(2, '0');
      const d = String(baseDate.getDate()).padStart(2, '0');
      const newIso = `${y}-${m}-${d}`;

      if (isSales) {
        salesDateFilter = newIso;
        salesFilterMode = 'date';
        renderSalesView();
      } else {
        expenseDateFilter = newIso;
        expenseFilterMode = 'date';
        renderStockView();
      }
    }

    function switchTab(tab, subTab = null) {
      if (tab === 'bags') {

        tab = 'carnet';

      } else if (tab === 'deliverers') {

      } else if (tab === 'expenses') {
        tab = 'stock';
        stockSubTab = 'expenses';

      if (subTab) {
        if (tab === 'carnet') carnetSubTab = subTab;

              ⏱️ 5 Dernières
            </button>
            <button onclick="setSalesFilterMode('today')" class="px-2.5 py-1 rounded-lg font-bold whitespace-nowrap transition-all ${salesFilterMode === 'today' ? 'bg-[#7bc67e] text-[#0f1a0f] shadow' : 'bg-[#0f1a0f] text-[#aaa] border border-[#2d4a2d] hover:text-white'}">
              📅 Aujourd'hui (${todayCount})
            </button>
            <button onclick="setSalesFilterMode('unpaid')" class="px-2.5 py-1 rounded-lg font-bold whitespace-nowrap transition-all ${salesFilterMode === 'unpaid' ? 'bg-red-500 text-white shadow' : 'bg-[#0f1a0f] text-[#e07a7a] border border-[#2d4a2d] hover:border-red-500/50'}">
              🔴 Impayés (${unpaidCount})
            </button>
            <button onclick="setSalesFilterMode('all')" class="px-2.5 py-1 rounded-lg font-bold whitespace-nowrap transition-all ${salesFilterMode === 'all' ? 'bg-[#7bc67e] text-[#0f1a0f] shadow' : 'bg-[#0f1a0f] text-[#aaa] border border-[#2d4a2d] hover:text-white'}">
              📜 Tout (${state.deliveries.length})
            </button>
          </div>

          <!-- Sélecteur de date ergonomique jour par jour -->
          <div class="flex items-center bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-0.5 flex-shrink-0">
            <button onclick="navigateDate('sales', -1)" title="Jour précédent" class="px-2 py-1 text-slate-300 hover:text-white hover:bg-[#2d4a2d] active:scale-95 rounded-lg text-xs font-bold transition-all">
              ◀
            </button>
            <div class="relative flex items-center justify-center px-2 py-1 rounded-lg hover:bg-[#2d4a2d] transition-all cursor-pointer" onclick="this.querySelector('input')?.showPicker?.()">
              <span class="text-xs font-bold flex items-center gap-1 pointer-events-none ${(salesFilterMode === 'date' || salesFilterMode === 'today') ? 'text-[#7bc67e]' : 'text-slate-200'}">
                <span>🗓️</span>
                <span>${getNavDateDisplay('sales')}</span>
              </span>
              <input 
                type="date" 
                value="${salesDateFilter || getTodayIso()}" 
                onchange="onSalesDateChange(this.value)" 
                class="absolute inset-0 opacity-0 w-full h-full cursor-pointer z-10"
                title="Choisir une date au calendrier"
              />
            </div>
            <button onclick="navigateDate('sales', 1)" title="Jour suivant" class="px-2 py-1 text-slate-300 hover:text-white hover:bg-[#2d4a2d] active:scale-95 rounded-lg text-xs font-bold transition-all">
              ▶
            </button>
            ${(salesFilterMode === 'date' || salesDateFilter) ? `
              <button onclick="clearSalesDateFilter()" title="Réinitialiser (5 Dernières)" class="px-1.5 py-1 text-red-400 hover:text-red-300 hover:bg-red-950/40 rounded-lg text-xs font-bold transition-all ml-0.5">
                ✕
              </button>
            ` : ''}
          </div>
        </div>

        <!-- Indicateur de statut des ventes affichées -->
        <div class="flex justify-between items-center px-1 text-[11px] text-[#888] mt-2">
          <span>
            ${salesFilterMode === 'recent5' ? 'Affichage des <strong>5 dernières ventes</strong>' :
              (salesFilterMode === 'date' ? `Ventes du <strong>${formatDisplayDate(salesDateFilter)}</strong>` :
              (salesFilterMode === 'today' ? 'Ventes d\'<strong>aujourd\'hui</strong>' :
              (salesFilterMode === 'unpaid' ? 'Commandes avec <strong>reste à payer</strong>' :
              '<strong>Toutes les ventes</strong>')))}
          </span>
          <span class="text-[#7bc67e] font-mono font-bold">${filtered.length} affichée(s)</span>
        </div>

        <!-- Liste des Ventes filtrées -->
        <div class="space-y-2.5 mt-2">
          ${filtered.length === 0 ? `
            <div class="bg-[#1a2a1a] p-8 text-center rounded-2xl border border-[#2d4a2d]">
              <p class="text-sm text-[#888]">Aucune vente ne correspond à ce filtre.</p>
              ${salesFilterMode !== 'recent5' || salesSearchQuery ? `
                <button onclick="clearSalesDateFilter(); onSalesSearchInput('');" class="mt-3 px-3 py-1.5 bg-[#2d4a2d] text-white rounded-lg text-xs font-semibold">Réinitialiser le filtre</button>
              ` : `
                <button onclick="openNewSaleModal()" class="mt-3 px-3 py-1.5 bg-[#4a9e4e] text-white rounded-lg text-xs font-bold">+ Créer une Vente</button>
              `}
            </div>
          ` : ''}

          ${filtered.map(d => {
            const isSettled = d.status === 'settled';
            const isPendingAccept = d.status === 'pending_acceptance';
            const isInDelivery = d.status === 'in_delivery';
            const isDelivered = d.status === 'delivered_pending_settlement';

            return `
              <div class="bg-[#1a2a1a] p-3.5 rounded-2xl border ${isSettled ? 'border-[#2d4a2d]' : 'border-[#e0b87a] bg-[#1d271d]'} space-y-2">
                <div class="flex justify-between items-start">
                  <div>
                    <div class="flex items-center gap-2">
                      <span class="text-xs font-bold font-mono text-[#7bc67e] bg-[#0f1a0f] border border-[#2d4a2d] px-2 py-0.5 rounded-md">${d.orderNumber}</span>
                      <span class="text-[10px] text-[#888]">${d.createdAt}</span>
                    </div>
                    <h3 class="font-bold text-white text-sm mt-1">${d.clientName}</h3>
                  </div>

                  <!-- Badge statut commande -->
                  <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${
                    isSettled ? 'bg-[#1f3a1f] text-[#7bc67e] border border-[#7bc67e]/40' :
                    (isPendingAccept ? 'bg-amber-900/60 text-amber-300 border border-amber-500/40 animate-pulse' :
                    (isInDelivery ? 'bg-blue-900/60 text-blue-300 border border-blue-500/40' : 'bg-purple-900/60 text-purple-300 border border-purple-500/40'))
                  }">
                    ${isSettled ? '✅ Clôturée & Encaissée' :
                      (isPendingAccept ? '⏳ Livreur notifié (Attente)' :
                      (isInDelivery ? '🛵 En cours de livraison' : '📦 Livré (À clôturer)'))}
                  </span>
                </div>

                <!-- Détails financiers de la commande -->
                <div class="bg-[#0f1a0f] p-2.5 rounded-xl border border-[#2d4a2d] text-xs space-y-1">
                  <div class="flex justify-between text-[#aaa]">
                    <span>Quantité : <strong>${d.quantityKg} kg</strong> × ${d.pricePerKg} DA</span>
                    <strong class="text-white text-sm">${d.totalAmount.toLocaleString()} DA</strong>
                  </div>
                  <div class="flex justify-between text-[#aaa] border-t border-[#2d4a2d]/50 pt-1">
                    <span>Livreur assigné : <strong>${d.delivererName}</strong></span>
                    <span class="text-[#e0b87a]">Course : ${d.deliveryFee} DA</span>
                  </div>

                  ${isSettled ? `
                    <div class="flex justify-between text-xs border-t border-[#2d4a2d]/50 pt-1">
                      <span class="${d.clientRemainingDue > 0 ? 'text-[#e07a7a] font-bold' : 'text-[#7bc67e]'}">
                        ${d.clientRemainingDue > 0 ? `🔴 Reste à payer client : ${d.clientRemainingDue.toLocaleString()} DA` : '✓ Client a payé 100%'}
                      </span>
                      <strong class="text-[#7bc67e]">Net caisse : +${d.netCashToFarm.toLocaleString()} DA</strong>
                    </div>
                  ` : ''}
                </div>

                <p class="text-xs text-[#aaa]">📍 ${d.clientAddress}</p>

                <!-- Actions contextuelles selon statut -->
                <div class="flex gap-2 pt-1 border-t border-[#2d4a2d]/40">
                  <a href="tel:${d.clientPhone}" class="py-1.5 px-3 bg-[#1f3a1f] text-[#7bc67e] border border-[#7bc67e]/30 rounded-xl text-xs font-bold flex items-center justify-center gap-1">
                    <span>📞</span> <span>Client</span>
                  </a>

                  ${!isSettled ? `
                    <button onclick="openSettlementModal('${d.id}')" class="flex-1 py-1.5 bg-[#4a9e4e] text-white rounded-xl text-xs font-bold shadow hover:bg-emerald-600 flex items-center justify-center gap-1">
                      <span>💰</span> <span>Valider Paiement & Caisse</span>
                    </button>
                  ` : `
                    <button onclick="openSettlementModal('${d.id}')" class="flex-1 py-1.5 bg-[#1a2a1a] text-slate-300 border border-[#2d4a2d] rounded-xl text-xs font-semibold flex items-center justify-center gap-1">
                      <span>🔍</span> <span>Voir Reçu Caisse</span>
                    </button>
                  `}
                </div>
              </div>
            `;
          }).join('')}

          <!-- Option ergonomique : Bouton déroulant pour voir l'historique complet -->
          ${isTruncated5 ? `
            <div class="pt-2">
              <button onclick="setSalesFilterMode('all')" class="w-full py-3 bg-[#1a2a1a] hover:bg-[#223822] text-[#7bc67e] border border-[#2d4a2d] rounded-2xl text-xs font-bold transition-all shadow flex items-center justify-center gap-2">
                <span>📜</span>
                <span>Afficher les ${state.deliveries.length - 5} ventes plus anciennes</span>
                <span>↓</span>
              </button>
            </div>
          ` : ''}

          ${(salesFilterMode === 'all' && state.deliveries.length > 5) ? `
            <div class="pt-2">
              <button onclick="setSalesFilterMode('recent5')" class="w-full py-2 bg-[#1a2a1a] hover:bg-[#223822] text-[#aaa] border border-[#2d4a2d] rounded-2xl text-xs font-semibold transition-all flex items-center justify-center gap-1">
                <span>▲</span>
                <span>Réduire aux 5 dernières ventes</span>
              </button>
            </div>
          ` : ''}
        </div>
      `;
    }

    // Modale de Création de Vente avec calculs automatiques
    function openNewSaleModal(preselectedClientId = null) {
      showModal(`
        <h3 class="text-sm font-bold text-white mb-2 flex items-center gap-1.5">
          <span>🛒</span> <span>Créer une Vente & Assigner un Livreur</span>
        </h3>
        <p class="text-[11px] text-[#888] mb-3">Sélectionnez le client et le livreur. Les montants et frais se calculent automatiquement.</p>
        
        <div class="space-y-2.5 text-xs">
          <!-- 1. Client -->
          <div>
            <label class="text-[#888] block mb-1">Client acheteur *</label>
            <select id="vte-client-id" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white" onchange="recalculateSaleForm()">
              ${state.clients.map(c => `
                <option value="${c.id}" ${c.id === preselectedClientId ? 'selected' : ''}>
                  ${c.name} — (${c.price} DA / kg)
                </option>
              `).join('')}
            </select>
          </div>

          <!-- 2. Quantité vendue -->
          <div>
            <label class="text-[#888] block mb-1">Quantité de pleurotes frais (kg) *</label>
            <input id="vte-qty" type="number" step="0.5" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-3 text-white text-lg font-bold" value="5.0" oninput="recalculateSaleForm()">
          </div>

          <!-- 3. Livreur assigné & Prix de la course (Modifiable) -->
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[#888] block mb-1">Livreur assigné *</label>
              <select id="vte-deliverer-id" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white" onchange="onSaleDelivererChanged()">
                ${(state.deliverers || []).map(deliv => `
                  <option value="${deliv.id}">
                    ${deliv.name} (${deliv.vehicle || 'Livreur'})
                  </option>
                `).join('')}
              </select>
            </div>
            <div>
              <label class="text-[#888] block mb-1">Course livreur (DA) *</label>
              <input id="vte-course-fee" type="number" step="50" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white font-bold" oninput="recalculateSaleForm()">
            </div>
          </div>

          <!-- 4. Récapitulatif calculé en direct -->
          <div id="vte-calc-summary" class="bg-[#0f1a0f] p-3 rounded-xl border border-[#7bc67e]/40 space-y-1.5 text-xs">
            <!-- Rempli par recalculateSaleForm() -->
          </div>

          <div class="pt-2 flex gap-2">
            <button onclick="closeModal()" class="flex-1 py-2.5 bg-[#2d4a2d] rounded-xl text-white font-bold">Annuler</button>
            <button onclick="saveNewSale()" class="flex-1 py-2.5 bg-[#4a9e4e] rounded-xl text-white font-bold shadow hover:bg-emerald-600">
              Valider & Notifier Livreur
            </button>
          </div>
        </div>
      `);
      
      const firstDeliv = (state.deliverers || [])[0];
      if (firstDeliv) {
        document.getElementById('vte-course-fee').value = firstDeliv.fee;
      }
      recalculateSaleForm();
    }

    function onSaleDelivererChanged() {
      const delivId = document.getElementById('vte-deliverer-id').value;
      const deliverer = (state.deliverers || []).find(d => d.id === delivId);
      if (deliverer) {
        document.getElementById('vte-course-fee').value = deliverer.fee;
      }
      recalculateSaleForm();
    }

    function recalculateSaleForm() {
      const cliId = document.getElementById('vte-client-id').value;
      const client = state.clients.find(c => c.id === cliId);
      const qty = parseFloat(document.getElementById('vte-qty').value) || 0;
      const delivId = document.getElementById('vte-deliverer-id').value;
      const deliverer = (state.deliverers || []).find(d => d.id === delivId);
      const fee = parseFloat(document.getElementById('vte-course-fee').value) || (deliverer ? deliverer.fee : 0);

      if (!client || !deliverer) return;

      const totalFacture = Math.round(qty * client.price);
      const netEstime = totalFacture - fee;

      document.getElementById('vte-calc-summary').innerHTML = `
        <div class="flex justify-between text-[#aaa]">
          <span>Prix négocié client :</span>
          <span class="text-white font-semibold">${client.price} DA / kg</span>
        </div>
        <div class="flex justify-between text-[#aaa]">
          <span>Total facturé client :</span>
          <strong class="text-white text-sm">${totalFacture.toLocaleString()} DA</strong>
        </div>
        <div class="flex justify-between text-[#aaa] border-t border-[#2d4a2d] pt-1">
          <span>Frais course livreur :</span>
          <span class="text-[#e0b87a] font-semibold">${fee} DA <span class="text-[10px] text-[#888]">(modifiable)</span></span>
        </div>
        <div class="flex justify-between text-xs pt-1 border-t border-[#7bc67e]/30">
          <span class="text-[#7bc67e]">Net caisse estimé (si payé 100%) :</span>
          <strong class="text-[#7bc67e] text-sm">+${netEstime.toLocaleString()} DA</strong>
        </div>
      `;
    }

    function saveNewSale() {
      const cliId = document.getElementById('vte-client-id').value;
      const client = state.clients.find(c => c.id === cliId);
      const qty = parseFloat(document.getElementById('vte-qty').value) || 0;
      const delivId = document.getElementById('vte-deliverer-id').value;
      const deliverer = (state.deliverers || []).find(d => d.id === delivId);
      const fee = parseFloat(document.getElementById('vte-course-fee').value) || (deliverer ? deliverer.fee : 350);

      if (!client || qty <= 0 || !deliverer) return alert('Veuillez saisir une quantité valide.');

      const totalAmount = Math.round(qty * client.price);
      const orderNum = 'VTE-2026-' + String(state.deliveries.length + 1).padStart(3, '0');

      const newOrder = {
        id: 'vte_' + Date.now(),
        orderNumber: orderNum,
        clientId: client.id,
        clientName: client.name,
        clientPhone: client.phone,
        clientAddress: client.address,
        quantityKg: qty,
        pricePerKg: client.price,
        totalAmount: totalAmount,
        delivererId: deliverer.id,
        delivererName: deliverer.name,
        deliveryFee: fee, // Tarif course modifiable pour cette vente
        status: 'pending_acceptance', // Actif pour le livreur !
        isClientPaid: false,
        amountCollected: 0,
        clientRemainingDue: totalAmount,
        delivererFeeDeducted: 0,
        netCashToFarm: 0,
        dateIso: new Date().toISOString().slice(0, 10),
        createdAt: new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
      };

      state.deliveries.unshift(newOrder);
      saveState();
      closeModal();
      showToast(`Vente ${orderNum} créée ! Livreur ${deliverer.name} notifié (Course : ${fee} DA).`);
    }

    // ==========================================
    // 3. VALIDATION ENCAISSEMENT & DÉCOMPTE CAISSE
    // ==========================================
    function openSettlementModal(orderId) {
      const d = state.deliveries.find(x => x.id === orderId);
      if (!d) return;

      showModal(`
        <h3 class="text-sm font-bold text-white mb-1 flex items-center gap-1.5">
          <span>💰</span> <span>Validation Encaissement & Décompte Caisse</span>
        </h3>
        <p class="text-xs text-[#7bc67e] mb-2 font-mono">${d.orderNumber} • ${d.clientName}</p>

        <div class="bg-[#0f1a0f] p-3 rounded-2xl border border-[#2d4a2d] space-y-1.5 text-xs mb-3">
          <div class="flex justify-between text-[#aaa]">
            <span>Marchandise livrée :</span>
            <span class="text-white font-bold">${d.quantityKg} kg à ${d.pricePerKg} DA/kg</span>
          </div>
          <div class="flex justify-between text-[#aaa]">
            <span>Total dû par le client :</span>
            <strong class="text-white text-base">${d.totalAmount.toLocaleString()} DA</strong>
          </div>
          <div class="flex justify-between text-[#aaa]">
            <span>Frais du livreur (${d.delivererName}) :</span>
            <strong class="text-[#e0b87a]">${d.deliveryFee} DA</strong>
          </div>
        </div>

        <div class="space-y-3 text-xs">
          <!-- Question : Le client a-t-il payé ? -->
          <div>
            <label class="text-white font-bold block mb-1.5">Le client a-t-il réglé la commande ?</label>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="setClientPaymentChoice(true, ${d.totalAmount}, ${d.deliveryFee})" id="btn-pay-yes" class="py-2.5 rounded-xl border border-[#4a9e4e] bg-[#1f3a1f] text-[#7bc67e] font-bold text-xs flex items-center justify-center gap-1">
                <span>✅</span> <span>OUI (Payé 100%)</span>
              </button>
              <button onclick="setClientPaymentChoice(false, ${d.totalAmount}, ${d.deliveryFee})" id="btn-pay-no" class="py-2.5 rounded-xl border border-[#e07a7a]/50 bg-[#2a1a1a] text-[#e07a7a] font-bold text-xs flex items-center justify-center gap-1">
                <span>⚠️</span> <span>NON / Partiel</span>
              </button>
            </div>
          </div>

          <!-- Montant effectivement perçu -->
          <div id="collected-box" class="space-y-1">
            <label class="text-[#888] block">Montant effectivement perçu du client (DA) :</label>
            <input id="collected-input" type="number" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-3 text-white text-lg font-bold" value="${d.totalAmount}" oninput="updateSettlementBreakdown(${d.totalAmount}, ${d.deliveryFee})">
          </div>

          <!-- Décompte automatique en direct -->
          <div id="settlement-breakdown" class="bg-[#142214] p-3 rounded-2xl border border-[#4a9e4e]/40 space-y-2 text-xs">
            <!-- Rempli dynamiquement -->
          </div>

          <div class="pt-2 flex gap-2">
            <button onclick="closeModal()" class="flex-1 py-2.5 bg-[#2d4a2d] rounded-xl text-white font-bold">Annuler</button>
            <button onclick="applySettlement('${d.id}')" class="flex-1 py-2.5 bg-[#4a9e4e] rounded-xl text-white font-bold shadow hover:bg-emerald-600">
              Valider & Clôturer Caisse
            </button>
          </div>
        </div>
      `);

      updateSettlementBreakdown(d.totalAmount, d.deliveryFee);
    }

    function setClientPaymentChoice(isFull, totalAmount, fee) {
      const input = document.getElementById('collected-input');
      const yesBtn = document.getElementById('btn-pay-yes');
      const noBtn = document.getElementById('btn-pay-no');

      if (isFull) {
        input.value = totalAmount;
        yesBtn.className = "py-2.5 rounded-xl border-2 border-[#4a9e4e] bg-[#1f3a1f] text-[#7bc67e] font-bold text-xs shadow";
        noBtn.className = "py-2.5 rounded-xl border border-[#2d4a2d] bg-[#1a2a1a] text-slate-400 font-semibold text-xs";
      } else {
        input.value = 0;
        noBtn.className = "py-2.5 rounded-xl border-2 border-[#e07a7a] bg-[#3a1a1a] text-[#e07a7a] font-bold text-xs shadow";
        yesBtn.className = "py-2.5 rounded-xl border border-[#2d4a2d] bg-[#1a2a1a] text-slate-400 font-semibold text-xs";
      }
      updateSettlementBreakdown(totalAmount, fee);
    }

    function updateSettlementBreakdown(totalAmount, delivererFee) {
      const val = parseFloat(document.getElementById('collected-input').value) || 0;
      const remainingDue = Math.max(0, totalAmount - val);
      const isFeeCovered = val >= delivererFee;
      const netToFarm = isFeeCovered ? (val - delivererFee) : 0;
      const delivererDueFromFarm = isFeeCovered ? 0 : (delivererFee - val);

      document.getElementById('settlement-breakdown').innerHTML = `
        <div class="flex justify-between text-xs">
          <span class="text-[#aaa]">Reste à payer client (Impayé) :</span>
          <strong class="${remainingDue > 0 ? 'text-[#e07a7a] text-sm font-bold' : 'text-[#7bc67e]'}">
            ${remainingDue > 0 ? `${remainingDue.toLocaleString()} DA` : '0 DA (✓ Réglé)'}
          </strong>
        </div>

        <div class="flex justify-between text-xs border-t border-[#2d4a2d] pt-1.5">
          <span class="text-[#aaa]">Frais livreur déduits sur cash :</span>
          <strong class="text-[#e0b87a]">-${delivererFee} DA</strong>
        </div>

        <div class="flex justify-between text-xs border-t border-[#7bc67e]/40 pt-1.5">
          <span class="text-[#7bc67e] font-bold">Net remis en Caisse Ferme :</span>
          <strong class="text-[#7bc67e] text-base font-bold">+${netToFarm.toLocaleString()} DA</strong>
        </div>

        ${delivererDueFromFarm > 0 ? `
          <p class="text-[10px] text-[#e07a7a] bg-[#2a1a1a] p-1.5 rounded-lg border border-[#5a2a2a] mt-1">
            ⚠️ Attention : Le client n'a pas versé assez pour payer la course. La ferme doit encore régler <strong>${delivererDueFromFarm} DA</strong> au livreur.
          </p>
        ` : ''}
      `;
    }

    function applySettlement(orderId) {
      const d = state.deliveries.find(x => x.id === orderId);
      if (!d) return;

      const collected = parseFloat(document.getElementById('collected-input').value) || 0;
      const remainingDue = Math.max(0, d.totalAmount - collected);
      const isFeeCovered = collected >= d.deliveryFee;
      const netToFarm = isFeeCovered ? (collected - d.deliveryFee) : 0;

      // Mise à jour de la commande
      d.status = 'settled';
      d.amountCollected = collected;
      d.clientRemainingDue = remainingDue;
      d.isClientPaid = remainingDue === 0;
      d.delivererFeeDeducted = d.deliveryFee;
      d.netCashToFarm = netToFarm;

      // Mise à jour du compte client (si impayé)
      const client = state.clients.find(c => c.id === d.clientId);
      if (client) {
        if (remainingDue > 0) {
          client.due = (client.due || 0) + remainingDue;
        }
      }

      saveState();
      closeModal();
      showToast(`Commande ${d.orderNumber} clôturée ! Net en caisse : +${netToFarm.toLocaleString()} DA`);
    }

    function saveNewDeliverer() {
      const name = document.getElementById('deliv-name').value.trim();
      const phone = document.getElementById('deliv-phone').value.trim();
      const vehicle = document.getElementById('deliv-vehicle').value;
      const address = document.getElementById('deliv-address').value.trim();
      const fee = parseFloat(document.getElementById('deliv-fee').value) || 350;

      if (!name) return alert('Nom obligatoire.');
      if (!phone || phone === '+213') return alert('Numéro de téléphone obligatoire.');

      if (!state.deliverers) state.deliverers = [];

      state.deliverers.unshift({
        id: 'deliv_' + Date.now(),
        name,
        phone,
        vehicle,
        address: address || 'Alger',
        fee,
        status: 'active'
      });

      saveState();
      closeModal();
      showToast(`Livreur ${name} ajouté au Carnet Pro !`);
    }

    function deleteDeliverer(id) {
      const d = (state.deliverers || []).find(x => x.id === id);
      if (!d) return;

      // Vérifier les livraisons en cours
      const pendingDeliveries = state.deliveries.filter(x => x.delivererId === id && (x.status === 'in_delivery' || x.status === 'pending_acceptance'));
      if (pendingDeliveries.length > 0) {
        return alert(`Impossible de supprimer ${d.name} car il a ${pendingDeliveries.length} livraison(s) en cours. Terminez ou réassignez d'abord ces livraisons.`);
      }

      if (confirm(`Confirmer la suppression du livreur "${d.name}" du Carnet Pro ?`)) {
        state.deliverers = state.deliverers.filter(x => x.id !== id);
        saveState();
        showToast(`Livreur ${d.name} supprimé.`);
      }
    }

          <div>
            <label class="text-[#888] block mb-1">Adresse</label>
            <input id="cli-address" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white" placeholder="ex: 12 Rue Hassiba Ben Bouali">

          </div>

      `);

    function saveNewClient() {
      const name = document.getElementById('cli-name').value.trim();
      const contact = document.getElementById('cli-contact').value.trim();
      const type = document.getElementById('cli-type').value;
      const phone = document.getElementById('cli-phone').value.trim();
      const address = document.getElementById('cli-address').value.trim();
      const city = document.getElementById('cli-city').value.trim();
      const price = parseFloat(document.getElementById('cli-price').value) || 1200;

      if (!name) return alert('Nom obligatoire.');
      if (!phone || phone === '+213') return alert('Téléphone obligatoire.');

      state.clients.unshift({
        id: 'cli_' + Date.now(),
        name, contact, type, phone,
        address: address || 'Alger',
        city: city || 'Alger',
        price, due: 0
      });

      saveState();
      closeModal();
      showToast('Client enregistré !');
    }

    function openEditClientModal(id) {
      const c = state.clients.find(x => x.id === id);
      if (!c) return;
      showModal(`
        <h3 class="text-sm font-bold text-white mb-2">Modifier Client : ${c.name}</h3>
        <div class="space-y-2 text-xs">
          <div>
            <label class="text-[#888] block mb-1">Tarif négocié (DA/kg)</label>
            <input id="edit-cli-price" type="number" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white font-bold" value="${c.price}">
          </div>
          <div>
            <label class="text-[#888] block mb-1">Solde d'impayé / Dû (DA)</label>
            <input id="edit-cli-due" type="number" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white font-bold" value="${c.due || 0}">
          </div>
          <div>
            <label class="text-[#888] block mb-1">Téléphone</label>
            <input id="edit-cli-phone" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white font-mono" value="${c.phone}">
          </div>
          <div class="pt-3 flex gap-2">
            <button onclick="closeModal()" class="flex-1 py-2.5 bg-[#2d4a2d] rounded-xl text-white font-bold">Annuler</button>
            <button onclick="applyEditClient('${id}')" class="flex-1 py-2.5 bg-[#4a9e4e] rounded-xl text-white font-bold">Sauvegarder</button>
          </div>
        </div>
      `);
    }

    function applyEditClient(id) {
      const c = state.clients.find(x => x.id === id);
      if (!c) return;
      c.price = parseFloat(document.getElementById('edit-cli-price').value) || c.price;
      c.due = parseFloat(document.getElementById('edit-cli-due').value) || 0;
      c.phone = document.getElementById('edit-cli-phone').value.trim();
      saveState();
      closeModal();
      showToast('Client mis à jour !');
    }

    function deleteClient(id) {
      const c = state.clients.find(x => x.id === id);
      if (!c) return;
      if (confirm(`Supprimer le client "${c.name}" ?`)) {
        state.clients = state.clients.filter(x => x.id !== id);
        saveState();
        showToast('Client supprimé.');
      }
    }

    // ==========================================
    // 6. GESTION FUSIONNÉE : STOCKS & ACHATS
    // ==========================================
    // ==========================================
    // 6. GESTION FUSIONNÉE : STOCKS & ACHATS
    // ==========================================
    let expenseFilterMode = 'recent5'; // 'recent5' | 'today' | 'month' | 'stock' | 'operational' | 'all' | 'date'
    let expenseDateFilter = '';

    function setExpenseFilterMode(mode) {
      expenseFilterMode = mode;
      if (mode !== 'date') {
        expenseDateFilter = '';
      }
      renderStockView();
    }

    function onExpenseDateChange(val) {
      expenseDateFilter = val;
      if (val) {
        expenseFilterMode = 'date';
      } else {
        expenseFilterMode = 'recent5';
      }
      renderStockView();
    }

    function clearExpenseDateFilter() {
      expenseDateFilter = '';
      expenseFilterMode = 'recent5';
      renderStockView();
    }

    function renderStockView() {
      const container = document.getElementById('app-content');
      
      const totalStockItems = state.stocks.length;
      const lowCount = state.stocks.filter(s => s.quantity <= s.threshold).length;
      const totalExpenses = state.expenses.reduce((sum, e) => sum + (e.amount || 0), 0);

      container.innerHTML = `
        <!-- Entête Titre & Bouton d'action contextuel -->
        <div class="flex justify-between items-center mb-1.5">
          <div>
            <h2 class="text-xs font-bold text-[#7bc67e] tracking-wider uppercase flex items-center gap-1.5">
              <span>📦</span> <span>STOCKS & ACHATS</span>
            </h2>
            <p class="text-[10px] text-[#888]">${totalStockItems} articles suivis • ${totalExpenses.toLocaleString()} DA engagés</p>
          </div>
          <div class="flex items-center gap-1.5">
            ${stockSubTab === 'stocks' ? `
              <button onclick="openNewStockModal()" class="text-[10px] bg-[#223822] hover:bg-[#2e4d2e] text-[#7bc67e] border border-[#7bc67e]/40 px-2.5 py-1.5 rounded-xl font-bold transition-all flex items-center gap-1">
                <span>+</span> <span>Nouvel Article</span>
              </button>
              <button onclick="openNewExpenseModal()" class="text-[10px] bg-[#4a9e4e] text-white px-2.5 py-1.5 rounded-xl font-bold shadow hover:bg-emerald-600 transition-all flex items-center gap-1">
                <span>🛒</span> <span>Acheter / Dépense</span>
              </button>
            ` : `
              <button onclick="openNewExpenseModal()" class="text-[10px] bg-[#4a9e4e] text-white px-3 py-1.5 rounded-xl font-bold shadow hover:bg-emerald-600 transition-all flex items-center gap-1">
                <span>+</span> <span>Nouvelle Dépense</span>
              </button>
            `}
          </div>
        </div>

        <!-- Commutateur d'onglets ergonomique (2 vues unifiées) -->
        <div class="flex bg-[#142214] p-1 rounded-2xl border border-[#2d4a2d] mb-2.5 select-none">
          <button onclick="setStockSubTab('stocks')" class="flex-1 py-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1.5 ${
            stockSubTab === 'stocks' ? 'bg-[#2d5a2d] text-white shadow' : 'text-slate-400 hover:text-white'
          }">
            <span>📦</span>
            <span>État des Stocks (${totalStockItems})</span>
            ${lowCount > 0 ? `<span class="px-1.5 py-0.2 bg-red-600 text-white text-[9px] rounded-full font-bold">${lowCount}</span>` : ''}
          </button>
          <button onclick="setStockSubTab('expenses')" class="flex-1 py-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1.5 ${
            stockSubTab === 'expenses' ? 'bg-[#2d5a2d] text-white shadow' : 'text-slate-400 hover:text-white'
          }">
            <span>💸</span>
            <span>Dépenses & Achats (${state.expenses.length})</span>
          </button>
        </div>

        ${stockSubTab === 'stocks' ? renderStocksSubViewHtml(lowCount) : renderExpensesSubViewHtml(totalExpenses)}
      `;
    }

    function renderStocksSubViewHtml(lowCount) {
      return `
        <!-- Statut du Stock (Alerte uniquement si nécessaire, sans estimation inutile) -->
        ${lowCount > 0 ? `
          <div class="mb-2.5 p-2 bg-[#2a1a1a]/70 border border-[#5a2a2a] rounded-xl flex items-center justify-between text-xs text-[#e07a7a]">
            <span class="flex items-center gap-1.5 font-bold">
              <span>⚠️</span> <span>${lowCount} article(s) sous le seuil d'alerte critique</span>
            </span>
            <span class="text-[10px] text-red-300 font-semibold">Réapprovisionnement requis</span>
          </div>
        ` : `
          <div class="mb-2.5 px-2.5 py-1.5 bg-[#142214] border border-[#2d4a2d] rounded-xl flex items-center justify-between text-[11px] text-[#7bc67e]">
            <span class="flex items-center gap-1.5">
              <span>🟢</span> <span>Tous les stocks sont au-dessus du seuil limite</span>
            </span>
            <span class="text-[10px] text-[#888]">${state.stocks.length} articles suivis</span>
          </div>
        `}

        <!-- Liste des Articles en Stock -->
        <div class="space-y-2">
          ${state.stocks.length === 0 ? `
            <div class="bg-[#1a2a1a] p-6 rounded-2xl border border-[#2d4a2d] text-center text-[#888] text-xs">
              Aucun article en stock. Cliquez sur <strong>+ Nouvel Article</strong> pour commencer.
            </div>
          ` : state.stocks.map(s => {
            const isLow = s.quantity <= s.threshold;
            return `
              <div class="bg-[#1a2a1a] p-3 rounded-2xl border ${isLow ? 'border-[#5a2a2a] bg-[#2a1a1a]/40' : 'border-[#2d4a2d]'} space-y-2">
                <div class="flex justify-between items-start">
                  <div>
                    <div class="flex items-center gap-1.5 flex-wrap">
                      <span>${isLow ? '🔴' : '🟢'}</span>
                      <h3 class="font-bold text-white text-xs">${s.name}</h3>
                      <span class="text-[9px] text-[#888] bg-[#0f1a0f] border border-[#2d4a2d] px-1.5 py-0.5 rounded font-medium">${s.category || 'Intrant'}</span>
                    </div>

                    <!-- Stock actuel & Seuil limite modifiable d'un clic -->
                    <div class="flex items-center gap-2 mt-1 flex-wrap">
                      <p class="text-[11px] ${isLow ? 'text-[#e07a7a] font-bold' : 'text-slate-300'}">
                        Stock actuel : <strong class="text-sm text-white">${s.quantity} ${s.unit}</strong>
                      </p>
                      <button onclick="openEditThresholdModal('${s.id}')" class="text-[10px] bg-[#0f1a0f] hover:bg-[#1f2f1f] text-slate-300 hover:text-[#7bc67e] border border-[#2d4a2d] hover:border-[#7bc67e] px-2 py-0.5 rounded-lg flex items-center gap-1 transition-all" title="Changer le seuil d'alerte">
                        <span>Seuil alerte : <strong>${s.threshold} ${s.unit}</strong></span>
                        <span class="text-[10px]">✏️</span>
                      </button>
                    </div>

                    <p class="text-[10px] text-[#888] mt-0.5">
                      Coût d'achat moyen : <strong class="text-[#7bc67e] font-mono">${s.cost || 0} DA / ${s.unit}</strong>
                    </p>
                  </div>
                  <div class="flex items-center gap-0.5">
                    <button onclick="openEditThresholdModal('${s.id}')" class="text-slate-400 hover:text-[#7bc67e] text-xs p-1" title="Modifier seuil & coût">⚙️</button>
                    <button onclick="deleteStockItem('${s.id}')" class="text-slate-500 hover:text-red-400 text-xs p-1" title="Supprimer">🗑️</button>
                  </div>
                </div>

                <!-- Actions directes : Entrée, Sortie, et Réapprovisionnement/Achat -->
                <div class="grid grid-cols-3 gap-1.5 pt-1.5 border-t border-[#2d4a2d]/50">
                  <button onclick="openStockMvtModal('${s.id}', 'in')" class="py-1.5 bg-[#1f3a1f] hover:bg-[#2e4d2e] text-[#7bc67e] border border-[#7bc67e]/30 rounded-xl text-[11px] font-bold">
                    + Entrée
                  </button>
                  <button onclick="openStockMvtModal('${s.id}', 'out')" class="py-1.5 bg-[#2a1a1a] hover:bg-[#3a2020] text-[#e07a7a] border border-[#e07a7a]/30 rounded-xl text-[11px] font-bold">
                    - Sortie
                  </button>
                  <button onclick="openNewExpenseModal('${s.id}')" class="py-1.5 bg-[#3a301a] hover:bg-[#4a3e20] text-[#e0b87a] border border-[#e0b87a]/40 rounded-xl text-[11px] font-bold flex items-center justify-center gap-1" title="Acheter et mettre à jour le stock">
                    <span>🛒</span> <span>Acheter</span>
                  </button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderExpensesSubViewHtml(totalExpenses) {
      const todayIso = new Date().toISOString().slice(0, 10);
      const currentMonthPrefix = todayIso.slice(0, 7); // 'YYYY-MM'

      let filtered = [...state.expenses];

      if (expenseFilterMode === 'date' && expenseDateFilter) {
        filtered = filtered.filter(e => 
          (e.dateIso && e.dateIso === expenseDateFilter) ||
          (e.date && e.date.includes(formatDisplayDate(expenseDateFilter)))
        );
      } else if (expenseFilterMode === 'today') {
        filtered = filtered.filter(e => 
          (e.dateIso && e.dateIso === todayIso) ||
          (e.date && e.date.includes('24 Sep'))
        );
      } else if (expenseFilterMode === 'month') {
        filtered = filtered.filter(e => 
          (e.dateIso && e.dateIso.startsWith(currentMonthPrefix)) ||
          (e.date && (e.date.includes('Sep') || e.date.includes('09')))
        );
      } else if (expenseFilterMode === 'stock') {
        filtered = filtered.filter(e => e.isStockable);
      } else if (expenseFilterMode === 'operational') {
        filtered = filtered.filter(e => !e.isStockable);
      } else if (expenseFilterMode === 'recent5') {
        if (filtered.length > 5) {
          filtered = filtered.slice(0, 5);
        }
      }

      const subTotal = filtered.reduce((s, e) => s + (e.amount || 0), 0);

      return `
        <!-- Barre de filtres ultra-compacte Achats (1 seule ligne rapide) -->
        <div class="bg-[#1a2a1a] p-1.5 rounded-2xl border border-[#2d4a2d] flex items-center justify-between gap-1.5 mb-2 text-[11px] select-none">
          <div class="flex items-center gap-1 overflow-x-auto no-scrollbar py-0.5 flex-1">
            <button onclick="setExpenseFilterMode('recent5')" class="px-2.5 py-1 rounded-lg font-bold whitespace-nowrap transition-all ${expenseFilterMode === 'recent5' ? 'bg-[#7bc67e] text-[#0f1a0f] shadow' : 'bg-[#0f1a0f] text-[#aaa] border border-[#2d4a2d] hover:text-white'}">
              ⏱️ 5 Derniers
            </button>
            <button onclick="setExpenseFilterMode('today')" class="px-2.5 py-1 rounded-lg font-bold whitespace-nowrap transition-all ${expenseFilterMode === 'today' ? 'bg-[#7bc67e] text-[#0f1a0f] shadow' : 'bg-[#0f1a0f] text-[#aaa] border border-[#2d4a2d] hover:text-white'}">
              📅 Aujourd'hui
            </button>
            <button onclick="setExpenseFilterMode('month')" class="px-2.5 py-1 rounded-lg font-bold whitespace-nowrap transition-all ${expenseFilterMode === 'month' ? 'bg-[#7bc67e] text-[#0f1a0f] shadow' : 'bg-[#0f1a0f] text-[#aaa] border border-[#2d4a2d] hover:text-white'}">
              🗓️ Ce mois
            </button>
            <button onclick="setExpenseFilterMode('stock')" class="px-2.5 py-1 rounded-lg font-bold whitespace-nowrap transition-all ${expenseFilterMode === 'stock' ? 'bg-[#7bc67e] text-[#0f1a0f] shadow' : 'bg-[#0f1a0f] text-[#aaa] border border-[#2d4a2d] hover:text-white'}">
              📦 Stocks (${state.expenses.filter(e => e.isStockable).length})
            </button>
            <button onclick="setExpenseFilterMode('operational')" class="px-2.5 py-1 rounded-lg font-bold whitespace-nowrap transition-all ${expenseFilterMode === 'operational' ? 'bg-[#7bc67e] text-[#0f1a0f] shadow' : 'bg-[#0f1a0f] text-[#aaa] border border-[#2d4a2d] hover:text-white'}">
              ⚡ Charges (${state.expenses.filter(e => !e.isStockable).length})
            </button>
            <button onclick="setExpenseFilterMode('all')" class="px-2.5 py-1 rounded-lg font-bold whitespace-nowrap transition-all ${expenseFilterMode === 'all' ? 'bg-[#7bc67e] text-[#0f1a0f] shadow' : 'bg-[#0f1a0f] text-[#aaa] border border-[#2d4a2d] hover:text-white'}">
              📜 Tout (${state.expenses.length})
            </button>
          </div>

          <!-- Sélecteur de date ergonomique jour par jour -->
          <div class="flex items-center bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-0.5 flex-shrink-0">
            <button onclick="navigateDate('expenses', -1)" title="Jour précédent" class="px-2 py-1 text-slate-300 hover:text-white hover:bg-[#2d4a2d] active:scale-95 rounded-lg text-xs font-bold transition-all">
              ◀
            </button>
            <div class="relative flex items-center justify-center px-2 py-1 rounded-lg hover:bg-[#2d4a2d] transition-all cursor-pointer" onclick="this.querySelector('input')?.showPicker?.()">
              <span class="text-xs font-bold flex items-center gap-1 pointer-events-none ${(expenseFilterMode === 'date' || expenseFilterMode === 'today') ? 'text-[#7bc67e]' : 'text-slate-200'}">
                <span>🗓️</span>
                <span>${getNavDateDisplay('expenses')}</span>
              </span>
              <input 
                type="date" 
                value="${expenseDateFilter || getTodayIso()}" 
                onchange="onExpenseDateChange(this.value)" 
                class="absolute inset-0 opacity-0 w-full h-full cursor-pointer z-10"
                title="Choisir une date au calendrier"
              />
            </div>
            <button onclick="navigateDate('expenses', 1)" title="Jour suivant" class="px-2 py-1 text-slate-300 hover:text-white hover:bg-[#2d4a2d] active:scale-95 rounded-lg text-xs font-bold transition-all">
              ▶
            </button>
            ${(expenseFilterMode === 'date' || expenseDateFilter) ? `
              <button onclick="clearExpenseDateFilter()" title="Réinitialiser (5 Derniers)" class="px-1.5 py-1 text-red-400 hover:text-red-300 hover:bg-red-950/40 rounded-lg text-xs font-bold transition-all ml-0.5">
                ✕
              </button>
            ` : ''}
          </div>
        </div>

        <!-- Indicateur de statut des achats affichés & sous-total -->
        <div class="flex justify-between items-center px-1 text-[11px] text-[#888] mb-2">
          <span>
            ${expenseFilterMode === 'recent5' ? 'Affichage des <strong>5 derniers achats</strong>' :
              (expenseFilterMode === 'date' ? `Achats du <strong>${formatDisplayDate(expenseDateFilter)}</strong>` :
              (expenseFilterMode === 'today' ? 'Achats d\'<strong>aujourd\'hui</strong>' :
              (expenseFilterMode === 'month' ? 'Achats de <strong>ce mois</strong>' :
              (expenseFilterMode === 'stock' ? 'Achats pour le <strong>stock</strong>' :
              (expenseFilterMode === 'operational' ? 'Charges d\'<strong>exploitation</strong>' :
              '<strong>Tous les achats</strong>')))))}
          </span>
          <span class="text-[#7bc67e] font-mono font-bold">Total : ${subTotal.toLocaleString()} DA</span>
        </div>

        <!-- Liste des Dépenses & Achats -->
        <div class="space-y-2">
          ${filtered.length === 0 ? `
            <div class="bg-[#1a2a1a] p-6 rounded-2xl border border-[#2d4a2d] text-center text-[#888] text-xs">
              Aucune dépense trouvée pour ce filtre.
            </div>
          ` : filtered.map(e => {
            const isStockLinked = e.isStockable && e.stockItemId;
            return `
              <div class="bg-[#1a2a1a] p-3 rounded-2xl border border-[#2d4a2d] space-y-1.5 text-xs">
                <div class="flex justify-between items-start">
                  <div>
                    <div class="flex items-center gap-1.5 flex-wrap">
                      <span class="font-bold text-white text-xs">${e.label}</span>
                      ${isStockLinked ? `
                        <span class="text-[9px] bg-emerald-950 text-emerald-300 border border-emerald-500/40 px-1.5 py-0.5 rounded-full font-bold flex items-center gap-0.5">
                          <span>📦</span> <span>+${e.qty || 1} ${e.unit || 'u'} au stock</span>
                        </span>
                      ` : `

          </div>
        </div>
      `);
    }

    function onNewStockUnitChange(val) {
      const customInput = document.getElementById('stk-custom-unit');
      if (customInput) {
        if (val === '__NEW_UNIT__') {
          customInput.classList.remove('hidden');
          customInput.focus();
        } else {
          customInput.classList.add('hidden');
        }
      }
    }

    function saveNewStockItem() {
      const name = document.getElementById('stk-name').value.trim();
      const category = document.getElementById('stk-category').value;
      const qty = parseFloat(document.getElementById('stk-qty').value) || 0;
      let unit = document.getElementById('stk-unit').value;
      if (unit === '__NEW_UNIT__') {
        const customUnit = (document.getElementById('stk-custom-unit').value || '').trim();
        if (customUnit) {
          unit = customUnit;
          if (!state.units.includes(unit)) state.units.push(unit);
        } else {
          unit = 'unités';
        }
      }
      const threshold = parseFloat(document.getElementById('stk-threshold').value) || 5;
      const cost = parseFloat(document.getElementById('stk-cost').value) || 0;

      if (!name) return alert('Désignation requise.');
      state.stocks.push({ id: 'stk_' + Date.now(), name, category, quantity: qty, unit, threshold, cost });
      saveState();
      closeModal();
      showToast('Article ajouté au stock !');
    }

    function openStockMvtModal(id, type) {
      const item = state.stocks.find(s => s.id === id);
      if (!item) return;

      showModal(`
        <h3 class="text-sm font-bold text-white mb-1">${type === 'in' ? '+ Réapprovisionnement' : '- Sortie Consommation'}</h3>
        <p class="text-xs text-[#7bc67e] mb-3">${item.name} • Actuel : ${item.quantity} ${item.unit}</p>
        <div class="space-y-3 text-xs">
          <div>
            <label class="text-[#888] block mb-1">Quantité (${item.unit})</label>
            <input id="mvt-qty" type="number" step="0.5" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-3 text-white text-lg font-bold" placeholder="10" autofocus>
          </div>
          <div class="flex gap-2 pt-2">
            <button onclick="closeModal()" class="flex-1 py-2.5 bg-[#2d4a2d] rounded-xl text-white font-bold">Annuler</button>
            <button onclick="applyStockMvt('${id}', '${type}')" class="flex-1 py-2.5 bg-[#4a9e4e] rounded-xl text-white font-bold shadow">Valider</button>
          </div>
        </div>
      `);
    }

    function applyStockMvt(id, type) {
      const val = parseFloat(document.getElementById('mvt-qty').value);
      if (!val || val <= 0) return alert('Quantité invalide.');
      const item = state.stocks.find(s => s.id === id);
      if (item) {
        if (type === 'in') item.quantity = Math.round((item.quantity + val) * 100) / 100;
        else item.quantity = Math.max(0, Math.round((item.quantity - val) * 100) / 100);
        saveState();
        showToast('Stock mis à jour.');
      }
      closeModal();
    }

    function deleteStockItem(id) {
      if (confirm('Supprimer cet article ?')) {
        state.stocks = state.stocks.filter(s => s.id !== id);
        saveState();
        showToast('Article supprimé.');
      }
    }

          </div>

    function saveEditedThreshold(id) {
      const item = state.stocks.find(s => s.id === id);
      if (!item) return;

      const newName = (document.getElementById('edit-stk-name').value || '').trim();
      const newThreshold = parseFloat(document.getElementById('edit-stk-threshold').value);
      const newCost = parseFloat(document.getElementById('edit-stk-cost').value);

      if (newName) item.name = newName;
      if (!isNaN(newThreshold) && newThreshold >= 0) item.threshold = newThreshold;
      if (!isNaN(newCost) && newCost >= 0) item.cost = newCost;

      saveState();
      closeModal();
      showToast('Seuil et paramètres mis à jour !');

    // ==========================================
    // 7. PRODUCTION MYCOLOGIQUE (TABLES, SACS & SEAUX)

                <div>
                  <span class="text-[10px] font-bold text-[#7bc67e] bg-[#0f1a0f] border border-[#2d4a2d] px-2 py-0.5 rounded-md font-mono">${table.id}</span>
                  <h3 class="font-bold text-white text-sm mt-1">${table.name || ('Table ' + table.id)}</h3>
                  <p class="text-[11px] text-[#aaa]">Souche : <strong class="text-white">${table.strain || 'Pleurote Gris'}</strong> • Date : ${table.date}</p>
                </div>
                <div class="text-right">
                  <span class="text-sm font-bold text-emerald-400 block">${tableKg.toFixed(2)} kg</span>
                  <span class="text-[9px] text-[#888]">Total récolté</span>
                </div>
              </div>
              <div class="text-xs text-[#bbb] bg-[#0f1a0f] p-2 rounded-xl border border-[#2d4a2d] flex justify-between">
                <span>🌾 <strong>${table.strawBottes || 1} botte(s)</strong></span>
                <span>🍄 <strong>${table.spawnSacs || 1.5} sac(s)</strong></span>
                <span>📦 <strong>${tableBags.length}</strong> contenants</span>
              </div>
              ${table.notes ? `<p class="text-[10px] text-[#888] italic">${table.notes}</p>` : ''}
              <div class="flex gap-2 pt-1">
                <button onclick="openPrintLabelsModal('${table.id}')" class="flex-1 py-1.5 bg-[#0f1a0f] text-[#7bc67e] border border-[#2d4a2d] rounded-xl text-xs font-bold hover:border-[#7bc67e] transition-all flex items-center justify-center gap-1">
                  <span>🖨️</span> <span>Imprimer étiquettes (${tableBags.length})</span>
                </button>
                <button onclick="openBulkHarvestModal('${table.id}')" class="flex-1 py-1.5 bg-[#4a9e4e] text-white rounded-xl text-xs font-bold shadow hover:bg-emerald-600 transition-all flex items-center justify-center gap-1">
                  <span>⚖️</span> <span>Récolter sur cette table</span>
                </button>
              </div>
            </div>

            <!-- Filtres rapides -->
            <div class="flex gap-1.5 overflow-x-auto pb-1 text-xs">
              <button onclick="setProductionContainerFilter('all')" class="px-2.5 py-1 rounded-lg font-bold text-[11px] whitespace-nowrap ${productionContainerFilter === 'all' ? 'bg-[#2d4a2d] text-white' : 'bg-[#1a2a1a] text-[#888]'}">
                Tous (${tableBags.length})
              </button>
              <button onclick="setProductionContainerFilter('fruiting')" class="px-2.5 py-1 rounded-lg font-bold text-[11px] whitespace-nowrap ${productionContainerFilter === 'fruiting' ? 'bg-[#1f3a1f] text-[#7bc67e] border border-[#7bc67e]/30' : 'bg-[#1a2a1a] text-[#888]'}">
                💧 Fructification (${tableFruit})
              </button>
              <button onclick="setProductionContainerFilter('incubation')" class="px-2.5 py-1 rounded-lg font-bold text-[11px] whitespace-nowrap ${productionContainerFilter === 'incubation' ? 'bg-[#3a2e1a] text-[#e0b87a] border border-[#e0b87a]/30' : 'bg-[#1a2a1a] text-[#888]'}">
                🌡️ Incubation (${tableIncub})
              </button>
              <button onclick="setProductionContainerFilter('contaminated')" class="px-2.5 py-1 rounded-lg font-bold text-[11px] whitespace-nowrap ${productionContainerFilter === 'contaminated' ? 'bg-[#3a1a1a] text-[#e07a7a] border border-[#e07a7a]/30' : 'bg-[#1a2a1a] text-[#888]'}">
                ☣️ Avaries (${tableContam})
              </button>
            </div>

            <!-- Liste des Contenants de la Table -->
            <div class="space-y-2">
              ${displayedBags.map(b => renderContainerCard(b, table)).join('')}
            </div>
          </div>
        `;
      } else {
        // VUE 3 : TOUS LES SACS ET SEAUX
        let displayedBags = [...bags];
        if (productionContainerFilter === 'fruiting') displayedBags = displayedBags.filter(b => b.status === 'fruiting');
        else if (productionContainerFilter === 'incubation') displayedBags = displayedBags.filter(b => b.status === 'incubation');
        else if (productionContainerFilter === 'contaminated') displayedBags = displayedBags.filter(b => b.status === 'contaminated');
        else if (productionContainerFilter === 'sacs') displayedBags = displayedBags.filter(b => b.type !== 'seau');
        else if (productionContainerFilter === 'seaux') displayedBags = displayedBags.filter(b => b.type === 'seau');

        html += `
          <div class="space-y-2.5">
            <div class="flex gap-1.5 overflow-x-auto pb-1 text-xs">
              <button onclick="setProductionContainerFilter('all')" class="px-2.5 py-1 rounded-lg font-bold text-[11px] whitespace-nowrap ${productionContainerFilter === 'all' ? 'bg-[#2d4a2d] text-white' : 'bg-[#1a2a1a] text-[#888]'}">
                Tous (${bags.length})
              </button>
              <button onclick="setProductionContainerFilter('fruiting')" class="px-2.5 py-1 rounded-lg font-bold text-[11px] whitespace-nowrap ${productionContainerFilter === 'fruiting' ? 'bg-[#1f3a1f] text-[#7bc67e] border border-[#7bc67e]/30' : 'bg-[#1a2a1a] text-[#888]'}">
                💧 Fructification (${fruitingBags.length})
              </button>
              <button onclick="setProductionContainerFilter('incubation')" class="px-2.5 py-1 rounded-lg font-bold text-[11px] whitespace-nowrap ${productionContainerFilter === 'incubation' ? 'bg-[#3a2e1a] text-[#e0b87a] border border-[#e0b87a]/30' : 'bg-[#1a2a1a] text-[#888]'}">
                🌡️ Incubation (${incubationBags.length})
              </button>
              <button onclick="setProductionContainerFilter('contaminated')" class="px-2.5 py-1 rounded-lg font-bold text-[11px] whitespace-nowrap ${productionContainerFilter === 'contaminated' ? 'bg-[#3a1a1a] text-[#e07a7a] border border-[#e07a7a]/30' : 'bg-[#1a2a1a] text-[#888]'}">
                ☣️ Avaries (${contaminatedBags.length})
              </button>
              <button onclick="setProductionContainerFilter('seaux')" class="px-2.5 py-1 rounded-lg font-bold text-[11px] whitespace-nowrap ${productionContainerFilter === 'seaux' ? 'bg-[#2d4a2d] text-white' : 'bg-[#1a2a1a] text-[#888]'}">
                🪣 Seaux (${bags.filter(b => b.type === 'seau').length})
              </button>
            </div>

            <div class="space-y-2">
              ${displayedBags.length === 0 ? `
                <div class="text-center py-8 text-xs text-[#888] bg-[#1a2a1a] rounded-2xl border border-[#2d4a2d]">
                  Aucun contenant correspondant à ce filtre.
                </div>
              ` : displayedBags.map(b => {
                const parentTable = tables.find(t => t.id === b.tableId || t.id === b.batchId);
                return renderContainerCard(b, parentTable);
              }).join('')}
            </div>
          </div>
        `;
      }

      html += `</div>`;
      container.innerHTML = html;
    }

    function renderContainerCard(b, parentTable = null) {
      const isFruit = b.status === 'fruiting';
      const isContam = b.status === 'contaminated';
      const isIncub = b.status === 'incubation';
      const isSeau = b.type === 'seau';
      const tableName = parentTable ? (parentTable.name || parentTable.id) : (b.tableId || 'Table');
      const harvests = b.harvests || [];
      const nextFlush = harvests.length + 1;

      let incubDays = '';
      if (b.incubationDate) {
        const d1 = new Date(b.incubationDate);
        const d2 = new Date();
        const diff = Math.max(0, Math.floor((d2 - d1) / (1000 * 60 * 60 * 24)));
        incubDays = `J+${diff}`;
      }

      return `
        <div class="bg-[#1a2a1a] p-3 rounded-2xl border ${isContam ? 'border-[#5a2a2a] bg-[#2a1a1a]/40' : 'border-[#2d4a2d]'} space-y-2">
          <div class="flex justify-between items-center">
            <div class="flex items-center gap-1.5">
              <span class="text-xs font-mono font-bold text-white">${b.id}</span>
              <span class="text-[9px] px-1.5 py-0.5 rounded font-bold ${isSeau ? 'bg-amber-900/60 text-amber-300 border border-amber-500/30' : 'bg-[#0f1a0f] text-[#bbb] border border-[#2d4a2d]'}">
                ${isSeau ? '🪣 Seau' : '🛍️ Sac'}
              </span>
              <span class="text-[10px] text-[#777]">• ${tableName}</span>
            </div>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${
              isFruit ? 'bg-[#1f3a1f] text-[#7bc67e] border border-[#7bc67e]/40' :
              (isContam ? 'bg-[#3a1a1a] text-[#e07a7a] border border-[#e07a7a]/40' : 'bg-[#3a2e1a] text-[#e0b87a] border border-[#e0b87a]/40')
            }">
              ${isFruit ? `💧 Fructif. (Volée ${nextFlush})` : (isContam ? '☣️ Contaminé' : `🌡️ Incubat. ${incubDays}`)}
            </span>
          </div>

          <div class="flex justify-between items-center text-xs text-[#aaa] bg-[#0f1a0f] p-2 rounded-xl border border-[#2d4a2d]">
            <span>Substrat : <strong class="text-white">${b.weight || 4.5} kg</strong></span>
            <span>Total récolté : <strong class="text-emerald-400 text-sm font-bold">${(b.harvestedKg || 0).toFixed(2)} kg</strong></span>
          </div>

          ${harvests.length > 0 ? `
            <div class="flex flex-wrap gap-1 pt-0.5">
              ${harvests.map(h => `
                <span class="bg-[#1f3a1f] border border-[#2d4a2d] text-[#7bc67e] text-[9px] px-1.5 py-0.5 rounded-md font-semibold">
                  Volée ${h.flush} : ${h.weightKg} kg <span class="text-[#777]">(${h.date ? h.date.slice(5) : ''})</span>
                </span>
              `).join('')}
            </div>
          ` : ''}

          ${isContam ? `
            <div class="bg-[#3a1a1a]/40 border border-[#e07a7a]/30 p-2 rounded-xl text-[10px] text-[#e07a7a] flex items-center justify-between">
              <span>⚠️ Écarté pour : <strong>${b.contaminationReason || 'Contamination'}</strong></span>
              <span>${b.contaminationDate || ''}</span>
            </div>
          ` : ''}

          ${!isContam ? `
            <div class="flex gap-1.5 pt-1">
              ${isIncub ? `
                <button onclick="moveToFruiting('${b.id}')" class="flex-1 py-1.5 bg-[#1f3a1f] text-[#7bc67e] border border-[#7bc67e]/30 rounded-xl text-xs font-bold hover:bg-[#254625] transition-all flex items-center justify-center gap-1">
                  <span>💧</span> <span>Passer en Fructification</span>
                </button>
              ` : `
                <button onclick="openSingleBagHarvestModal('${b.id}')" class="flex-1 py-1.5 bg-[#4a9e4e] text-white rounded-xl text-xs font-bold shadow hover:bg-emerald-600 transition-all flex items-center justify-center gap-1">
                  <span>⚖️</span> <span>Peser Volée ${nextFlush}</span>
                </button>
              `}
              <button onclick="openContaminationModal('${b.id}')" class="px-2.5 py-1.5 bg-[#3a1a1a] text-[#e07a7a] border border-[#e07a7a]/30 rounded-xl text-xs font-bold hover:bg-[#4a1f1f] transition-all" title="Déclarer une avarie ou moisissure">
                ☣️ Avarie
              </button>
              <button onclick="openPrintLabelsModal(null, '${b.id}')" class="px-2 py-1.5 bg-[#0f1a0f] text-slate-300 border border-[#2d4a2d] rounded-xl text-xs font-bold hover:text-white" title="Étiquette thermique 50x30mm">
                🖨️
              </button>
            </div>
          ` : `
            <div class="flex justify-end pt-0.5">
              <button onclick="restoreBag('${b.id}')" class="text-[10px] text-[#888] hover:text-[#bbb] underline">
                Rétablir ce contenant en culture
              </button>
            </div>
          `}
        </div>
      `;
    }

          <!-- Section Matières Premières & Déduction Stock -->

                  <span class="absolute right-2 top-2 text-[#7bc67e] text-xs font-semibold">bottes</span>

                  <span class="absolute right-2 top-2 text-[#7bc67e] text-xs font-semibold">sacs</span>

    function saveNewTable() {
      const code = (document.getElementById('table-code').value || '').trim();
      const name = (document.getElementById('table-name').value || '').trim() || ('Table ' + code);
      const strain = (document.getElementById('table-strain').value || '').trim() || 'Pleurote Gris HK35';
      const date = document.getElementById('table-date').value || new Date().toISOString().slice(0, 10);
      const strawBottes = parseFloat(document.getElementById('table-straw-bottes').value) || 0;
      const spawnSacs = parseFloat(document.getElementById('table-spawn-sacs').value) || 0;
      const sacsCount = parseInt(document.getElementById('table-sacs-count').value) || 0;
      const seauxCount = parseInt(document.getElementById('table-seaux-count').value) || 0;
      const weightPerContainer = parseFloat(document.getElementById('table-weight-per-container').value) || 4.5;
      const notes = (document.getElementById('table-notes').value || '').trim();

      if (!code) {
        alert('Veuillez saisir un code pour cette table');
        return;
      }

      // 1. Déduction automatique du stock de paille (bottes)
      const strawStock = state.stocks.find(s => s.id === 'stk_01' || s.unit === 'bottes' || s.name.toLowerCase().includes('paille'));
      if (strawStock && strawBottes > 0) {
        strawStock.quantity = Math.max(0, Math.round((strawStock.quantity - strawBottes) * 10) / 10);
      }

      // 2. Déduction automatique du stock de blanc / mycélium (sacs de 2kg)
      const spawnStock = state.stocks.find(s => s.id === 'stk_02' || (s.unit === 'sacs' && s.category.includes('Blanc')) || s.name.toLowerCase().includes('blanc') || s.name.toLowerCase().includes('mycélium'));
      if (spawnStock && spawnSacs > 0) {
        spawnStock.quantity = Math.max(0, Math.round((spawnStock.quantity - spawnSacs) * 10) / 10);
      }

      // 3. Déduction des sacs plastiques si consommable présent
      const bagsStock = state.stocks.find(s => s.id === 'stk_03' || s.name.toLowerCase().includes('sacs de culture'));
      if (bagsStock && sacsCount > 0) {
        bagsStock.quantity = Math.max(0, bagsStock.quantity - sacsCount);
      }

      // 4. Création de la table
      const newTable = {
        id: code,
        name: name,
        date: date,
        strain: strain,
        substrate: 'Paille de blé pasteurisée',
        strawBottes: strawBottes,
        spawnSacs: spawnSacs,
        bagCount: sacsCount + seauxCount,
        bagsCreated: sacsCount,
        bucketsCreated: seauxCount,
        status: 'Actif',
        notes: notes
      };

      if (!state.tables) state.tables = [];
      state.tables.unshift(newTable);

      if (!state.batches) state.batches = [];
      state.batches.unshift({
        id: code,
        strain: strain,
        substrate: 'Paille de blé pasteurisée',
        strawBottes: strawBottes,
        spawnSacs: spawnSacs,
        bagCount: sacsCount + seauxCount,
        date: date,
        status: 'Actif'
      });

      const cleanCode = code.replace(/[^A-Za-z0-9]/g, '');

      // 5. Génération des sacs individuels
      for (let i = 1; i <= sacsCount; i++) {
        const numStr = i.toString().padStart(2, '0');
        state.bags.unshift({
          id: `${cleanCode}-S${numStr}`,
          tableId: code,
          batchId: code,
          type: 'sac',
          status: 'incubation',
          weight: weightPerContainer,
          strain: strain,
          incubationDate: date,
          fruitingDate: null,
          contaminationDate: null,
          contaminationReason: null,
          harvests: [],
          harvestedKg: 0.0
        });
      }

      // 6. Génération des seaux individuels
      for (let i = 1; i <= seauxCount; i++) {
        const numStr = i.toString().padStart(2, '0');
        state.bags.unshift({
          id: `${cleanCode}-B${numStr}`,
          tableId: code,
          batchId: code,
          type: 'seau',
          status: 'incubation',
          weight: weightPerContainer,
          strain: strain,
          incubationDate: date,
          fruitingDate: null,
          contaminationDate: null,
          contaminationReason: null,
          harvests: [],
          harvestedKg: 0.0
        });
      }

      saveState();
      closeModal();
      showToast(`Table ${code} créée ! Stock déduit : -${strawBottes} botte(s), -${spawnSacs} sac(s) mycélium.`);
    }

    function moveToFruiting(id) {
      const b = state.bags.find(x => x.id === id);
      if (b) {
        b.status = 'fruiting';
        b.fruitingDate = new Date().toISOString().slice(0, 10);
        saveState();
        showToast(`💧 ${id} passé en chambre de fructification !`);
      }
    }

    function openSingleBagHarvestModal(id) {
      const b = state.bags.find(x => x.id === id);
      if (!b) return;
      const harvests = b.harvests || [];
      const nextFlush = harvests.length + 1;
      const parentTable = (state.tables || []).find(t => t.id === b.tableId || t.id === b.batchId);
      const tableName = parentTable ? (parentTable.name || parentTable.id) : (b.tableId || 'Table');

      showModal(`
        <h3 class="text-sm font-bold text-white mb-2 flex items-center justify-between">
          <span class="flex items-center gap-1.5">
            <span>⚖️</span> <span>Pesée Récolte — ${b.id}</span>
          </span>
          <span class="text-[10px] text-[#7bc67e] font-mono">Volée ${nextFlush}</span>
        </h3>

        <div class="space-y-3 text-xs">
          <div class="bg-[#0f1a0f] p-2.5 rounded-xl border border-[#2d4a2d] flex justify-between text-[#bbb]">
            <span>Contenant : <strong class="text-white">${b.id} (${b.type === 'seau' ? '🪣 Seau' : '🛍️ Sac'})</strong></span>
            <span>${tableName}</span>
          </div>

          ${harvests.length > 0 ? `
            <div class="bg-[#142214] p-2 rounded-xl border border-[#2d4a2d] space-y-1">
              <span class="text-[10px] text-[#888] font-bold block">Volées précédentes enregistrées :</span>
              <div class="flex flex-wrap gap-1">
                ${harvests.map(h => `
                  <span class="bg-[#1f3a1f] text-[#7bc67e] px-2 py-0.5 rounded text-[10px] font-semibold">
                    Volée ${h.flush} : ${h.weightKg} kg (${h.date})
                  </span>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <div>
            <label class="text-[#7bc67e] font-bold block mb-1">Poids récolté pour la Volée ${nextFlush} (kg frais) :</label>
            <input id="single-harvest-val" type="number" step="0.05" min="0.05" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-3 text-white text-lg font-bold font-mono" value="1.15" autofocus>
          </div>

          <div>
            <label class="text-[#888] block mb-1">Date de cueillette :</label>
            <input id="single-harvest-date" type="date" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white" value="${new Date().toISOString().slice(0, 10)}">
          </div>

          <div class="flex gap-2 pt-2">
            <button onclick="closeModal()" class="flex-1 py-2.5 bg-[#2d4a2d] rounded-xl text-white font-bold">Annuler</button>

              Enregistrer Volée ${nextFlush}
            </button>
          </div>
        </div>
      `);
    }

    function saveSingleBagHarvest(id) {
      const val = parseFloat(document.getElementById('single-harvest-val').value) || 0;
      const date = document.getElementById('single-harvest-date').value || new Date().toISOString().slice(0, 10);
      const b = state.bags.find(x => x.id === id);
      if (b && val > 0) {
        if (!b.harvests) b.harvests = [];
        const flushNum = b.harvests.length + 1;
        b.harvests.push({ flush: flushNum, date: date, weightKg: val });
        b.harvestedKg = Math.round(b.harvests.reduce((sum, h) => sum + h.weightKg, 0) * 100) / 100;
        saveState();
        showToast(`+${val} kg enregistrés sur ${id} (Volée ${flushNum}) !`);
      }
      closeModal();
    }

    function openContaminationModal(id) {
      const b = state.bags.find(x => x.id === id);
      if (!b) return;

      showModal(`
        <h3 class="text-sm font-bold text-white mb-2 flex items-center gap-1.5 text-[#e07a7a]">
          <span>☣️</span> <span>Déclarer une Avarie / Contamination</span>
        </h3>

        <div class="space-y-3 text-xs">
          <div class="bg-[#2a1a1a] p-2.5 rounded-xl border border-[#5a2a2a] text-[#ddd]">
            <p>Contenant concerné : <strong class="text-white">${b.id}</strong> (${b.type === 'seau' ? '🪣 Seau' : '🛍️ Sac'})</p>
            <p class="text-[10px] text-[#aaa] mt-0.5">Ce sac sera écarté de la chambre et comptabilisé dans les pertes.</p>
          </div>

          <div>
            <label class="text-[#888] block mb-1">Type de contamination / motif :</label>
            <select id="contam-reason" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white font-semibold">
              <option value="Moisissure verte (Trichoderma)">Moisissure verte (Trichoderma)</option>
              <option value="Moisissure noire (Aspergillus)">Moisissure noire (Aspergillus)</option>
              <option value="Moisissure orange (Neurospora)">Moisissure orange (Neurospora)</option>
              <option value="Bactériose / Taches brunes (Pseudomonas)">Bactériose / Taches brunes (Pseudomonas)</option>
              <option value="Moucherons / Larves de sciarides">Moucherons / Larves de sciarides</option>
              <option value="Mycélium sec / Arrêt de pousse">Mycélium sec / Arrêt de pousse</option>
              <option value="Autre avarie">Autre avarie</option>
            </select>
          </div>

          <div>
            <label class="text-[#888] block mb-1">Date du constat :</label>
            <input id="contam-date" type="date" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white" value="${new Date().toISOString().slice(0, 10)}">
          </div>

          <div class="flex gap-2 pt-2">
            <button onclick="closeModal()" class="flex-1 py-2.5 bg-[#2d4a2d] rounded-xl text-white font-bold">Annuler</button>
            <button onclick="saveContamination('${id}')" class="flex-1 py-2.5 bg-[#a33] text-white rounded-xl font-bold shadow hover:bg-red-700 transition-all">
              Confirmer l'Avarie
            </button>
          </div>
        </div>
      `);
    }

    function saveContamination(id) {
      const reason = document.getElementById('contam-reason').value;
      const date = document.getElementById('contam-date').value || new Date().toISOString().slice(0, 10);
      const b = state.bags.find(x => x.id === id);
      if (b) {
        b.status = 'contaminated';
        b.contaminationReason = reason;
        b.contaminationDate = date;
        saveState();
        showToast(`Sac ${id} écarté (${reason}).`);
      }
      closeModal();
    }

    function restoreBag(id) {
      const b = state.bags.find(x => x.id === id);
      if (b && confirm(`Rétablir ${id} en culture ?`)) {
        b.status = (b.harvests && b.harvests.length > 0) ? 'fruiting' : 'incubation';
        b.contaminationReason = null;
        b.contaminationDate = null;
        saveState();
        showToast(`${id} rétabli en ${b.status} !`);
      }
    }

    function openBulkHarvestModal(filterTableId = null) {
      const fruitingBags = state.bags.filter(b => b.status === 'fruiting');
      if (fruitingBags.length === 0) {
        alert('Aucun sac ou seau n\'est actuellement en fructification. Passez d\'abord des contenants en fructification depuis l\'incubation !');
        return;
      }

      bulkSelectedBagIds = new Set(
        filterTableId 
          ? fruitingBags.filter(b => b.tableId === filterTableId || b.batchId === filterTableId).map(b => b.id)
          : fruitingBags.map(b => b.id)
      );
      if (bulkSelectedBagIds.size === 0) {
        bulkSelectedBagIds = new Set(fruitingBags.map(b => b.id));
      }
      bulkTotalWeightKg = 5.0;

      renderBulkHarvestModalContent(filterTableId);
    }

    function renderBulkHarvestModalContent(activeTableFilter = null) {
      const fruitingBags = state.bags.filter(b => b.status === 'fruiting');
      const tables = state.tables || [];
      const selectedCount = bulkSelectedBagIds.size;

      const tablesOptions = `
        <option value="" ${!activeTableFilter ? 'selected' : ''}>-- Tous les sacs en fructification (${fruitingBags.length}) --</option>

      const visibleBags = activeTableFilter 
        ? fruitingBags.filter(b => b.tableId === activeTableFilter || b.batchId === activeTableFilter)

      showModal(`
        <div class="space-y-3 text-xs max-h-[80vh] overflow-y-auto pr-1">
          <div class="flex justify-between items-center border-b border-[#2d4a2d] pb-2">
