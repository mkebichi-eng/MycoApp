<!DOCTYPE html>

  <title>MycoTrack — Gestion Ventes, Livraisons & Finances</title>

    body {
      background-color: #050a05;
      color: #ffffff;
      -webkit-tap-highlight-color: transparent;

    }

    .text-myco-green { color: #7bc67e; }
    .bg-myco-green { background-color: #4a9e4e; }
    .text-myco-red { color: #e07a7a; }
    .text-myco-yellow { color: #e0b87a; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #2d4a2d; border-radius: 4px; }
  </style>

          ...initialSeedState,
          ...v5State,
          units: v5State.units || initialSeedState.units,
          expenseCategories: v5State.expenseCategories || initialSeedState.expenseCategories,
          expenses: (v5State.expenses && v5State.expenses.length > 0) ? v5State.expenses : initialSeedState.expenses
        };
      }
    }
    let state = storedState || initialSeedState;

    function saveState() {
      localStorage.setItem('mycotrack_state_v6', JSON.stringify(state));
      checkBadges();
      renderCurrentView();
    }

      stockSubTab = sub;
      renderStockView();
    }

    function setCarnetSubTab(sub) {
      carnetSubTab = sub;
      renderCarnetView();
    }

    let salesFilterMode = 'recent5'; // 'recent5' | 'today' | 'unpaid' | 'all' | 'date'
    let salesDateFilter = '';
    let salesSearchQuery = '';

    function setSalesFilterMode(mode) {
      salesFilterMode = mode;
      if (mode !== 'date') {
        salesDateFilter = '';
      }
      renderSalesView();
    }

    function onSalesDateChange(val) {
      salesDateFilter = val;
      if (val) {
        salesFilterMode = 'date';
      } else {
        salesFilterMode = 'recent5';
      }
      renderSalesView();
    }

    function clearSalesDateFilter() {
      salesDateFilter = '';
      salesFilterMode = 'recent5';
      renderSalesView();
    }

    function onSalesSearchInput(val) {
      salesSearchQuery = val;
      renderSalesView();
    }

    function formatDisplayDate(isoDateStr) {
      if (!isoDateStr) return '';
      const parts = isoDateStr.split('-');
      if (parts.length === 3) {
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
      }
      return isoDateStr;
    }

    function resetDemoData() {
      if (confirm('Réinitialiser toutes les données aux valeurs de démonstration ?')) {
        state = JSON.parse(JSON.stringify(initialSeedState));
        saveState();
        showToast('Données réinitialisées !');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2400);
    }

    function checkBadges() {
      // Badge alerte stock
      const lowCount = state.stocks.filter(s => s.quantity <= s.threshold).length;
      const dot = document.getElementById('stock-alert-dot');
      if (dot) {
        if (lowCount > 0) dot.classList.remove('hidden');
        else dot.classList.add('hidden');
      }

      // Badge courses livreur en attente
      const pendingDeliveries = state.deliveries.filter(d => d.status === 'pending_acceptance' || d.status === 'in_delivery').length;
      const delivBadge = document.getElementById('role-delivery-badge');
      if (delivBadge) {
        if (pendingDeliveries > 0) delivBadge.classList.remove('hidden');
        else delivBadge.classList.add('hidden');
      }

      // Badge onglet ventes
      const activeSales = state.deliveries.filter(d => d.status !== 'settled').length;
      const salesBadge = document.getElementById('active-sales-badge');
      if (salesBadge) {
        if (activeSales > 0) {
          salesBadge.innerText = activeSales;
          salesBadge.classList.remove('hidden');
        } else {
          salesBadge.classList.add('hidden');
        }
      }
    }

      if (role === 'delivery') {
        adminBtn.className = "px-2.5 py-1 rounded-lg text-xs font-semibold text-slate-400 hover:text-white";
        deliveryBtn.className = "px-2.5 py-1 rounded-lg text-xs font-bold transition-all bg-[#e0b87a] text-black shadow";
        statusText.innerText = "Mode Livreur • Chauffeur terrain";
        statusText.className = "text-[11px] text-[#e0b87a] font-semibold";
        bottomNav.classList.add('hidden');
        renderDeliveryView();
      } else {
        deliveryBtn.className = "px-2.5 py-1 rounded-lg text-xs font-semibold text-slate-400 hover:text-white";
        adminBtn.className = "px-2.5 py-1 rounded-lg text-xs font-bold transition-all bg-[#4a9e4e] text-white shadow";
        statusText.innerText = "Mode Propriétaire & Responsable";
        statusText.className = "text-[11px] text-[#7bc67e] font-semibold";
        bottomNav.classList.remove('hidden');
        switchTab(currentTab === 'delivery' ? 'dashboard' : currentTab);
      }
    }

    function switchTab(tab, subTab = null) {
      if (tab === 'clients') {
        tab = 'carnet';
        carnetSubTab = 'clients';
      } else if (tab === 'deliverers') {
        tab = 'carnet';
        carnetSubTab = 'deliverers';
      } else if (tab === 'expenses') {
        tab = 'stock';
        stockSubTab = 'expenses';
      }
      if (subTab) {
        if (tab === 'carnet') carnetSubTab = subTab;
        if (tab === 'stock') stockSubTab = subTab;
      }
      currentTab = tab;
      ['dash', 'sales', 'carnet', 'stock', 'bags'].forEach(t => {
        const el = document.getElementById(`nav-${t}`);
        if (el) {
          if ((tab === 'dashboard' && t === 'dash') || 
              (tab === 'sales' && t === 'sales') || 
              (tab === 'carnet' && t === 'carnet') || 
              (tab === 'stock' && t === 'stock') || 
              (tab === 'bags' && t === 'bags')) {
            el.className = "flex flex-col items-center text-[#7bc67e] font-bold p-1";
          } else {
            el.className = "flex flex-col items-center text-slate-400 hover:text-[#7bc67e] p-1";
          }
        }
      });
      renderCurrentView();
    }

    function renderCurrentView() {
      if (currentRole === 'delivery') {
        renderDeliveryView();
      } else {
        if (currentTab === 'dashboard') renderDashboardView();
        else if (currentTab === 'sales') renderSalesView();
        else if (currentTab === 'carnet' || currentTab === 'clients') renderCarnetView();
        else if (currentTab === 'stock' || currentTab === 'expenses') renderStockView();
        else if (currentTab === 'bags') renderBagsView();
      }
    }

    // ==========================================

    function renderDashboardView() {

      // 2. Frais livreurs déduits
      const totalDelivererFees = state.deliveries.reduce((sum, d) => sum + (d.deliveryFee || 0), 0);
      
      // 3. Montant réel encaissé en caisse ferme (Net versé en caisse)

      // 5. Total des dépenses d'exploitation
      const totalExpenses = state.expenses.reduce((sum, e) => sum + (e.amount || 0), 0);
      
      // 6. Bénéfice Net Réel = Chiffre d'affaires - Frais livreurs - Dépenses
      const netProfit = totalRevenue - totalDelivererFees - totalExpenses;

            <p class="text-[9px] text-[#666] mt-0.5">${state.clients.filter(c=>c.due>0).length} client(s) à terme</p>

        <!-- Alerte active si commande en cours ou impayé -->
        ${pendingDeliveries.length > 0 || totalRemainingDue > 0 || lowStocks.length > 0 ? `

            ${state.clients.filter(c => c.due > 0).map(c => `

    // ==========================================
    // 2. MODULE VENTES & LIVRAISONS (FLUX ERGONOMIQUE AVEC FILTRE DATE & 5 RÉCENTES)
    // ==========================================
    function renderSalesView() {
      const container = document.getElementById('app-content');
      
      const todayIso = new Date().toISOString().slice(0, 10);
      const todayCount = state.deliveries.filter(d => (d.dateIso && d.dateIso === todayIso) || (d.createdAt && d.createdAt.includes('24 Sep'))).length;
      const unpaidCount = state.deliveries.filter(d => (d.clientRemainingDue && d.clientRemainingDue > 0) || (!d.isClientPaid && d.status === 'settled')).length;

      // Filtrage selon mode ou date sélectionnée
      let filtered = [...state.deliveries];
      if (salesFilterMode === 'date' && salesDateFilter) {
        filtered = filtered.filter(d => 
          (d.dateIso && d.dateIso === salesDateFilter) ||
          (d.createdAt && d.createdAt.includes(salesDateFilter))
        );
      } else if (salesFilterMode === 'today') {
        filtered = filtered.filter(d => 
          (d.dateIso && d.dateIso === todayIso) ||
          (d.createdAt && d.createdAt.includes('24 Sep'))
        );
      } else if (salesFilterMode === 'unpaid') {
        filtered = filtered.filter(d => 
          (d.clientRemainingDue && d.clientRemainingDue > 0) || (!d.isClientPaid && d.status === 'settled')
        );
      } else if (salesFilterMode === 'recent5') {
        if (filtered.length > 5) {
          filtered = filtered.slice(0, 5);
        }
      }

      container.innerHTML = `

            <span>+</span> <span>Nouvelle Vente</span>

            <button onclick="setSalesFilterMode('unpaid')" class="px-2.5 py-1 rounded-lg font-bold whitespace-nowrap transition-all ${salesFilterMode === 'unpaid' ? 'bg-red-500 text-white shadow' : 'bg-[#0f1a0f] text-[#e07a7a] border border-[#2d4a2d] hover:border-red-500/50'}">

                    <span>Livreur assigné : <strong>${d.delivererName}</strong></span>

                        ${d.clientRemainingDue > 0 ? `🔴 Reste à payer client : ${d.clientRemainingDue.toLocaleString()} DA` : '✓ Client a payé 100%'}

    function onSaleDelivererChanged() {
      const delivId = document.getElementById('vte-deliverer-id').value;
      const deliverer = (state.deliverers || []).find(d => d.id === delivId);
      if (deliverer) {
        document.getElementById('vte-course-fee').value = deliverer.fee;
      }
      recalculateSaleForm();
    }

    function recalculateSaleForm() {
      const cliId = document.getElementById('vte-client-id').value;
      const client = state.clients.find(c => c.id === cliId);
      const qty = parseFloat(document.getElementById('vte-qty').value) || 0;
      const delivId = document.getElementById('vte-deliverer-id').value;
      const deliverer = (state.deliverers || []).find(d => d.id === delivId);
      const fee = parseFloat(document.getElementById('vte-course-fee').value) || (deliverer ? deliverer.fee : 0);

      if (!client || !deliverer) return;

      const totalFacture = Math.round(qty * client.price);
      const netEstime = totalFacture - fee;

      document.getElementById('vte-calc-summary').innerHTML = `
        <div class="flex justify-between text-[#aaa]">
          <span>Prix négocié client :</span>
          <span class="text-white font-semibold">${client.price} DA / kg</span>
        </div>
        <div class="flex justify-between text-[#aaa]">
          <span>Total facturé client :</span>
          <strong class="text-white text-sm">${totalFacture.toLocaleString()} DA</strong>
        </div>
        <div class="flex justify-between text-[#aaa] border-t border-[#2d4a2d] pt-1">
          <span>Frais course livreur :</span>
          <span class="text-[#e0b87a] font-semibold">${fee} DA <span class="text-[10px] text-[#888]">(modifiable)</span></span>
        </div>
        <div class="flex justify-between text-xs pt-1 border-t border-[#7bc67e]/30">
          <span class="text-[#7bc67e]">Net caisse estimé (si payé 100%) :</span>
          <strong class="text-[#7bc67e] text-sm">+${netEstime.toLocaleString()} DA</strong>
        </div>
      `;
    }

    function saveNewSale() {
      const cliId = document.getElementById('vte-client-id').value;
      const client = state.clients.find(c => c.id === cliId);
      const qty = parseFloat(document.getElementById('vte-qty').value) || 0;
      const delivId = document.getElementById('vte-deliverer-id').value;
      const deliverer = (state.deliverers || []).find(d => d.id === delivId);
      const fee = parseFloat(document.getElementById('vte-course-fee').value) || (deliverer ? deliverer.fee : 350);

      if (!client || qty <= 0 || !deliverer) return alert('Veuillez saisir une quantité valide.');

      const totalAmount = Math.round(qty * client.price);
      const orderNum = 'VTE-2026-' + String(state.deliveries.length + 1).padStart(3, '0');

      const newOrder = {
        id: 'vte_' + Date.now(),
        orderNumber: orderNum,
        clientId: client.id,
        clientName: client.name,
        clientPhone: client.phone,
        clientAddress: client.address,
        quantityKg: qty,
        pricePerKg: client.price,
        totalAmount: totalAmount,
        delivererId: deliverer.id,
        delivererName: deliverer.name,
        deliveryFee: fee, // Tarif course modifiable pour cette vente
        status: 'pending_acceptance', // Actif pour le livreur !
        isClientPaid: false,
        amountCollected: 0,
        clientRemainingDue: totalAmount,
        delivererFeeDeducted: 0,
        netCashToFarm: 0,
        dateIso: new Date().toISOString().slice(0, 10),
        createdAt: new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
      };

      state.deliveries.unshift(newOrder);
      saveState();
      closeModal();
      showToast(`Vente ${orderNum} créée ! Livreur ${deliverer.name} notifié (Course : ${fee} DA).`);
    }

          </div>

    function setClientPaymentChoice(isFull, totalAmount, fee) {
      const input = document.getElementById('collected-input');
      const yesBtn = document.getElementById('btn-pay-yes');
      const noBtn = document.getElementById('btn-pay-no');

      if (isFull) {
        input.value = totalAmount;
        yesBtn.className = "py-2.5 rounded-xl border-2 border-[#4a9e4e] bg-[#1f3a1f] text-[#7bc67e] font-bold text-xs shadow";
        noBtn.className = "py-2.5 rounded-xl border border-[#2d4a2d] bg-[#1a2a1a] text-slate-400 font-semibold text-xs";
      } else {
        input.value = 0;
        noBtn.className = "py-2.5 rounded-xl border-2 border-[#e07a7a] bg-[#3a1a1a] text-[#e07a7a] font-bold text-xs shadow";
        yesBtn.className = "py-2.5 rounded-xl border border-[#2d4a2d] bg-[#1a2a1a] text-slate-400 font-semibold text-xs";
      }
      updateSettlementBreakdown(totalAmount, fee);
    }

    function updateSettlementBreakdown(totalAmount, delivererFee) {
      const val = parseFloat(document.getElementById('collected-input').value) || 0;
      const remainingDue = Math.max(0, totalAmount - val);
      const isFeeCovered = val >= delivererFee;
      const netToFarm = isFeeCovered ? (val - delivererFee) : 0;
      const delivererDueFromFarm = isFeeCovered ? 0 : (delivererFee - val);

      document.getElementById('settlement-breakdown').innerHTML = `
        <div class="flex justify-between text-xs">
          <span class="text-[#aaa]">Reste à payer client (Impayé) :</span>
          <strong class="${remainingDue > 0 ? 'text-[#e07a7a] text-sm font-bold' : 'text-[#7bc67e]'}">
            ${remainingDue > 0 ? `${remainingDue.toLocaleString()} DA` : '0 DA (✓ Réglé)'}
          </strong>
        </div>

        <div class="flex justify-between text-xs border-t border-[#2d4a2d] pt-1.5">
          <span class="text-[#aaa]">Frais livreur déduits sur cash :</span>
          <strong class="text-[#e0b87a]">-${delivererFee} DA</strong>
        </div>

        <div class="flex justify-between text-xs border-t border-[#7bc67e]/40 pt-1.5">
          <span class="text-[#7bc67e] font-bold">Net remis en Caisse Ferme :</span>
          <strong class="text-[#7bc67e] text-base font-bold">+${netToFarm.toLocaleString()} DA</strong>
        </div>

        ${delivererDueFromFarm > 0 ? `
          <p class="text-[10px] text-[#e07a7a] bg-[#2a1a1a] p-1.5 rounded-lg border border-[#5a2a2a] mt-1">
            ⚠️ Attention : Le client n'a pas versé assez pour payer la course. La ferme doit encore régler <strong>${delivererDueFromFarm} DA</strong> au livreur.
          </p>
        ` : ''}
      `;
    }

    function applySettlement(orderId) {
      const d = state.deliveries.find(x => x.id === orderId);
      if (!d) return;

      const collected = parseFloat(document.getElementById('collected-input').value) || 0;
      const remainingDue = Math.max(0, d.totalAmount - collected);
      const isFeeCovered = collected >= d.deliveryFee;
      const netToFarm = isFeeCovered ? (collected - d.deliveryFee) : 0;

      // Mise à jour de la commande
      d.status = 'settled';
      d.amountCollected = collected;
      d.clientRemainingDue = remainingDue;
      d.isClientPaid = remainingDue === 0;
      d.delivererFeeDeducted = d.deliveryFee;
      d.netCashToFarm = netToFarm;

      // Mise à jour du compte client (si impayé)
      const client = state.clients.find(c => c.id === d.clientId);
      if (client) {
        if (remainingDue > 0) {
          client.due = (client.due || 0) + remainingDue;
        }
      }

      saveState();
      closeModal();
      showToast(`Commande ${d.orderNumber} clôturée ! Net en caisse : +${netToFarm.toLocaleString()} DA`);
    }

    function saveNewDeliverer() {
      const name = document.getElementById('deliv-name').value.trim();
      const phone = document.getElementById('deliv-phone').value.trim();
      const vehicle = document.getElementById('deliv-vehicle').value;
      const address = document.getElementById('deliv-address').value.trim();
      const fee = parseFloat(document.getElementById('deliv-fee').value) || 350;

      if (!name) return alert('Nom obligatoire.');
      if (!phone || phone === '+213') return alert('Numéro de téléphone obligatoire.');

      if (!state.deliverers) state.deliverers = [];

      state.deliverers.unshift({
        id: 'deliv_' + Date.now(),
        name,
        phone,
        vehicle,
        address: address || 'Alger',
        fee,
        status: 'active'
      });

      saveState();
      closeModal();
      showToast(`Livreur ${name} ajouté au Carnet Pro !`);
    }

    function saveEditDeliverer(id) {
      const d = (state.deliverers || []).find(x => x.id === id);
      if (!d) return;

      d.name = document.getElementById('edit-deliv-name').value.trim() || d.name;
      d.phone = document.getElementById('edit-deliv-phone').value.trim() || d.phone;
      d.vehicle = document.getElementById('edit-deliv-vehicle').value.trim() || d.vehicle;
      d.address = document.getElementById('edit-deliv-address').value.trim() || d.address;
      d.fee = parseFloat(document.getElementById('edit-deliv-fee').value) || d.fee;

      saveState();
      closeModal();
      showToast(`Fiche de ${d.name} mise à jour !`);

    function deleteDeliverer(id) {
      const d = (state.deliverers || []).find(x => x.id === id);
      if (!d) return;

      // Vérifier les livraisons en cours
      const pendingDeliveries = state.deliveries.filter(x => x.delivererId === id && (x.status === 'in_delivery' || x.status === 'pending_acceptance'));
      if (pendingDeliveries.length > 0) {
        return alert(`Impossible de supprimer ${d.name} car il a ${pendingDeliveries.length} livraison(s) en cours. Terminez ou réassignez d'abord ces livraisons.`);
      }

      if (confirm(`Confirmer la suppression du livreur "${d.name}" du Carnet Pro ?`)) {
        state.deliverers = state.deliverers.filter(x => x.id !== id);
        saveState();
        showToast(`Livreur ${d.name} supprimé.`);
      }
    }

    // 6. GESTION FUSIONNÉE : STOCKS & ACHATS
    // ==========================================
    let expenseFilterMode = 'recent5'; // 'recent5' | 'today' | 'month' | 'stock' | 'operational' | 'all' | 'date'
    let expenseDateFilter = '';

    function setExpenseFilterMode(mode) {
      expenseFilterMode = mode;
      if (mode !== 'date') {
        expenseDateFilter = '';
      }
      renderStockView();
    }

    function onExpenseDateChange(val) {
      expenseDateFilter = val;
      if (val) {
        expenseFilterMode = 'date';
      } else {
        expenseFilterMode = 'recent5';
      }
      renderStockView();
    }

    function clearExpenseDateFilter() {
      expenseDateFilter = '';
      expenseFilterMode = 'recent5';
      renderStockView();
    }

    function renderStockView() {
      const container = document.getElementById('app-content');
      
      const totalStockItems = state.stocks.length;
      const lowCount = state.stocks.filter(s => s.quantity <= s.threshold).length;
      const totalExpenses = state.expenses.reduce((sum, e) => sum + (e.amount || 0), 0);

      container.innerHTML = `
        <!-- Entête Titre & Bouton d'action contextuel -->
        <div class="flex justify-between items-center mb-1.5">
          <div>
            <h2 class="text-xs font-bold text-[#7bc67e] tracking-wider uppercase flex items-center gap-1.5">
              <span>📦</span> <span>STOCKS & ACHATS</span>
            </h2>
            <p class="text-[10px] text-[#888]">${totalStockItems} articles suivis • ${totalExpenses.toLocaleString()} DA engagés</p>
          </div>
          <div class="flex items-center gap-1.5">

              <button onclick="openNewExpenseModal()" class="text-[10px] bg-[#4a9e4e] text-white px-2.5 py-1.5 rounded-xl font-bold shadow hover:bg-emerald-600 transition-all flex items-center gap-1">

            ` : `
              <button onclick="openNewExpenseModal()" class="text-[10px] bg-[#4a9e4e] text-white px-3 py-1.5 rounded-xl font-bold shadow hover:bg-emerald-600 transition-all flex items-center gap-1">
                <span>+</span> <span>Nouvelle Dépense</span>
              </button>
            `}
          </div>
        </div>

        <!-- Commutateur d'onglets ergonomique (2 vues unifiées) -->
        <div class="flex bg-[#142214] p-1 rounded-2xl border border-[#2d4a2d] mb-2.5 select-none">
          <button onclick="setStockSubTab('stocks')" class="flex-1 py-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1.5 ${
            stockSubTab === 'stocks' ? 'bg-[#2d5a2d] text-white shadow' : 'text-slate-400 hover:text-white'
          }">
            <span>📦</span>
            <span>État des Stocks (${totalStockItems})</span>
            ${lowCount > 0 ? `<span class="px-1.5 py-0.2 bg-red-600 text-white text-[9px] rounded-full font-bold">${lowCount}</span>` : ''}
          </button>
          <button onclick="setStockSubTab('expenses')" class="flex-1 py-2 rounded-xl text-xs font-bold transition-all flex items-center justify-center gap-1.5 ${
            stockSubTab === 'expenses' ? 'bg-[#2d5a2d] text-white shadow' : 'text-slate-400 hover:text-white'
          }">
            <span>💸</span>
            <span>Dépenses & Achats (${state.expenses.length})</span>
          </button>
        </div>

        ${stockSubTab === 'stocks' ? renderStocksSubViewHtml(lowCount) : renderExpensesSubViewHtml(totalExpenses)}
      `;
    }

    function renderStocksSubViewHtml(lowCount) {
      return `
        <!-- Statut du Stock (Alerte uniquement si nécessaire, sans estimation inutile) -->
        ${lowCount > 0 ? `
          <div class="mb-2.5 p-2 bg-[#2a1a1a]/70 border border-[#5a2a2a] rounded-xl flex items-center justify-between text-xs text-[#e07a7a]">
            <span class="flex items-center gap-1.5 font-bold">
              <span>⚠️</span> <span>${lowCount} article(s) sous le seuil d'alerte critique</span>
            </span>
            <span class="text-[10px] text-red-300 font-semibold">Réapprovisionnement requis</span>
          </div>
        ` : `
          <div class="mb-2.5 px-2.5 py-1.5 bg-[#142214] border border-[#2d4a2d] rounded-xl flex items-center justify-between text-[11px] text-[#7bc67e]">
            <span class="flex items-center gap-1.5">
              <span>🟢</span> <span>Tous les stocks sont au-dessus du seuil limite</span>
            </span>
            <span class="text-[10px] text-[#888]">${state.stocks.length} articles suivis</span>
          </div>
        `}

        <!-- Liste des Articles en Stock -->
        <div class="space-y-2">
          ${state.stocks.length === 0 ? `
            <div class="bg-[#1a2a1a] p-6 rounded-2xl border border-[#2d4a2d] text-center text-[#888] text-xs">
              Aucun article en stock. Cliquez sur <strong>+ Nouvel Article</strong> pour commencer.
            </div>
          ` : state.stocks.map(s => {
            const isLow = s.quantity <= s.threshold;
            return `
              <div class="bg-[#1a2a1a] p-3 rounded-2xl border ${isLow ? 'border-[#5a2a2a] bg-[#2a1a1a]/40' : 'border-[#2d4a2d]'} space-y-2">
                <div class="flex justify-between items-start">
                  <div>
                    <div class="flex items-center gap-1.5 flex-wrap">
                      <span>${isLow ? '🔴' : '🟢'}</span>
                      <h3 class="font-bold text-white text-xs">${s.name}</h3>
                      <span class="text-[9px] text-[#888] bg-[#0f1a0f] border border-[#2d4a2d] px-1.5 py-0.5 rounded font-medium">${s.category || 'Intrant'}</span>
                    </div>

                    <!-- Stock actuel & Seuil limite modifiable d'un clic -->
                    <div class="flex items-center gap-2 mt-1 flex-wrap">
                      <p class="text-[11px] ${isLow ? 'text-[#e07a7a] font-bold' : 'text-slate-300'}">
                        Stock actuel : <strong class="text-sm text-white">${s.quantity} ${s.unit}</strong>
                      </p>
                      <button onclick="openEditThresholdModal('${s.id}')" class="text-[10px] bg-[#0f1a0f] hover:bg-[#1f2f1f] text-slate-300 hover:text-[#7bc67e] border border-[#2d4a2d] hover:border-[#7bc67e] px-2 py-0.5 rounded-lg flex items-center gap-1 transition-all" title="Changer le seuil d'alerte">

                    <p class="text-[10px] text-[#888] mt-0.5">
                      Coût d'achat moyen : <strong class="text-[#7bc67e] font-mono">${s.cost || 0} DA / ${s.unit}</strong>
                    </p>
                  </div>
                  <div class="flex items-center gap-0.5">
                    <button onclick="openEditThresholdModal('${s.id}')" class="text-slate-400 hover:text-[#7bc67e] text-xs p-1" title="Modifier seuil & coût">⚙️</button>
                    <button onclick="deleteStockItem('${s.id}')" class="text-slate-500 hover:text-red-400 text-xs p-1" title="Supprimer">🗑️</button>

                <div class="grid grid-cols-3 gap-1.5 pt-1.5 border-t border-[#2d4a2d]/50">

                    + Entrée
                  </button>

                    - Sortie
                  </button>
                  <button onclick="openNewExpenseModal('${s.id}')" class="py-1.5 bg-[#3a301a] hover:bg-[#4a3e20] text-[#e0b87a] border border-[#e0b87a]/40 rounded-xl text-[11px] font-bold flex items-center justify-center gap-1" title="Acheter et mettre à jour le stock">

                  </button>
                </div>
              </div>
            `;
          }).join('')}

      `;
    }

    function renderExpensesSubViewHtml(totalExpenses) {
      const todayIso = new Date().toISOString().slice(0, 10);
      const currentMonthPrefix = todayIso.slice(0, 7); // 'YYYY-MM'

      let filtered = [...state.expenses];

      if (expenseFilterMode === 'date' && expenseDateFilter) {
        filtered = filtered.filter(e => 
          (e.dateIso && e.dateIso === expenseDateFilter) ||
          (e.date && e.date.includes(formatDisplayDate(expenseDateFilter)))
        );
      } else if (expenseFilterMode === 'today') {
        filtered = filtered.filter(e => 
          (e.dateIso && e.dateIso === todayIso) ||
          (e.date && e.date.includes('24 Sep'))
        );
      } else if (expenseFilterMode === 'month') {
        filtered = filtered.filter(e => 
          (e.dateIso && e.dateIso.startsWith(currentMonthPrefix)) ||
          (e.date && (e.date.includes('Sep') || e.date.includes('09')))
        );
      } else if (expenseFilterMode === 'stock') {
        filtered = filtered.filter(e => e.isStockable);
      } else if (expenseFilterMode === 'operational') {
        filtered = filtered.filter(e => !e.isStockable);
      } else if (expenseFilterMode === 'recent5') {
        if (filtered.length > 5) {
          filtered = filtered.slice(0, 5);
        }
      }

      const subTotal = filtered.reduce((s, e) => s + (e.amount || 0), 0);

      return `
        <!-- Barre de filtres ultra-compacte Achats (1 seule ligne rapide) -->
        <div class="bg-[#1a2a1a] p-1.5 rounded-2xl border border-[#2d4a2d] flex items-center justify-between gap-1.5 mb-2 text-[11px] select-none">
          <div class="flex items-center gap-1 overflow-x-auto no-scrollbar py-0.5 flex-1">
            <button onclick="setExpenseFilterMode('recent5')" class="px-2.5 py-1 rounded-lg font-bold whitespace-nowrap transition-all ${expenseFilterMode === 'recent5' ? 'bg-[#7bc67e] text-[#0f1a0f] shadow' : 'bg-[#0f1a0f] text-[#aaa] border border-[#2d4a2d] hover:text-white'}">
              ⏱️ 5 Derniers
            </button>
            <button onclick="setExpenseFilterMode('today')" class="px-2.5 py-1 rounded-lg font-bold whitespace-nowrap transition-all ${expenseFilterMode === 'today' ? 'bg-[#7bc67e] text-[#0f1a0f] shadow' : 'bg-[#0f1a0f] text-[#aaa] border border-[#2d4a2d] hover:text-white'}">
              📅 Aujourd'hui
            </button>
            <button onclick="setExpenseFilterMode('month')" class="px-2.5 py-1 rounded-lg font-bold whitespace-nowrap transition-all ${expenseFilterMode === 'month' ? 'bg-[#7bc67e] text-[#0f1a0f] shadow' : 'bg-[#0f1a0f] text-[#aaa] border border-[#2d4a2d] hover:text-white'}">
              🗓️ Ce mois
            </button>
            <button onclick="setExpenseFilterMode('stock')" class="px-2.5 py-1 rounded-lg font-bold whitespace-nowrap transition-all ${expenseFilterMode === 'stock' ? 'bg-[#7bc67e] text-[#0f1a0f] shadow' : 'bg-[#0f1a0f] text-[#aaa] border border-[#2d4a2d] hover:text-white'}">
              📦 Stocks (${state.expenses.filter(e => e.isStockable).length})
            </button>
            <button onclick="setExpenseFilterMode('operational')" class="px-2.5 py-1 rounded-lg font-bold whitespace-nowrap transition-all ${expenseFilterMode === 'operational' ? 'bg-[#7bc67e] text-[#0f1a0f] shadow' : 'bg-[#0f1a0f] text-[#aaa] border border-[#2d4a2d] hover:text-white'}">
              ⚡ Charges (${state.expenses.filter(e => !e.isStockable).length})
            </button>
            <button onclick="setExpenseFilterMode('all')" class="px-2.5 py-1 rounded-lg font-bold whitespace-nowrap transition-all ${expenseFilterMode === 'all' ? 'bg-[#7bc67e] text-[#0f1a0f] shadow' : 'bg-[#0f1a0f] text-[#aaa] border border-[#2d4a2d] hover:text-white'}">
              📜 Tout (${state.expenses.length})
            </button>
          </div>

          <!-- Bouton Calendrier compact -->
          <div class="relative flex items-center flex-shrink-0">
            <label class="px-2 py-1 rounded-lg font-bold whitespace-nowrap transition-all cursor-pointer flex items-center gap-1 ${expenseFilterMode === 'date' && expenseDateFilter ? 'bg-[#2d5a2d] text-white border border-[#7bc67e]' : 'bg-[#0f1a0f] text-slate-300 border border-[#2d4a2d] hover:text-white'}">
              <span>🗓️</span>
              <span>${expenseDateFilter ? formatDisplayDate(expenseDateFilter) : 'Date'}</span>
              <input type="date" value="${expenseDateFilter}" onchange="onExpenseDateChange(this.value)" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer" />
            </label>
            ${expenseDateFilter ? `
              <button onclick="clearExpenseDateFilter()" class="ml-1 text-xs text-red-400 hover:text-red-300 font-bold px-1" title="Effacer date">✕</button>
            ` : ''}
          </div>
        </div>

        <!-- Indicateur de statut des achats affichés & sous-total -->
        <div class="flex justify-between items-center px-1 text-[11px] text-[#888] mb-2">
          <span>
            ${expenseFilterMode === 'recent5' ? 'Affichage des <strong>5 derniers achats</strong>' :
              (expenseFilterMode === 'date' ? `Achats du <strong>${formatDisplayDate(expenseDateFilter)}</strong>` :
              (expenseFilterMode === 'today' ? 'Achats d\'<strong>aujourd\'hui</strong>' :
              (expenseFilterMode === 'month' ? 'Achats de <strong>ce mois</strong>' :
              (expenseFilterMode === 'stock' ? 'Achats pour le <strong>stock</strong>' :
              (expenseFilterMode === 'operational' ? 'Charges d\'<strong>exploitation</strong>' :
              '<strong>Tous les achats</strong>')))))}
          </span>
          <span class="text-[#7bc67e] font-mono font-bold">Total : ${subTotal.toLocaleString()} DA</span>
        </div>

        <!-- Liste des Dépenses & Achats -->
        <div class="space-y-2">
          ${filtered.length === 0 ? `
            <div class="bg-[#1a2a1a] p-6 rounded-2xl border border-[#2d4a2d] text-center text-[#888] text-xs">
              Aucune dépense trouvée pour ce filtre.
            </div>
          ` : filtered.map(e => {
            const isStockLinked = e.isStockable && e.stockItemId;
            return `
              <div class="bg-[#1a2a1a] p-3 rounded-2xl border border-[#2d4a2d] space-y-1.5 text-xs">
                <div class="flex justify-between items-start">
                  <div>
                    <div class="flex items-center gap-1.5 flex-wrap">
                      <span class="font-bold text-white text-xs">${e.label}</span>
                      ${isStockLinked ? `
                        <span class="text-[9px] bg-emerald-950 text-emerald-300 border border-emerald-500/40 px-1.5 py-0.5 rounded-full font-bold flex items-center gap-0.5">
                          <span>📦</span> <span>+${e.qty || 1} ${e.unit || 'u'} au stock</span>
                        </span>
                      ` : `
                        <span class="text-[9px] bg-amber-950 text-amber-300 border border-amber-500/40 px-1.5 py-0.5 rounded-full font-bold flex items-center gap-0.5">
                          <span>⚡</span> <span>Charge exploitation</span>
                        </span>
                      `}
                    </div>
                    <p class="text-[10px] text-[#888] mt-0.5">
                      <span>📅 ${e.date || ''}</span>
                      ${e.category ? ` • <span>📂 ${e.category}</span>` : ''}
                      ${e.supplier ? ` • <span class="text-slate-300">🏪 ${e.supplier}</span>` : ''}
                    </p>
                  </div>
                  <div class="flex items-center gap-2">
                    <span class="text-[#e07a7a] font-bold text-sm">-${e.amount.toLocaleString()} DA</span>
                    <button onclick="deleteExpense('${e.id}')" class="text-slate-500 hover:text-red-400 p-1 text-xs" title="Supprimer">🗑️</button>
                  </div>
                </div>

                ${e.qty && e.unitPrice ? `
                  <div class="bg-[#0f1a0f] px-2.5 py-1.5 rounded-xl border border-[#2d4a2d]/60 flex justify-between text-[11px] text-[#aaa]">
                    <span>Détail : <strong class="text-white">${e.qty} ${e.unit || ''}</strong> × <strong class="text-white">${e.unitPrice} DA / ${e.unit || ''}</strong></span>
                    <span class="text-[#7bc67e] font-semibold">${e.amount.toLocaleString()} DA</span>
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function openNewStockModal() {
      const unitsOptions = (state.units || ['kg', 'unités', 'L', 'g']).map(u => `<option value="${u}">${u}</option>`).join('');
      showModal(`
        <h3 class="text-sm font-bold text-white mb-2 flex items-center gap-1.5">
          <span>📦</span> <span>Ajouter un Article au Stock</span>
        </h3>
        <div class="space-y-2.5 text-xs">
          <div>
            <label class="text-[#888] block mb-1">Désignation de l'article</label>
            <input id="stk-name" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white" placeholder="ex: Chaux éteinte pour pasteurisation">
          </div>
          <div>
            <label class="text-[#888] block mb-1">Catégorie</label>
            <select id="stk-category" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white">
              <option value="Matière première">Matière première (Paille/Blanc)</option>
              <option value="Consommable">Consommable (Sacs, attaches)</option>
              <option value="Sanitation">Sanitation & Désinfection</option>
              <option value="Autre">Autre</option>
            </select>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[#888] block mb-1">Quantité initiale en stock</label>
              <input id="stk-qty" type="number" step="any" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white font-bold" value="25">
            </div>
            <div>
              <label class="text-[#888] block mb-1">Unité</label>
              <select id="stk-unit" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white" onchange="onNewStockUnitChange(this.value)">
                ${unitsOptions}
                <option value="__NEW_UNIT__">+ Ajouter une unité...</option>
              </select>
              <input id="stk-custom-unit" class="w-full bg-[#0f1a0f] border border-[#7bc67e] rounded-xl p-2 text-white text-xs mt-1.5 hidden" placeholder="Nouvelle unité (ex: paquet)">
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[#888] block mb-1">Seuil d'alerte critique</label>
              <input id="stk-threshold" type="number" step="any" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white font-bold" value="5">
            </div>
            <div>
              <label class="text-[#888] block mb-1">Coût d'achat (DA / unité)</label>
              <input id="stk-cost" type="number" step="any" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white font-bold" value="400">
            </div>
          </div>
          <div class="pt-3 flex gap-2">
            <button onclick="closeModal()" class="flex-1 py-2.5 bg-[#2d4a2d] rounded-xl text-white font-bold">Annuler</button>
            <button onclick="saveNewStockItem()" class="flex-1 py-2.5 bg-[#4a9e4e] rounded-xl text-white font-bold shadow">Enregistrer</button>
          </div>
        </div>
      `);
    }

    function onNewStockUnitChange(val) {
      const customInput = document.getElementById('stk-custom-unit');
      if (customInput) {
        if (val === '__NEW_UNIT__') {
          customInput.classList.remove('hidden');
          customInput.focus();
        } else {
          customInput.classList.add('hidden');
        }
      }
    }

    function saveNewStockItem() {
      const name = document.getElementById('stk-name').value.trim();
      const category = document.getElementById('stk-category').value;
      const qty = parseFloat(document.getElementById('stk-qty').value) || 0;
      let unit = document.getElementById('stk-unit').value;
      if (unit === '__NEW_UNIT__') {
        const customUnit = (document.getElementById('stk-custom-unit').value || '').trim();
        if (customUnit) {
          unit = customUnit;
          if (!state.units.includes(unit)) state.units.push(unit);
        } else {
          unit = 'unités';
        }
      }
      const threshold = parseFloat(document.getElementById('stk-threshold').value) || 5;
      const cost = parseFloat(document.getElementById('stk-cost').value) || 0;

      if (!name) return alert('Désignation requise.');
      state.stocks.push({ id: 'stk_' + Date.now(), name, category, quantity: qty, unit, threshold, cost });
      saveState();
      closeModal();
      showToast('Article ajouté au stock !');
    }

    function openStockMvtModal(id, type) {
      const item = state.stocks.find(s => s.id === id);
      if (!item) return;

      showModal(`
        <h3 class="text-sm font-bold text-white mb-1">${type === 'in' ? '+ Réapprovisionnement' : '- Sortie Consommation'}</h3>
        <p class="text-xs text-[#7bc67e] mb-3">${item.name} • Actuel : ${item.quantity} ${item.unit}</p>
        <div class="space-y-3 text-xs">
          <div>
            <label class="text-[#888] block mb-1">Quantité (${item.unit})</label>
            <input id="mvt-qty" type="number" step="0.5" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-3 text-white text-lg font-bold" placeholder="10" autofocus>
          </div>
          <div class="flex gap-2 pt-2">
            <button onclick="closeModal()" class="flex-1 py-2.5 bg-[#2d4a2d] rounded-xl text-white font-bold">Annuler</button>
            <button onclick="applyStockMvt('${id}', '${type}')" class="flex-1 py-2.5 bg-[#4a9e4e] rounded-xl text-white font-bold shadow">Valider</button>
          </div>
        </div>
      `);
    }

    function applyStockMvt(id, type) {
      const val = parseFloat(document.getElementById('mvt-qty').value);
      if (!val || val <= 0) return alert('Quantité invalide.');
      const item = state.stocks.find(s => s.id === id);
      if (item) {
        if (type === 'in') item.quantity = Math.round((item.quantity + val) * 100) / 100;
        else item.quantity = Math.max(0, Math.round((item.quantity - val) * 100) / 100);
        saveState();
        showToast('Stock mis à jour.');
      }
      closeModal();
    }

    function deleteStockItem(id) {
      if (confirm('Supprimer cet article ?')) {
        state.stocks = state.stocks.filter(s => s.id !== id);
        saveState();
        showToast('Article supprimé.');
      }
    }

    function openEditThresholdModal(id) {
      const item = state.stocks.find(s => s.id === id);
      if (!item) return;

      showModal(`
        <h3 class="text-sm font-bold text-white mb-2 flex items-center gap-1.5">
          <span>⚙️</span> <span>Seuil & Paramètres Stock</span>
        </h3>
        <p class="text-xs text-[#7bc67e] mb-3">${item.name} (${item.unit})</p>
        <div class="space-y-3 text-xs">
          <div>
            <label class="text-[#888] block mb-1">Désignation de l'article</label>
            <input id="edit-stk-name" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white" value="${item.name}">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[#888] block mb-1">Seuil d'alerte critique (${item.unit})</label>
              <input id="edit-stk-threshold" type="number" step="any" class="w-full bg-[#0f1a0f] border border-[#7bc67e] rounded-xl p-2.5 text-white font-bold text-base" value="${item.threshold}">
              <p class="text-[10px] text-[#888] mt-1">Alerte si stock &le; cette valeur</p>
            </div>
            <div>

    function saveEditedThreshold(id) {
      const item = state.stocks.find(s => s.id === id);
      if (!item) return;

      const newName = (document.getElementById('edit-stk-name').value || '').trim();
      const newThreshold = parseFloat(document.getElementById('edit-stk-threshold').value);
      const newCost = parseFloat(document.getElementById('edit-stk-cost').value);

      if (newName) item.name = newName;
      if (!isNaN(newThreshold) && newThreshold >= 0) item.threshold = newThreshold;
      if (!isNaN(newCost) && newCost >= 0) item.cost = newCost;

      saveState();
      closeModal();
      showToast('Seuil et paramètres mis à jour !');

    function saveNewBatch() {
      const code = document.getElementById('batch-code').value.trim();
      const strain = document.getElementById('batch-strain').value.trim();
      const dry = parseFloat(document.getElementById('batch-dry').value) || 50;
      const count = parseInt(document.getElementById('batch-bags').value) || 10;

      state.batches.unshift({
        id: code, strain, substrate: 'Paille hachée (Fût 200L)',
        strawDry: dry, strawWet: Math.round(dry * 3.2), spawnKg: 7, bagCount: count, date: new Date().toISOString().slice(0, 10), status: 'Actif'
      });

      for (let i = 1; i <= Math.min(count, 8); i++) {
        state.bags.unshift({
          id: `BAG-${code.slice(-5)}-${i.toString().padStart(3, '0')}`,
          batchId: code, status: 'incubation', weight: 5.0, strain: strain, harvestedKg: 0
        });
      }
      saveState();
      closeModal();
      showToast(`Lot ${code} généré !`);
    }

    function markContaminated(id) {
      const b = state.bags.find(x => x.id === id);
      if (b && confirm(`Déclarer ${id} contaminé ?`)) {

    function onExpenseStockChange(val) {
      const newStockBox = document.getElementById('exp-new-stock-box');
      const preview = document.getElementById('exp-stock-preview');
      const autoStockCheck = document.getElementById('exp-auto-stock');
      const labelInput = document.getElementById('exp-label');
      const unitSelect = document.getElementById('exp-unit');
      const unitPriceInput = document.getElementById('exp-unit-price');

      if (val === '__NEW_STOCK__') {
        newStockBox.classList.remove('hidden');
        preview.classList.add('hidden');
        autoStockCheck.checked = true;
      } else if (val) {
        newStockBox.classList.add('hidden');
        preview.classList.remove('hidden');
        autoStockCheck.checked = true;

        const s = state.stocks.find(x => x.id === val);
        if (s) {
          if (!labelInput.value || labelInput.value.startsWith('Achat ')) {
            labelInput.value = 'Achat ' + s.name;
          }
          if (s.unit && unitSelect) {
            unitSelect.value = s.unit;
          }
          if (s.cost && unitPriceInput) {
            unitPriceInput.value = s.cost;
          }
          onExpenseCalcChange('unitPrice');
        }
      } else {
        newStockBox.classList.add('hidden');
        preview.classList.add('hidden');
        autoStockCheck.checked = false;
      }
    }

    function onExpenseCatChange(val) {
      const container = document.getElementById('new-cat-container');
      const input = document.getElementById('exp-custom-cat');
      if (val === '__NEW_CAT__') {
        container.classList.remove('hidden');
        if (input) input.focus();
      } else {
        container.classList.add('hidden');
      }
    }

    function onExpenseUnitChange(val) {
      const container = document.getElementById('new-unit-container');
      const input = document.getElementById('exp-custom-unit');
      if (val === '__NEW_UNIT__') {
        container.classList.remove('hidden');
        if (input) input.focus();
      } else {
        container.classList.add('hidden');
      }
      onExpenseCalcChange('unit');
    }

    function onExpenseCalcChange(source) {
      const qtyEl = document.getElementById('exp-qty');
      const upEl = document.getElementById('exp-unit-price');
      const amountEl = document.getElementById('exp-amount');
      const stockIdEl = document.getElementById('exp-stock-id');
      const previewEl = document.getElementById('exp-stock-preview');
      const previewTextEl = document.getElementById('exp-preview-text');
      const unitEl = document.getElementById('exp-unit');

      if (!qtyEl || !upEl || !amountEl) return;

      const qty = parseFloat(qtyEl.value) || 0;
      const unit = unitEl ? (unitEl.value === '__NEW_UNIT__' ? (document.getElementById('exp-custom-unit')?.value || 'u') : unitEl.value) : 'u';

      if (source === 'qty' || source === 'unitPrice' || source === 'unit') {
        const up = parseFloat(upEl.value) || 0;
        if (qty > 0 && up > 0) {
          amountEl.value = Math.round(qty * up);
        }
      } else if (source === 'total') {
        const total = parseFloat(amountEl.value) || 0;
        if (qty > 0 && total > 0) {
          upEl.value = Math.round((total / qty) * 100) / 100;
        }
      }

      // Mettre à jour l'aperçu dynamique du stock
      if (stockIdEl && stockIdEl.value && stockIdEl.value !== '__NEW_STOCK__' && previewTextEl) {
        const s = state.stocks.find(x => x.id === stockIdEl.value);
        if (s) {
          const newQty = Math.round((s.quantity + qty) * 100) / 100;
          previewTextEl.innerText = `Stock actuel : ${s.quantity} ${s.unit} ➔ Deviendra : ${newQty} ${s.unit}`;
          if (previewEl) previewEl.classList.remove('hidden');
        }
      }
    }

    function saveNewExpense() {
      const stockIdVal = document.getElementById('exp-stock-id').value;
      let label = document.getElementById('exp-label').value.trim();
      const amount = parseFloat(document.getElementById('exp-amount').value) || 0;
      const qty = parseFloat(document.getElementById('exp-qty').value) || 1;
      const unitPrice = parseFloat(document.getElementById('exp-unit-price').value) || (amount / qty);
      const supplier = document.getElementById('exp-supplier').value.trim();
      const autoStock = document.getElementById('exp-auto-stock').checked;

      // 1. Résolution de la catégorie
      let category = document.getElementById('exp-cat').value;
      if (category === '__NEW_CAT__') {
        const customCat = (document.getElementById('exp-custom-cat').value || '').trim();
        if (customCat) {
          category = customCat;
          if (!state.expenseCategories.includes(category)) {
            state.expenseCategories.push(category);
          }
        } else {
          category = 'Autre charge';
        }
      }

      // 2. Résolution de l'unité
      let unit = document.getElementById('exp-unit').value;
      if (unit === '__NEW_UNIT__') {
        const customUnit = (document.getElementById('exp-custom-unit').value || '').trim();
        if (customUnit) {
          unit = customUnit;
          if (!state.units.includes(unit)) {
            state.units.push(unit);
          }
        } else {
          unit = 'unités';
        }
      }

      if (!label && stockIdVal && stockIdVal !== '__NEW_STOCK__') {
        const s = state.stocks.find(x => x.id === stockIdVal);
        if (s) label = 'Achat ' + s.name;
      }
      if (!label) return alert('Veuillez saisir un libellé / motif pour la dépense.');
      if (amount <= 0) return alert('Le montant total doit être supérieur à 0 DA.');

      // 3. Mise à jour ou création du Stock si lié
      let linkedStockId = null;
      let isStockable = false;
      let stockMsg = '';

      if (stockIdVal === '__NEW_STOCK__') {
        const newStockName = (document.getElementById('exp-new-stock-name').value || '').trim() || label;
        const newStockId = 'stk_' + Date.now();
        state.stocks.push({
          id: newStockId,
          name: newStockName,
          category: category.includes('Sanitation') ? 'Sanitation' : (category.includes('Consommable') ? 'Consommable' : 'Matière première'),
          quantity: autoStock ? qty : 0,
          unit: unit,
          threshold: 5,
          cost: unitPrice > 0 ? unitPrice : 100
        });
        linkedStockId = newStockId;
        isStockable = true;
        stockMsg = ` • Nouvel article "${newStockName}" créé dans le stock (${qty} ${unit})`;
      } else if (stockIdVal) {
        linkedStockId = stockIdVal;
        isStockable = true;
        const s = state.stocks.find(x => x.id === stockIdVal);
        if (s && autoStock) {
          const oldQty = s.quantity;
          s.quantity = Math.round((s.quantity + qty) * 100) / 100;
          if (unitPrice > 0) s.cost = unitPrice;
          stockMsg = ` • Stock "${s.name}" actualisé : ${oldQty} ➔ ${s.quantity} ${s.unit}`;
        }
      }

      // 4. Enregistrement de la dépense
      const today = new Date();
      const dateStr = today.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
      const dateIso = today.toISOString().slice(0, 10);

      state.expenses.unshift({
        id: 'exp_' + Date.now(),
        label,
        amount,
        category,
        qty,
        unit,
        unitPrice: Math.round(unitPrice * 100) / 100,
        supplier,
        isStockable,
        stockItemId: linkedStockId,
        date: dateStr,
        dateIso
      });

      saveState();
      closeModal();
      showToast(`Dépense de ${amount.toLocaleString()} DA enregistrée !${stockMsg}`);
    }

    function deleteExpense(id) {
      const exp = state.expenses.find(e => e.id === id);
      if (!exp) return;

      let extraWarning = '';
      const linkedStock = (exp.isStockable && exp.stockItemId) ? state.stocks.find(s => s.id === exp.stockItemId) : null;
      if (linkedStock) {
        extraWarning = `\n\nCet achat avait augmenté le stock de "${linkedStock.name}" de +${exp.qty} ${exp.unit}.`;
      }

      if (confirm(`Supprimer la dépense "${exp.label}" (-${exp.amount.toLocaleString()} DA) ?${extraWarning}`)) {
        if (linkedStock && exp.qty > 0) {
          if (confirm(`Voulez-vous aussi déduire les ${exp.qty} ${exp.unit} qui avaient été ajoutés au stock de "${linkedStock.name}" ?`)) {
            linkedStock.quantity = Math.max(0, Math.round((linkedStock.quantity - exp.qty) * 100) / 100);
            showToast(`Dépense supprimée et ${exp.qty} ${exp.unit} retirés du stock.`);
          } else {
            showToast('Dépense supprimée (stock conservé).');
          }
        } else {
          showToast('Dépense retirée.');
        }

        state.expenses = state.expenses.filter(e => e.id !== id);
        saveState();
      }
    }

    // Modal Helpers
    function showModal(content) {
      document.getElementById('modal-container').innerHTML = content;
      document.getElementById('modal-backdrop').classList.remove('hidden');
    }
    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    function openScanModal() {
      showModal(`
        <h3 class="text-sm font-bold text-white mb-2 text-center">📷 Scanner QR Sac</h3>
        <div class="space-y-2 max-h-60 overflow-y-auto">
          ${state.bags.map(b => `
            <button onclick="closeModal(); switchTab('bags'); showToast('Scan : ' + '${b.id}');" class="w-full text-left bg-[#0f1a0f] p-3 rounded-xl border border-[#2d4a2d] text-xs flex justify-between items-center hover:border-[#7bc67e]">
              <span class="font-mono text-white font-bold">${b.id}</span>
              <span class="text-[#7bc67e]">${b.status}</span>
            </button>
          `).join('')}
        </div>
        <button onclick="closeModal()" class="w-full mt-3 py-2.5 bg-[#2d4a2d] rounded-xl text-white text-xs font-bold">Fermer</button>
      `);
    }

    function updateClock() {
      const d = new Date();
      const h = d.getHours().toString().padStart(2, '0');
      const m = d.getMinutes().toString().padStart(2, '0');
      const el = document.getElementById('live-clock');
      if (el) el.innerText = `${h}:${m}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Initialisation
    checkBadges();
    setRole('admin');
  </script>
</body>
</html>
