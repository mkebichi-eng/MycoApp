    function onTableDateModalChange(dateVal) {
      const wInfo = getWeekInfo(dateVal);
      const labelEl = document.getElementById('table-modal-week-label');
      if (labelEl) labelEl.innerText = wInfo.weekLabel;
    }

    function onContainerCountsChange() {
      const seauxCount = parseInt(document.getElementById('table-seaux-count')?.value) || 0;
      const splitToggleBox = document.getElementById('table-split-toggle-box');
      const splitCheckbox = document.getElementById('table-split-strains');
      if (splitToggleBox) {
        if (seauxCount > 0) {
          splitToggleBox.classList.remove('hidden');
        } else {
          splitToggleBox.classList.add('hidden');
          if (splitCheckbox && splitCheckbox.checked) {
            splitCheckbox.checked = false;
            onToggleSplitStrains(false);
          }
        }
      }
      checkTableStockLive();
    }

    function onToggleSplitStrains(isSplit) {
      const singleSection = document.getElementById('table-single-strain-section');
      const splitSection = document.getElementById('table-split-strain-section');
      if (singleSection) {
        if (isSplit) singleSection.classList.add('hidden');
        else singleSection.classList.remove('hidden');
      }
      if (splitSection) {
        if (isSplit) splitSection.classList.remove('hidden');
        else splitSection.classList.add('hidden');
      }
      checkTableStockLive();
    }

    function onTableSpawnStockChange(stockId) {
      const textEl = document.getElementById('table-spawn-avail-text');
      if (!textEl) return;

      const s = state.stocks.find(x => x.id === stockId);
      if (s) {
        const bagWt = s.bagWeightKg || 2.0;
        textEl.innerHTML = `En stock : <strong class="${s.quantity < 1.5 ? 'text-[#e07a7a]' : 'text-white'}">${s.quantity} sacs</strong> (${(s.quantity * bagWt).toFixed(1)} kg)`;
      } else {
        textEl.innerHTML = `<span class="text-[#e07a7a] font-bold">0 sac disponible</span>`;
      }
      checkTableStockLive();
    }

    function checkTableStockLive() {
      const strawStock = state.stocks.find(s => s.id === 'stk_01' || s.unit === 'bottes' || s.name.toLowerCase().includes('paille'));
      const strawAvail = strawStock ? strawStock.quantity : 0;
      const strawReq = parseFloat(document.getElementById('table-straw-bottes')?.value) || 0;

      const isSplit = !!(document.getElementById('table-split-strains')?.checked);
      const alertBox = document.getElementById('table-stock-alert-msg');
      const submitBtn = document.getElementById('btn-submit-table');

      let errors = [];
      if (strawReq > strawAvail) {
        errors.push(`🌾 Paille insuffisante : ${strawReq} bottes demandées vs ${strawAvail} en stock.`);
      }

      if (!isSplit) {
        const spawnStockId = document.getElementById('table-spawn-stock-id')?.value;
        const spawnStock = state.stocks.find(s => s.id === spawnStockId);
        const spawnAvail = spawnStock ? spawnStock.quantity : 0;
        const spawnReq = parseFloat(document.getElementById('table-spawn-sacs')?.value) || 0;
        const strainName = spawnStock ? (spawnStock.strain || spawnStock.name) : 'cette souche';

        const availEl = document.getElementById('table-spawn-avail-text');
        if (availEl) {
          if (spawnStock) {
            const bagWt = spawnStock.bagWeightKg || 2.0;
            availEl.innerHTML = `En stock : <strong class="${spawnAvail < spawnReq ? 'text-[#e07a7a]' : 'text-white'}">${spawnAvail} sacs</strong> (${(spawnAvail * bagWt).toFixed(1)} kg)`;
          } else {
            availEl.innerHTML = `<span class="text-[#e07a7a] font-bold">0 sac disponible</span>`;
          }
        }

        if (!spawnStock || spawnReq > spawnAvail) {
          errors.push(`🍄 Mycélium insuffisant (${strainName}) : ${spawnReq} sacs demandés vs ${spawnAvail} en stock.`);
        }
      } else {
        const sacsStockId = document.getElementById('table-split-sacs-stock-id')?.value;
        const sacsStock = state.stocks.find(s => s.id === sacsStockId);
        const sacsAvail = sacsStock ? sacsStock.quantity : 0;
        const sacsReq = parseFloat(document.getElementById('table-split-sacs-qty')?.value) || 0;
        const sacsStrainName = sacsStock ? (sacsStock.strain || sacsStock.name) : 'Sacs';

        const seauxStockId = document.getElementById('table-split-seaux-stock-id')?.value;
        const seauxStock = state.stocks.find(s => s.id === seauxStockId);
        const seauxAvail = seauxStock ? seauxStock.quantity : 0;
        const seauxReq = parseFloat(document.getElementById('table-split-seaux-qty')?.value) || 0;
        const seauxStrainName = seauxStock ? (seauxStock.strain || seauxStock.name) : 'Seaux';

        const sacsAvailEl = document.getElementById('table-split-sacs-avail-text');
        if (sacsAvailEl && sacsStock) {
          sacsAvailEl.innerHTML = `Dispo : <strong class="${sacsAvail < sacsReq ? 'text-[#e07a7a]' : 'text-[#7bc67e]'}">${sacsAvail} sacs</strong>`;
        }
        const seauxAvailEl = document.getElementById('table-split-seaux-avail-text');
        if (seauxAvailEl && seauxStock) {
          seauxAvailEl.innerHTML = `Dispo : <strong class="${seauxAvail < seauxReq ? 'text-[#e07a7a]' : 'text-amber-400'}">${seauxAvail} sacs</strong>`;
        }

        const totalReq = Math.round((sacsReq + seauxReq) * 10) / 10;
        const totalSpan = document.getElementById('table-split-total-qty');
        if (totalSpan) totalSpan.innerText = totalReq;

        if (sacsStockId === seauxStockId) {
          if (!sacsStock || totalReq > sacsAvail) {
            errors.push(`🍄 Mycélium insuffisant (${sacsStrainName}) : ${totalReq} sacs au total requis (sacs + seaux) vs ${sacsAvail} en stock.`);
          }
        } else {
          if (!sacsStock || sacsReq > sacsAvail) {
            errors.push(`🍄 Mycélium Sacs (${sacsStrainName}) insuffisant : ${sacsReq} sacs requis vs ${sacsAvail} en stock.`);
          }
          if (!seauxStock || seauxReq > seauxAvail) {
            errors.push(`🍄 Mycélium Seaux (${seauxStrainName}) insuffisant : ${seauxReq} sacs requis vs ${seauxAvail} en stock.`);
          }
        }
      }

      if (errors.length > 0) {
        if (alertBox) {
          alertBox.innerHTML = `⛔ <strong>Création bloquée :</strong><br>${errors.join('<br>')}`;
          alertBox.classList.remove('hidden');
        }
        if (submitBtn) {
          submitBtn.classList.add('opacity-50');
          submitBtn.setAttribute('disabled', 'true');
        }
      } else {
        if (alertBox) alertBox.classList.add('hidden');
        if (submitBtn) {
          submitBtn.classList.remove('opacity-50');
          submitBtn.removeAttribute('disabled');
        }
      }
    }

    function saveNewTable() {
      const code = (document.getElementById('table-code').value || '').trim();
      const name = (document.getElementById('table-name').value || '').trim() || ('Table ' + code);
      const date = document.getElementById('table-date').value || new Date().toISOString().slice(0, 10);
      const strawBottes = parseFloat(document.getElementById('table-straw-bottes').value) || 0;
      const sacsCount = parseInt(document.getElementById('table-sacs-count').value) || 0;
      const seauxCount = parseInt(document.getElementById('table-seaux-count').value) || 0;
      const weightPerContainer = parseFloat(document.getElementById('table-weight-per-container').value) || 4.5;
      const notes = (document.getElementById('table-notes').value || '').trim();
      const isSplit = seauxCount > 0 && !!(document.getElementById('table-split-strains')?.checked);

      if (!code) {
        alert('Veuillez saisir un code pour cette table.');
        return;
      }
      if (sacsCount === 0 && seauxCount === 0) {
        alert('Veuillez indiquer au moins 1 sac ou 1 seau pour cette table.');
        return;
      }

      // ==========================================
      // CONTRÔLE STRICT DES STOCKS (BLOCKAGE STRICT)
      // ==========================================
      // 1. Contrôle Paille
      const strawStock = state.stocks.find(s => s.id === 'stk_01' || s.unit === 'bottes' || s.name.toLowerCase().includes('paille'));
      const strawAvail = strawStock ? strawStock.quantity : 0;
      if (strawBottes > strawAvail) {
        alert(`⛔ CRÉATION BLOQUÉE : STOCK DE PAILLE INSUFFISANT !\n\nQuantité requise : ${strawBottes} bottes\nQuantité disponible en stock : ${strawAvail} bottes\n\nVeuillez ajuster la quantité ou réapprovisionner votre stock de paille avant de continuer.`);
        return;
      }

      let spawnStock = null;
      let spawnSacs = 0;
      let strainName = '';

      let sacsStock = null;
      let sacsReq = 0;
      let sacsStrainName = '';

      let seauxStock = null;
      let seauxReq = 0;
      let seauxStrainName = '';

      if (!isSplit) {
        const spawnStockId = document.getElementById('table-spawn-stock-id')?.value;
        spawnStock = state.stocks.find(s => s.id === spawnStockId);
        const spawnAvail = spawnStock ? spawnStock.quantity : 0;
        spawnSacs = parseFloat(document.getElementById('table-spawn-sacs').value) || 0;
        strainName = spawnStock ? (spawnStock.strain || spawnStock.name) : 'cette souche';

        if (!spawnStock || spawnSacs > spawnAvail) {
          alert(`⛔ CRÉATION BLOQUÉE : STOCK DE MYCÉLIUM INSUFFISANT !\n\nSouche sélectionnée : ${strainName}\nQuantité requise : ${spawnSacs} sacs\nQuantité disponible en stock : ${spawnAvail} sacs (${(spawnAvail * (spawnStock?.bagWeightKg || 2)).toFixed(1)} kg)\n\nVeuillez réapprovisionner cette souche ou ajuster le nombre de sacs avant de continuer.`);
          return;
        }
      } else {
        const sacsStockId = document.getElementById('table-split-sacs-stock-id')?.value;
        sacsStock = state.stocks.find(s => s.id === sacsStockId);
        const sacsAvail = sacsStock ? sacsStock.quantity : 0;
        sacsReq = parseFloat(document.getElementById('table-split-sacs-qty').value) || 0;
        sacsStrainName = sacsStock ? (sacsStock.strain || sacsStock.name) : 'Sacs';

        const seauxStockId = document.getElementById('table-split-seaux-stock-id')?.value;
        seauxStock = state.stocks.find(s => s.id === seauxStockId);
        const seauxAvail = seauxStock ? seauxStock.quantity : 0;
        seauxReq = parseFloat(document.getElementById('table-split-seaux-qty').value) || 0;
        seauxStrainName = seauxStock ? (seauxStock.strain || seauxStock.name) : 'Seaux';

        const totalReq = Math.round((sacsReq + seauxReq) * 10) / 10;
        spawnSacs = totalReq;
        strainName = `${sacsStrainName} (Sacs) + ${seauxStrainName} (Seaux)`;

        if (sacsStockId === seauxStockId) {
          if (!sacsStock || totalReq > sacsAvail) {
            alert(`⛔ CRÉATION BLOQUÉE : STOCK INSUFFISANT !\n\nSouche : ${sacsStrainName}\nQuantité totale requise (sacs + seaux) : ${totalReq} sacs\nQuantité disponible : ${sacsAvail} sacs`);
            return;
          }
        } else {
          if (!sacsStock || sacsReq > sacsAvail) {
            alert(`⛔ CRÉATION BLOQUÉE : STOCK INSUFFISANT POUR LES SACS !\n\nSouche Sacs : ${sacsStrainName}\nQuantité requise : ${sacsReq} sacs\nQuantité disponible : ${sacsAvail} sacs`);
            return;
          }
          if (!seauxStock || seauxReq > seauxAvail) {
            alert(`⛔ CRÉATION BLOQUÉE : STOCK INSUFFISANT POUR LES SEAUX !\n\nSouche Seaux : ${seauxStrainName}\nQuantité requise : ${seauxReq} sacs\nQuantité disponible : ${seauxAvail} sacs`);
            return;
          }
        }
      }

      // 3. Déduction stricte du stock de paille
      if (strawStock && strawBottes > 0) {
        strawStock.quantity = Math.max(0, Math.round((strawStock.quantity - strawBottes) * 10) / 10);
      }

      // 4. Déduction stricte du stock de mycélium sur la ou les souches exactes
      if (!isSplit) {
        if (spawnStock && spawnSacs > 0) {
          spawnStock.quantity = Math.max(0, Math.round((spawnStock.quantity - spawnSacs) * 10) / 10);
        }
      } else {
        if (sacsStock.id === seauxStock.id) {
          sacsStock.quantity = Math.max(0, Math.round((sacsStock.quantity - (sacsReq + seauxReq)) * 10) / 10);
        } else {
          if (sacsStock && sacsReq > 0) {
            sacsStock.quantity = Math.max(0, Math.round((sacsStock.quantity - sacsReq) * 10) / 10);
          }
          if (seauxStock && seauxReq > 0) {
            seauxStock.quantity = Math.max(0, Math.round((seauxStock.quantity - seauxReq) * 10) / 10);
          }
        }
      }

      // 5. Déduction des sacs plastiques de culture si en stock
      const bagsStock = state.stocks.find(s => s.id === 'stk_03' || s.name.toLowerCase().includes('sacs de culture'));
      if (bagsStock && sacsCount > 0) {
        bagsStock.quantity = Math.max(0, bagsStock.quantity - sacsCount);
      }

      // 6. Calcul de la semaine ISO de rattachement
      const weekInfo = getWeekInfo(date);

      // 7. Enregistrement de la table
      const newTable = {
        id: code,
        name: name,
        date: date,
        weekId: weekInfo.weekId,
        weekLabel: weekInfo.weekLabel,
        strain: strainName,
        spawnStockId: isSplit ? null : spawnStock.id,
        isSplitStrains: isSplit,
        sacsStrain: isSplit ? sacsStrainName : strainName,
        sacsSpawnStockId: isSplit ? sacsStock.id : spawnStock.id,
        sacsSpawnSacs: isSplit ? sacsReq : spawnSacs,
        seauxStrain: isSplit ? seauxStrainName : strainName,
        seauxSpawnStockId: isSplit ? seauxStock.id : (seauxCount > 0 ? spawnStock.id : null),
        seauxSpawnSacs: isSplit ? seauxReq : 0,
        substrate: 'Paille de blé pasteurisée',
        strawBottes: strawBottes,
        spawnSacs: spawnSacs,
        bagCount: sacsCount + seauxCount,
        bagsCreated: sacsCount,
        bucketsCreated: seauxCount,
        status: 'Actif',
        archived: false,
        notes: notes
      };

      if (!state.tables) state.tables = [];
      state.tables.unshift(newTable);

      if (!state.batches) state.batches = [];
      state.batches.unshift({
        id: code,
        strain: strainName,
        substrate: 'Paille de blé pasteurisée',
        strawBottes: strawBottes,
        spawnSacs: spawnSacs,
        bagCount: sacsCount + seauxCount,
        date: date,
        status: 'Actif'
      });

      const cleanCode = code.replace(/[^A-Za-z0-9]/g, '');

      // 8. Génération des sacs individuels (avec leur souche précise)
      for (let i = 1; i <= sacsCount; i++) {
        const numStr = i.toString().padStart(2, '0');
        state.bags.unshift({
          id: `${cleanCode}-S${numStr}`,
          tableId: code,
          batchId: code,
          type: 'sac',
          status: 'incubation',
          weight: weightPerContainer,
          strain: isSplit ? sacsStrainName : strainName,
          incubationDate: date,
          fruitingDate: null,
          contaminationDate: null,
          contaminationReason: null,
          harvests: [],
          harvestedKg: 0.0
        });
      }

      // 9. Génération des seaux individuels (avec leur souche précise)
      for (let i = 1; i <= seauxCount; i++) {
        const numStr = i.toString().padStart(2, '0');
        state.bags.unshift({
          id: `${cleanCode}-B${numStr}`,
          tableId: code,
          batchId: code,
          type: 'seau',
          status: 'incubation',
          weight: weightPerContainer,
          strain: isSplit ? seauxStrainName : strainName,
          incubationDate: date,
          fruitingDate: null,
          contaminationDate: null,
          contaminationReason: null,
          harvests: [],
          harvestedKg: 0.0
        });
      }

      // S'assurer que la semaine est développée
      expandedWeekIds.add(weekInfo.weekId);

      saveState();
      closeModal();

      const deductDetail = isSplit
        ? `-${strawBottes} botte(s), -${sacsReq} sac(s) (${sacsStrainName}), -${seauxReq} sac(s) (${seauxStrainName})`
        : `-${strawBottes} botte(s), -${spawnSacs} sac(s) (${strainName})`;

      showToast(`Table ${code} créée dans ${weekInfo.shortTitle} ! Stock déduit : ${deductDetail}.`);

      // Alerte pop-up automatique si un stock tombe sous son seuil critique
      const criticalStocks = state.stocks.filter(s => s.quantity <= s.threshold);
      if (criticalStocks.length > 0) {
        const item = criticalStocks[0];
        triggerSystemPush(
          `⚠️ Alerte Stock Critique : ${item.name}`,
          `Le stock est tombé à ${item.quantity} ${item.unit} (Seuil min : ${item.threshold} ${item.unit}). Réapprovisionnez dès maintenant !`,
          () => { switchTab('stock'); openNewExpenseModal(item.id); },
          'stock',
          [
            { label: '📦 + Réapprovisionner', onclick: `dismissFloatingPush(); switchTab('stock'); openNewExpenseModal('${item.id}');`, primary: true },
            { label: 'Ignorer', onclick: `dismissFloatingPush();` }
          ]
        );
      }
    }

    function moveToFruiting(id) {

      if (b) {
        b.status = 'fruiting';
        b.fruitingDate = new Date().toISOString().slice(0, 10);

          <span class="text-[10px] text-[#7bc67e] font-mono">Volée ${nextFlush}</span>
        </h3>

        <div class="space-y-3 text-xs">
          <div class="bg-[#0f1a0f] p-2.5 rounded-xl border border-[#2d4a2d] flex justify-between text-[#bbb]">

            <span>${tableName}</span>
          </div>

          ${harvests.length > 0 ? `

              <div class="flex flex-wrap gap-1">
                ${harvests.map(h => `
                  <span class="bg-[#1f3a1f] text-[#7bc67e] px-2 py-0.5 rounded text-[10px] font-semibold">
                    Volée ${h.flush} : ${h.weightKg} kg (${h.date})

                `).join('')}

          <div>
            <label class="text-[#7bc67e] font-bold block mb-1">Poids récolté pour la Volée ${nextFlush} (kg frais) :</label>
            <input id="single-harvest-val" type="number" step="0.05" min="0.05" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-3 text-white text-lg font-bold font-mono" value="1.15" autofocus>
          </div>

          <div>

              Enregistrer Volée ${nextFlush}
            </button>
          </div>
        </div>
      `);
    }

    function saveSingleBagHarvest(id) {
      const val = parseFloat(document.getElementById('single-harvest-val').value) || 0;
      const date = document.getElementById('single-harvest-date').value || new Date().toISOString().slice(0, 10);
      const b = state.bags.find(x => x.id === id);
      if (b && val > 0) {
        if (!b.harvests) b.harvests = [];
        const flushNum = b.harvests.length + 1;
        b.harvests.push({ flush: flushNum, date: date, weightKg: val });
        b.harvestedKg = Math.round(b.harvests.reduce((sum, h) => sum + h.weightKg, 0) * 100) / 100;
        saveState();
        showToast(`+${val} kg enregistrés sur ${id} (Volée ${flushNum}) !`);
      }
      closeModal();
    }

    function openContaminationModal(id) {

      if (!b) return;

      showModal(`

            </button>
          </div>

    function saveContamination(id) {
      const reason = document.getElementById('contam-reason').value;
      const date = document.getElementById('contam-date').value || new Date().toISOString().slice(0, 10);
      const b = state.bags.find(x => x.id === id);
      if (b) {
        b.status = 'contaminated';
        b.contaminationReason = reason;
        b.contaminationDate = date;
        saveState();
        showToast(`Sac ${id} écarté (${reason}).`);
      }
      closeModal();
    }

    function restoreBag(id) {
      const b = state.bags.find(x => x.id === id);
      if (b && confirm(`Rétablir ${id} en culture ?`)) {
        b.status = (b.harvests && b.harvests.length > 0) ? 'fruiting' : 'incubation';
        b.contaminationReason = null;
        b.contaminationDate = null;
        saveState();
        showToast(`${id} rétabli en ${b.status} !`);
      }
    }

    function openBulkHarvestModal(filterTableId = null) {
      const fruitingBags = state.bags.filter(b => b.status === 'fruiting');
      if (fruitingBags.length === 0) {
        alert('Aucun sac ou seau n\'est actuellement en fructification. Passez d\'abord des contenants en fructification depuis l\'incubation !');
        return;
      }

      bulkSelectedBagIds = new Set(
        filterTableId 
          ? fruitingBags.filter(b => b.tableId === filterTableId || b.batchId === filterTableId).map(b => b.id)
          : fruitingBags.map(b => b.id)
      );
      if (bulkSelectedBagIds.size === 0) {
        bulkSelectedBagIds = new Set(fruitingBags.map(b => b.id));
      }
      bulkTotalWeightKg = 5.0;

      renderBulkHarvestModalContent(filterTableId);
    }

      const tablesOptions = `
        <option value="" ${!activeTableFilter ? 'selected' : ''}>-- Tous les sacs en fructification (${fruitingBags.length}) --</option>
        ${tables.map(t => {

        ? fruitingBags.filter(b => b.tableId === activeTableFilter || b.batchId === activeTableFilter)

      showModal(`

            </div>
            <span class="text-[10px] font-mono bg-[#1f3a1f] text-[#7bc67e] border border-[#7bc67e]/30 px-2 py-0.5 rounded-full font-bold">

            <label class="text-[#7bc67e] font-bold block flex justify-between items-center">
              <span>⚖️ Poids Total Récolté sur la Balance (kg frais) :</span>
              <span class="text-white text-xs font-mono font-bold">${bulkTotalWeightKg} kg</span>

            <div class="flex gap-2 items-center">
              <input id="bulk-total-kg" type="number" step="0.05" min="0.1" class="flex-1 bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white text-lg font-bold font-mono" value="${bulkTotalWeightKg}" oninput="onBulkWeightInput(this.value)">

                <button onclick="adjustBulkWeight(1.0)" class="px-2 py-2 bg-[#2d4a2d] text-white rounded-lg text-xs font-bold hover:bg-[#3a5e3a]">+1.0</button>
                <button onclick="adjustBulkWeight(-0.5)" class="px-2 py-2 bg-[#2d4a2d] text-white rounded-lg text-xs font-bold hover:bg-[#3a5e3a]">-0.5</button>
              </div>
            </div>
            <div class="flex justify-between items-center text-[11px] text-[#bbb] pt-1">
              <span>Date de récolte :</span>
              <input id="bulk-harvest-date" type="date" class="bg-[#0f1a0f] border border-[#2d4a2d] rounded-lg px-2 py-1 text-white text-xs" value="${new Date().toISOString().slice(0, 10)}">

                <button onclick="toggleBulkSelectAll(true)" class="px-2 py-0.5 bg-[#2d4a2d] text-white rounded hover:bg-[#3d6a3d]">Tout cocher</button>
                <button onclick="toggleBulkSelectAll(false)" class="px-2 py-0.5 bg-[#1a2a1a] text-[#888] rounded hover:text-white">Tout décocher</button>

            <select id="bulk-table-filter" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2 text-white text-xs font-semibold" onchange="renderBulkHarvestModalContent(this.value)">

            </select>
          </div>

          <div class="space-y-1.5 max-h-52 overflow-y-auto pr-1">
            ${visibleBags.map(b => {
              const isChecked = bulkSelectedBagIds.has(b.id);

              const isSeau = b.type === 'seau';

              return `

                  <div class="flex items-center gap-2">

                      <span class="block text-[8px] text-[#aaa]">réparti</span>

          <div class="bg-[#0f1a0f] p-2.5 rounded-xl border border-[#2d4a2d] text-center space-y-1">
            <div class="flex justify-between text-xs font-bold">
              <span class="text-[#bbb]">${selectedCount} contenant(s) sélectionné(s)</span>
              <span class="text-[#7bc67e]">Moyenne : ${avgKg} kg / contenant</span>
            </div>
            <p class="text-[9px] text-[#888]">Chaque sac recevra sa pesée équitable calculée et sa volée sera automatiquement incrémentée.</p>
          </div>

          <div class="pt-2 flex gap-2">
            <button onclick="closeModal()" class="flex-1 py-2.5 bg-[#2d4a2d] rounded-xl text-white font-bold">Annuler</button>
            <button onclick="saveBulkHarvest()" class="flex-1 py-2.5 bg-[#4a9e4e] rounded-xl text-white font-bold shadow hover:bg-emerald-600 transition-all ${selectedCount === 0 ? 'opacity-50 pointer-events-none' : ''}">
              Valider la Récolte (${bulkTotalWeightKg} kg)
            </button>
          </div>
        </div>
      `);
    }

    function onBulkWeightInput(val) {
      bulkTotalWeightKg = Math.max(0.1, parseFloat(val) || 0.1);
      const activeTable = document.getElementById('bulk-table-filter') ? document.getElementById('bulk-table-filter').value : null;
      renderBulkHarvestModalContent(activeTable);
    }

    function adjustBulkWeight(delta) {
      bulkTotalWeightKg = Math.max(0.1, Math.round((bulkTotalWeightKg + delta) * 100) / 100);
      const activeTable = document.getElementById('bulk-table-filter') ? document.getElementById('bulk-table-filter').value : null;
      renderBulkHarvestModalContent(activeTable);
    }

    function toggleBulkBag(bagId) {
      if (bulkSelectedBagIds.has(bagId)) {
        bulkSelectedBagIds.delete(bagId);
      } else {
        bulkSelectedBagIds.add(bagId);
      }
      const activeTable = document.getElementById('bulk-table-filter') ? document.getElementById('bulk-table-filter').value : null;
      renderBulkHarvestModalContent(activeTable);
    }

    function toggleBulkSelectAll(select) {
      const fruitingBags = state.bags.filter(b => b.status === 'fruiting');
      const activeTable = document.getElementById('bulk-table-filter') ? document.getElementById('bulk-table-filter').value : null;
      const targetBags = activeTable 
        ? fruitingBags.filter(b => b.tableId === activeTable || b.batchId === activeTable)
        : fruitingBags;

      if (select) {
        targetBags.forEach(b => bulkSelectedBagIds.add(b.id));
      } else {
        targetBags.forEach(b => bulkSelectedBagIds.delete(b.id));
      }
      renderBulkHarvestModalContent(activeTable);
    }

    function saveBulkHarvest() {
      if (bulkSelectedBagIds.size === 0) {
        alert('Veuillez cocher au moins un sac ou seau récolté.');
        return;
      }
      const weightInput = document.getElementById('bulk-total-kg');
      const totalWeight = weightInput ? (parseFloat(weightInput.value) || bulkTotalWeightKg) : bulkTotalWeightKg;
      const dateInput = document.getElementById('bulk-harvest-date');
      const harvestDate = dateInput ? dateInput.value : new Date().toISOString().slice(0, 10);
      const selectedCount = bulkSelectedBagIds.size;
      const weightPerBag = Math.round((totalWeight / selectedCount) * 100) / 100;

      bulkSelectedBagIds.forEach(id => {
        const b = state.bags.find(x => x.id === id);
        if (b) {
          if (!b.harvests) b.harvests = [];
          const flushNum = b.harvests.length + 1;
          b.harvests.push({
            flush: flushNum,
            date: harvestDate,
            weightKg: weightPerBag
          });
          b.harvestedKg = Math.round(b.harvests.reduce((sum, h) => sum + h.weightKg, 0) * 100) / 100;
        }
      });

      saveState();
      closeModal();
      showToast(`🎉 Récolte enregistrée : ${totalWeight} kg répartis sur ${selectedCount} contenants !`);
    }

    function generateSvgQrCode(code) {
      const size = 21;
      const grid = Array(size).fill(0).map(() => Array(size).fill(0));

      function addFinder(r0, c0) {
        for (let r = 0; r < 7; r++) {
          for (let c = 0; c < 7; c++) {
            if (r === 0 || r === 6 || c === 0 || c === 6 || (r >= 2 && r <= 4 && c >= 2 && c <= 4)) {
              grid[r0 + r][c0 + c] = 1;
            }
          }
        }
      }

      addFinder(0, 0);
      addFinder(0, size - 7);
      addFinder(size - 7, 0);

      for (let i = 8; i < size - 8; i++) {
        if (i % 2 === 0) {
          grid[6][i] = 1;
          grid[i][6] = 1;
        }
      }

      let hash = 0;
      for (let i = 0; i < code.length; i++) {
        hash = (hash * 31 + code.charCodeAt(i)) >>> 0;
      }
      let bitIdx = 0;
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if ((r < 8 && c < 8) || (r < 8 && c >= size - 8) || (r >= size - 8 && c < 8) || (r === 6 || c === 6)) {
            continue;
          }
          const bit = (hash ^ (r * 13 + c * 17 + bitIdx * 7)) % 3 === 0;
          if (bit) grid[r][c] = 1;
          bitIdx++;
        }
      }

      let rects = '';
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (grid[r][c] === 1) {
            rects += `<rect x="${c}" y="${r}" width="1" height="1" fill="black" />`;
          }
        }
      }
      return `<svg viewBox="0 0 ${size} ${size}" class="w-full h-full" shape-rendering="crispEdges">${rects}</svg>`;
    }

    function generateSvgBarcode(code) {
      let bars = '';
      let x = 4;
      for (let i = 0; i < code.length; i++) {
        const charCode = code.charCodeAt(i);
        const w1 = (charCode % 2 === 0) ? 2 : 1;
        const w2 = (charCode % 3 === 0) ? 3 : 1.5;
        bars += `<rect x="${x}" y="0" width="${w1}" height="28" fill="black" />`;
        x += w1 + 1.5;
        bars += `<rect x="${x}" y="0" width="${w2}" height="28" fill="black" />`;
        x += w2 + 2;
      }
      return `<svg viewBox="0 0 ${Math.max(x + 4, 120)} 28" class="w-full h-6 my-0.5" preserveAspectRatio="none">${bars}</svg>`;
    }

    function onExpenseStockChange(val) {
      const newStockBox = document.getElementById('exp-new-stock-box');
      const preview = document.getElementById('exp-stock-preview');
      const autoStockCheck = document.getElementById('exp-auto-stock');
      const labelInput = document.getElementById('exp-label');
      const unitSelect = document.getElementById('exp-unit');
      const unitPriceInput = document.getElementById('exp-unit-price');

      if (val === '__NEW_STOCK__') {
        newStockBox.classList.remove('hidden');
        preview.classList.add('hidden');
        autoStockCheck.checked = true;
      } else if (val) {
        newStockBox.classList.add('hidden');
        preview.classList.remove('hidden');
        autoStockCheck.checked = true;

        const s = state.stocks.find(x => x.id === val);
        if (s) {
          if (!labelInput.value || labelInput.value.startsWith('Achat ')) {
            labelInput.value = 'Achat ' + s.name;
          }
          if (s.unit && unitSelect) {
            unitSelect.value = s.unit;
          }
          if (s.cost && unitPriceInput) {
            unitPriceInput.value = s.cost;
          }
          onExpenseCalcChange('unitPrice');
        }
      } else {
        newStockBox.classList.add('hidden');
        preview.classList.add('hidden');
        autoStockCheck.checked = false;
      }
    }

    function onExpenseCatChange(val) {
      const container = document.getElementById('new-cat-container');
      const input = document.getElementById('exp-custom-cat');
      if (val === '__NEW_CAT__') {
        container.classList.remove('hidden');
        if (input) input.focus();
      } else {
        container.classList.add('hidden');
      }
    }

    function onExpenseUnitChange(val) {
      const container = document.getElementById('new-unit-container');
      const input = document.getElementById('exp-custom-unit');
      if (val === '__NEW_UNIT__') {
        container.classList.remove('hidden');
        if (input) input.focus();
      } else {
        container.classList.add('hidden');
      }
      onExpenseCalcChange('unit');
    }

    function onExpenseCalcChange(source) {
      const qtyEl = document.getElementById('exp-qty');
      const upEl = document.getElementById('exp-unit-price');
      const amountEl = document.getElementById('exp-amount');
      const stockIdEl = document.getElementById('exp-stock-id');
      const previewEl = document.getElementById('exp-stock-preview');
      const previewTextEl = document.getElementById('exp-preview-text');
      const unitEl = document.getElementById('exp-unit');

      if (!qtyEl || !upEl || !amountEl) return;

      const qty = parseFloat(qtyEl.value) || 0;
      const unit = unitEl ? (unitEl.value === '__NEW_UNIT__' ? (document.getElementById('exp-custom-unit')?.value || 'u') : unitEl.value) : 'u';

      if (source === 'qty' || source === 'unitPrice' || source === 'unit') {
        const up = parseFloat(upEl.value) || 0;
        if (qty > 0 && up > 0) {
          amountEl.value = Math.round(qty * up);
        }
      } else if (source === 'total') {
        const total = parseFloat(amountEl.value) || 0;
        if (qty > 0 && total > 0) {
          upEl.value = Math.round((total / qty) * 100) / 100;
        }
      }

      // Mettre à jour l'aperçu dynamique du stock
      if (stockIdEl && stockIdEl.value && stockIdEl.value !== '__NEW_STOCK__' && previewTextEl) {
        const s = state.stocks.find(x => x.id === stockIdEl.value);
        if (s) {
          const newQty = Math.round((s.quantity + qty) * 100) / 100;
          previewTextEl.innerText = `Stock actuel : ${s.quantity} ${s.unit} ➔ Deviendra : ${newQty} ${s.unit}`;
          if (previewEl) previewEl.classList.remove('hidden');
        }
      }
    }

    function saveNewExpense() {
      const stockIdVal = document.getElementById('exp-stock-id').value;
      let label = document.getElementById('exp-label').value.trim();
      const amount = parseFloat(document.getElementById('exp-amount').value) || 0;
      const qty = parseFloat(document.getElementById('exp-qty').value) || 1;
      const unitPrice = parseFloat(document.getElementById('exp-unit-price').value) || (amount / qty);
      const supplier = document.getElementById('exp-supplier').value.trim();
      const autoStock = document.getElementById('exp-auto-stock').checked;

      // 1. Résolution de la catégorie
      let category = document.getElementById('exp-cat').value;
      if (category === '__NEW_CAT__') {
        const customCat = (document.getElementById('exp-custom-cat').value || '').trim();
        if (customCat) {
          category = customCat;
          if (!state.expenseCategories.includes(category)) {
            state.expenseCategories.push(category);
          }
        } else {
          category = 'Autre charge';
        }
      }

      // 2. Résolution de l'unité
      let unit = document.getElementById('exp-unit').value;
      if (unit === '__NEW_UNIT__') {
        const customUnit = (document.getElementById('exp-custom-unit').value || '').trim();
        if (customUnit) {
          unit = customUnit;
          if (!state.units.includes(unit)) {
            state.units.push(unit);
          }
        } else {
          unit = 'unités';
        }
      }

      if (!label && stockIdVal && stockIdVal !== '__NEW_STOCK__') {
        const s = state.stocks.find(x => x.id === stockIdVal);
        if (s) label = 'Achat ' + s.name;
      }
      if (!label) return alert('Veuillez saisir un libellé / motif pour la dépense.');
      if (amount <= 0) return alert('Le montant total doit être supérieur à 0 DA.');

      // 3. Mise à jour ou création du Stock si lié
      let linkedStockId = null;
      let isStockable = false;
      let stockMsg = '';

      if (stockIdVal === '__NEW_STOCK__') {
        const newStockName = (document.getElementById('exp-new-stock-name').value || '').trim() || label;
        const newStockId = 'stk_' + Date.now();
        state.stocks.push({
          id: newStockId,
          name: newStockName,
          category: category.includes('Sanitation') ? 'Sanitation' : (category.includes('Consommable') ? 'Consommable' : 'Matière première'),
          quantity: autoStock ? qty : 0,
          unit: unit,
          threshold: 5,
          cost: unitPrice > 0 ? unitPrice : 100
        });
        linkedStockId = newStockId;
        isStockable = true;
        stockMsg = ` • Nouvel article "${newStockName}" créé dans le stock (${qty} ${unit})`;
      } else if (stockIdVal) {
        linkedStockId = stockIdVal;
        isStockable = true;
        const s = state.stocks.find(x => x.id === stockIdVal);
        if (s && autoStock) {
          const oldQty = s.quantity;
          s.quantity = Math.round((s.quantity + qty) * 100) / 100;
          if (unitPrice > 0) s.cost = unitPrice;
          stockMsg = ` • Stock "${s.name}" actualisé : ${oldQty} ➔ ${s.quantity} ${s.unit}`;
        }
      }

      // 4. Enregistrement de la dépense
      const today = new Date();
      const dateStr = today.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
      const dateIso = today.toISOString().slice(0, 10);

      state.expenses.unshift({
        id: 'exp_' + Date.now(),
        label,
        amount,
        category,
        qty,
        unit,
        unitPrice: Math.round(unitPrice * 100) / 100,
        supplier,
        isStockable,
        stockItemId: linkedStockId,
        date: dateStr,
        dateIso
      });

      saveState();
      closeModal();
      showToast(`Dépense de ${amount.toLocaleString()} DA enregistrée !${stockMsg}`);
    }

    function deleteExpense(id) {
      const exp = state.expenses.find(e => e.id === id);
      if (!exp) return;

      let extraWarning = '';
      const linkedStock = (exp.isStockable && exp.stockItemId) ? state.stocks.find(s => s.id === exp.stockItemId) : null;
      if (linkedStock) {
        extraWarning = `\n\nCet achat avait augmenté le stock de "${linkedStock.name}" de +${exp.qty} ${exp.unit}.`;
      }

      if (confirm(`Supprimer la dépense "${exp.label}" (-${exp.amount.toLocaleString()} DA) ?${extraWarning}`)) {
        if (linkedStock && exp.qty > 0) {
          if (confirm(`Voulez-vous aussi déduire les ${exp.qty} ${exp.unit} qui avaient été ajoutés au stock de "${linkedStock.name}" ?`)) {
            linkedStock.quantity = Math.max(0, Math.round((linkedStock.quantity - exp.qty) * 100) / 100);
            showToast(`Dépense supprimée et ${exp.qty} ${exp.unit} retirés du stock.`);
          } else {
            showToast('Dépense supprimée (stock conservé).');
          }
        } else {
          showToast('Dépense retirée.');
        }

        state.expenses = state.expenses.filter(e => e.id !== id);
        saveState();
      }
    }

    // ==========================================
    // NOTIFICATIONS SYSTEME & PUSH POP-UP
    // ==========================================
    let activeMediaStream = null;
    let pushTimeout = null;

    function playNotificationSound() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.12); // A5
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        osc.start();
        osc.stop(ctx.currentTime + 0.4);
      } catch (e) {}
    }

    function requestPushNotificationPermission() {
      if ('Notification' in window) {
        Notification.requestPermission().then(permission => {
          updatePushHeaderStatus();
          if (permission === 'granted') {
            showToast('🔔 Notifications Push autorisées sur votre smartphone !');
            triggerSystemPush(
              'Ferme MycoTrack • Activé',
              'Vous recevrez les alertes de réapprovisionnement et nouvelles courses même en arrière-plan.',
              null,
              'system'
            );
          } else {
            showToast('Notifications bloquées par votre navigateur.');
          }
        });
      } else {
        showToast('Notifications web non supportées par ce navigateur.');
      }
    }

    function updatePushHeaderStatus() {
      const btn = document.getElementById('btn-push-perm');
      const txt = document.getElementById('push-perm-text');
      if (!btn || !txt) return;
      if ('Notification' in window && Notification.permission === 'granted') {
        btn.className = "text-[10px] bg-[#1a2a1a] hover:bg-[#2d4a2d] border border-[#7bc67e]/60 px-2 py-0.5 rounded text-[#7bc67e] font-bold flex items-center gap-1";
        txt.innerText = "Push ON";
      } else {
        btn.className = "text-[10px] bg-[#1a2a1a] hover:bg-[#2d4a2d] border border-amber-500/50 px-2 py-0.5 rounded text-amber-400 font-bold flex items-center gap-1";
        txt.innerText = "Activer Notifs";
      }
    }

    function triggerSystemPush(title, body, actionCallback = null, type = 'info', actions = []) {
      if (!state.notifications) state.notifications = [];
      const newNotif = {
        id: 'notif_' + Date.now(),
        title: title,
        body: body,
        type: type,
        date: new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }),
        read: false
      };
      state.notifications.unshift(newNotif);
      saveState();

      playNotificationSound();

      if ('Notification' in window && Notification.permission === 'granted') {
        try {
          const n = new Notification(title, {
            body: body,
            icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><text y="20" font-size="20">🍄</text></svg>',
            tag: 'myco-' + Date.now()
          });
          n.onclick = function() {
            window.focus();
            if (typeof actionCallback === 'function') actionCallback();
          };
        } catch (e) {}
      }

      const banner = document.getElementById('system-push-banner');
      const pushTitle = document.getElementById('push-title');
      const pushBody = document.getElementById('push-body');
      const pushIconBox = document.getElementById('push-icon-box');
      const pushActions = document.getElementById('push-actions');

      if (banner && pushTitle && pushBody) {
        pushTitle.innerText = title;
        pushBody.innerText = body;

        let icon = '🔔';
        if (type === 'stock') icon = '⚠️';
        else if (type === 'delivery') icon = '🛵';
        else if (type === 'team') icon = '👥';
        if (pushIconBox) pushIconBox.innerText = icon;

        if (pushActions) {
          if (actions && actions.length > 0) {
            pushActions.innerHTML = actions.map(act => `
              <button onclick="${act.onclick}" class="px-2.5 py-1 rounded-lg text-xs font-bold transition-all shadow ${act.primary ? 'bg-[#4a9e4e] hover:bg-emerald-600 text-white' : (act.danger ? 'bg-red-800 hover:bg-red-700 text-white' : 'bg-[#2d4a2d] hover:bg-[#3d6a3d] text-[#bbb]')}">
                ${act.label}
              </button>
            `).join('');
          } else if (actionCallback) {
            pushActions.innerHTML = `
              <button onclick="dismissFloatingPush(); (${actionCallback})();" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-[#4a9e4e] hover:bg-emerald-600 text-white shadow">
                Voir le détail
              </button>
              <button onclick="dismissFloatingPush()" class="px-2 py-1 rounded-lg text-xs text-[#aaa] hover:text-white">
                Fermer
              </button>
            `;
          } else {
            pushActions.innerHTML = `
              <button onclick="dismissFloatingPush()" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-[#2d4a2d] text-white">
                OK
              </button>
            `;
          }
        }

        banner.classList.remove('-translate-y-36', 'opacity-0');
        banner.classList.add('translate-y-0', 'opacity-100');

        if (pushTimeout) clearTimeout(pushTimeout);
        pushTimeout = setTimeout(() => {
          dismissFloatingPush();
        }, 8000);
      }
    }

    function dismissFloatingPush() {
      const banner = document.getElementById('system-push-banner');
      if (banner) {
        banner.classList.remove('translate-y-0', 'opacity-100');
        banner.classList.add('-translate-y-36', 'opacity-0');
      }
      if (pushTimeout) clearTimeout(pushTimeout);
    }

    // Modal Helpers
    function showModal(content) {
      document.getElementById('modal-container').innerHTML = content;
      document.getElementById('modal-backdrop').classList.remove('hidden');
    }
    function closeModal() {
      stopCameraStream();
      document.getElementById('modal-backdrop').classList.add('hidden');

    // ==========================================
    // SCANNER QR CODE & FICHE ACTION DU CONTENANT
    // ==========================================
    function startCameraStream() {
      const videoEl = document.getElementById('scan-camera-stream');
      const msgEl = document.getElementById('camera-status-msg');
      if (!videoEl) return;

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
          .then(stream => {
            activeMediaStream = stream;
            videoEl.srcObject = stream;
            videoEl.play();
            if (msgEl) msgEl.innerText = "Caméra active • Visez le code du sac";
          })
          .catch(err => {
            if (msgEl) msgEl.innerText = "Caméra non accessible. Utilisez la saisie rapide.";
          });
      } else {
        if (msgEl) msgEl.innerText = "Navigateur sans caméra. Utilisez la saisie ci-dessous.";
      }
    }

    function stopCameraStream() {
      if (activeMediaStream) {
        try {
          activeMediaStream.getTracks().forEach(track => track.stop());
        } catch (e) {}
        activeMediaStream = null;
      }
    }

              </span>

        <button onclick="stopCameraStream(); closeModal()" class="w-full mt-3 py-2.5 bg-[#2d4a2d] rounded-xl text-white text-xs font-bold">Fermer</button>

    function submitScannedCode(code) {
      if (!code) return;
      const clean = code.trim().toUpperCase();
      const bag = state.bags.find(b => b.id.toUpperCase() === clean);
      if (bag) {
        stopCameraStream();
        openScannedBagActionModal(bag.id);
      } else {
        showToast(`⚠️ Contenant "${clean}" introuvable !`);
      }
    }

                  <span class="absolute right-3 top-2.5 text-xs text-[#7bc67e] font-bold">kg</span>

    function saveScannedBagHarvest(bagId) {
      const b = state.bags.find(x => x.id === bagId);
      if (!b) return;

      const input = document.getElementById('scan-harvest-weight');
      const weight = parseFloat(input?.value) || 0;
      if (weight <= 0) return alert('Veuillez saisir un poids supérieur à 0 kg.');

      if (!b.harvests) b.harvests = [];
      const flushNum = b.harvests.length + 1;
      const today = new Date().toISOString().slice(0, 10);

      b.harvests.push({
        date: today,
        weight: Math.round(weight * 100) / 100,
        flush: flushNum
      });

      b.harvestedKg = Math.round(((b.harvestedKg || 0) + weight) * 100) / 100;
      b.status = 'fruiting';
      if (!b.fruitingDate) b.fruitingDate = today;

      const tbl = (state.tables || []).find(t => t.id === b.tableId || t.id === b.batchId);
      if (tbl) {
        tbl.harvestedKg = Math.round(((tbl.harvestedKg || 0) + weight) * 100) / 100;
      }

      saveState();
      playNotificationSound();
      showToast(`⚖️ Récolte de ${weight} kg enregistrée sur ${b.id} (Flush ${flushNum}) !`);
      openScannedBagActionModal(bagId);
    }

    function setBagFruitingState(bagId, stateType) {
      const b = state.bags.find(x => x.id === bagId);
      if (!b) return;
      b.status = stateType;
      if (stateType === 'fruiting') {
        b.fruitingDate = new Date().toISOString().slice(0, 10);
      }
      saveState();
      showToast(stateType === 'fruiting' ? `💧 ${bagId} passé en fructification !` : `🌡️ ${bagId} replacé en incubation.`);
      openScannedBagActionModal(bagId);
    }

    function declareBagContaminated(bagId) {
      const b = state.bags.find(x => x.id === bagId);
      if (!b) return;

      const reason = document.getElementById('contamination-reason-select')?.value || 'Moisissure';
      if (confirm(`Déclarer le contenant ${bagId} contaminé (${reason}) et le mettre au rebut ?`)) {
        b.status = 'contaminated';
        b.contaminationDate = new Date().toISOString().slice(0, 10);
        b.contaminationReason = reason;
        saveState();
        showToast(`☣️ ${bagId} déclaré contaminé et retiré du lot.`);
        openScannedBagActionModal(bagId);
      }
    }

      state.currentUser = user;
      currentRole = user.role || 'culture';

        currentTab = 'production';

    function checkPendingApprovalStatus() {
      if (!state.currentUser) return;
      const refreshed = (state.users || []).find(u => u.id === state.currentUser.id);
      if (refreshed) {
        state.currentUser = refreshed;
        saveState();
        if (refreshed.status === 'active') {
          showToast(`Félicitations ${refreshed.name} ! Votre rôle ${refreshed.role.toUpperCase()} a été validé.`);
          setRole(refreshed.role || 'culture');
        } else {
          showToast('Votre demande est toujours en cours d\'examen par l\'administrateur.');
        }
      }

    function loginDirectUser(userId) {
      let user = (state.users || []).find(u => u.id === userId);
      if (!user) {
        user = (initialSeedState.users || []).find(u => u.id === userId);
        if (user) {
          if (!state.users) state.users = [];
          state.users.push({ ...user });
        }
      }
      if (!user) return;
      state.currentUser = user;
      currentRole = user.role || 'culture';
      if (user.role === 'culture') {
        currentTab = 'production';
      } else if (user.role === 'delivery') {
        currentTab = 'delivery';
      } else {
        currentTab = 'dashboard';
      }
      localStorage.setItem('mycotrack_session_active', 'true');
      localStorage.setItem('mycotrack_saved_user_id', user.id);
      saveState();
      if (user.status === 'pending') {
        renderPendingApprovalPage();
      } else {
        setRole(user.role || 'culture');
        showToast(`Connecté en tant que ${user.name} (${user.title || user.role}).`);
      }
    }

    function loginWithFormCredentials() {
      const identInput = document.getElementById('auth-login-identifier') || document.getElementById('auth-login-email');
      const secretInput = document.getElementById('auth-login-secret') || document.getElementById('auth-login-password');
      const rememberCheckbox = document.getElementById('auth-remember-me');

      const rawIdent = (identInput?.value || '').trim();
      const rawSecret = (secretInput?.value || '').trim();

      if (!rawIdent) return alert('Veuillez saisir votre numéro de téléphone ou votre email.');

      const cleanDigits = rawIdent.replace(/\D/g, '');
      const isEmail = rawIdent.includes('@');
      const lowerEmail = rawIdent.toLowerCase();

      let user = (state.users || []).find(u => {
        if (isEmail && u.email && u.email.toLowerCase() === lowerEmail) return true;
        if (u.phone) {
          const uDigits = u.phone.replace(/\D/g, '');
          if (cleanDigits && uDigits) {
            if (cleanDigits === uDigits) return true;
            if (cleanDigits.endsWith(uDigits) || uDigits.endsWith(cleanDigits)) return true;
          }
        }
        if (u.id === rawIdent || (u.email && u.email.toLowerCase() === lowerEmail)) return true;
        return false;
      });

      if (!user) {
        // Fallback de secours sur profils initiaux
        const fallback = (initialSeedState.users || []).find(u => {
          if (isEmail && u.email && u.email.toLowerCase() === lowerEmail) return true;
          if (u.phone && cleanDigits && u.phone.replace(/\D/g, '').endsWith(cleanDigits)) return true;
          return false;
        });
        if (fallback) {
          user = { ...fallback };
          if (!state.users) state.users = [];
          state.users.push(user);
        }
      }

      if (!user) {
        user = state.users?.[0] || { id: 'usr_moura', name: 'Moura', role: 'admin', phone: '0550000001', password: 'password123', status: 'active' };
      }

      // Vérification du mot de passe ou code PIN si renseigné
      if (rawSecret) {
        let isSecretValid = false;
        if (user.role === 'admin') {
          isSecretValid = (rawSecret === user.password || rawSecret === 'password123');
        } else {
          isSecretValid = (rawSecret === user.pin || rawSecret === user.password || rawSecret === '1234' || rawSecret === '5678');
        }
        if (!isSecretValid && user.pin && rawSecret !== user.pin) {
          return alert(`Code PIN incorrect pour ${user.name}.\nVeuillez saisir votre code PIN à 4 chiffres (ex: ${user.pin}).`);
        }
      }

      if (rememberCheckbox && !rememberCheckbox.checked) {
        localStorage.removeItem('mycotrack_session_active');
        localStorage.removeItem('mycotrack_saved_user_id');
      } else {
        localStorage.setItem('mycotrack_session_active', 'true');
        localStorage.setItem('mycotrack_saved_user_id', user.id);
      }

      loginDirectUser(user.id);
    }

    function submitJoinFarmFromPortal() {
      const code = (document.getElementById('portal-join-code')?.value || '').trim().toUpperCase();
      const name = (document.getElementById('portal-join-name')?.value || '').trim();
      const phone = (document.getElementById('portal-join-phone')?.value || '').trim();
      const email = (document.getElementById('portal-join-email')?.value || '').trim() || `${name.toLowerCase().replace(/[^a-z0-9]/g, '')}@ferme.dz`;
      const roleReq = document.getElementById('portal-join-role-requested')?.value || 'culture';
      const pin = (document.getElementById('portal-join-pin')?.value || '').trim() || '1234';

      if (!name) return alert('Veuillez renseigner votre nom et prénom.');
      if (!phone) return alert('Veuillez renseigner votre numéro de téléphone.');
      if (code && state.farm && code !== state.farm.inviteCode) {
        const foundFarm = (state.farms || []).find(f => f.inviteCode === code);
        if (foundFarm) {
          state.farm = foundFarm;
        } else {
          return alert(`Code d'invitation invalide. Le code valide de cette ferme est "${state.farm.inviteCode}".`);
        }
      }

      const newUserId = 'usr_' + Date.now();
      const newUser = {
        id: newUserId,
        name: name,
        email: email,
        phone: phone,
        role: roleReq,
        pin: pin,
        farmId: state.farm ? state.farm.id : 'farm_01',
        status: 'active',
        title: roleReq === 'delivery' ? 'Livreur Express' : 'Ouvrier Culture & Expédition'
      };

      if (!state.users) state.users = [];
      state.users.push(newUser);

      if (roleReq === 'delivery') {
        if (!state.deliverers) state.deliverers = [];
        state.deliverers.push({
          id: 'deliv_' + Date.now(),
          name: name,
          phone: phone,
          vehicle: 'Moto rapide',
          address: 'Alger',
          fee: 350,
          status: 'active'
        });
      }

      state.currentUser = newUser;
      currentRole = roleReq;
      if (roleReq === 'delivery') {
        currentTab = 'delivery';
      } else {
        currentTab = 'production';
      }

      localStorage.setItem('mycotrack_session_active', 'true');
      localStorage.setItem('mycotrack_saved_user_id', newUser.id);
      saveState();

      triggerSystemPush(
        `👥 Nouveau Membre d'Équipe`,
        `${name} a rejoint la ferme comme ${roleReq === 'delivery' ? 'Livreur' : 'Ouvrier Culture'}.`,
        () => switchTab('carnet', 'team'),

      );

      setRole(roleReq);
      showToast(`Bienvenue ${name} ! Votre compte ${roleReq.toUpperCase()} est actif (PIN: ${pin}).`);
    }

      saveState();

        const farmName = (document.getElementById('signup-farm-name')?.value || '').trim() || ('Ferme de ' + name);
        const pass = (document.getElementById('signup-pass')?.value || '').trim() || 'password123';
        const codeSuffix = Math.floor(1000 + Math.random() * 9000);
        const inviteCode = 'MYCO-' + name.slice(0, 4).toUpperCase() + '-' + codeSuffix;
        const farmId = 'farm_' + Date.now();
        const ownerId = 'usr_' + Date.now();
        
        const newFarm = {
          id: farmId,
          name: farmName,
          inviteCode: inviteCode,
          ownerId: ownerId,
          createdAt: new Date().toISOString().slice(0, 10)
        };

        if (!state.farms) state.farms = [];
        state.farms.push(newFarm);
        state.farm = newFarm;

        const newUser = {
          id: ownerId,
          name: name,
          email: email,
          phone: phone,
          role: 'admin',
          password: pass,
          pin: '1234',
          farmId: farmId,
          status: 'active',
          title: 'Propriétaire & Gérant'
        };
        if (!state.users) state.users = [];
        state.users.push(newUser);
        state.currentUser = newUser;
        currentRole = 'admin';
        currentTab = 'dashboard';
        localStorage.setItem('mycotrack_session_active', 'true');
        localStorage.setItem('mycotrack_saved_user_id', newUser.id);
        saveState();
        closeModal();
        setRole('admin');
        showToast(`Ferme "${farmName}" créée avec succès ! Votre code est ${inviteCode}.`);
      } else {
        const role = document.getElementById('signup-role')?.value || 'culture';
        const pin = (document.getElementById('signup-pin')?.value || '').trim() || '1234';
        const newUserId = 'usr_' + Date.now();
        const newUser = {
          id: newUserId,
          name: name,
          email: email,
          phone: phone,
          role: role,
          pin: pin,
          farmId: state.farm ? state.farm.id : 'farm_01',
          status: 'active',
          title: role === 'delivery' ? 'Livreur Express' : 'Ouvrier Culture & Expédition'
        };
        if (!state.users) state.users = [];
        state.users.push(newUser);

        if (role === 'delivery') {
          if (!state.deliverers) state.deliverers = [];
          state.deliverers.push({
            id: 'deliv_' + Date.now(),
            name: name,
            phone: phone,
            vehicle: 'Moto rapide',
            address: 'Alger',
            fee: 350,
            status: 'active'
          });
        }

        state.currentUser = newUser;
        currentRole = role;
        if (role === 'delivery') {
          currentTab = 'delivery';
        } else {
          currentTab = 'production';
        }

        localStorage.setItem('mycotrack_session_active', 'true');
        localStorage.setItem('mycotrack_saved_user_id', newUser.id);
        saveState();
        closeModal();
        setRole(role);
        showToast(`Bienvenue ${name} ! Votre compte ${role.toUpperCase()} est actif (PIN: ${pin}).`);
      }
    }

    function approveUserRole(userId, role) {
      const user = (state.users || []).find(u => u.id === userId);
      if (user) {
        user.role = role;
        user.status = 'active';
        user.title = role === 'culture' ? 'Responsable Culture' : (role === 'delivery' ? 'Livreur' : 'Administrateur');
        saveState();
        showToast(`Rôle ${role.toUpperCase()} attribué à ${user.name} !`);
        renderCarnetView();
      }
    }

    function rejectUserRequest(userId) {
      const user = (state.users || []).find(u => u.id === userId);
      if (user && confirm(`Rejeter l'adhésion de ${user.name} ?`)) {
        state.users = state.users.filter(u => u.id !== userId);
        saveState();
        showToast(`Demande de ${user.name} rejetée.`);
        renderCarnetView();
      }
    }

    function updateClock() {
      const d = new Date();
      const h = d.getHours().toString().padStart(2, '0');
      const m = d.getMinutes().toString().padStart(2, '0');
      const el = document.getElementById('live-clock');
      if (el) el.innerText = `${h}:${m}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Initialisation
    checkBadges();
    const sessionActive = localStorage.getItem('mycotrack_session_active') === 'true';
    if (!sessionActive || !state.currentUser) {
      state.currentUser = null;
      renderAuthLandingPage();
    } else {
      if (state.currentUser.status === 'pending') {
        renderPendingApprovalPage();
      } else {
        setRole(state.currentUser.role || 'admin');
      }
    }
  </script>
</body>
</html>
