    .bg-myco-dark { background-color: #0f1a0f; }

    .text-myco-green { color: #7bc67e; }

    .text-myco-red { color: #e07a7a; }
    .text-myco-yellow { color: #e0b87a; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #2d4a2d; border-radius: 4px; }

        top: 0 !important;
        width: 100% !important;
        background: white !important;
        color: black !important;

        margin: 0 !important;
        padding: 0 !important;
      }
      .thermal-label-sticker {
        width: 50mm !important;
        height: 30mm !important;
        page-break-after: always !important;
        break-after: page !important;
        margin: 0 !important;
        padding: 1.5mm !important;
        box-sizing: border-box !important;
        background: white !important;
        color: black !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: space-between !important;
        font-family: monospace !important;
      }

    function getWeekInfo(dateString) {
      const d = dateString ? new Date(dateString) : new Date();
      const target = new Date(d.valueOf());
      const dayNr = (d.getDay() + 6) % 7; // Monday = 0, Sunday = 6
      target.setDate(target.getDate() - dayNr + 3);
      const firstThursday = target.valueOf();
      target.setMonth(0, 1);
      if (target.getDay() !== 4) {
        target.setMonth(0, 1 + ((4 - target.getDay()) + 7) % 7);
      }
      const weekNum = 1 + Math.ceil((firstThursday - target) / 604800000);

      const monday = new Date(d);
      monday.setDate(d.getDate() - dayNr);
      const sunday = new Date(monday);
      sunday.setDate(monday.getDate() + 6);

      const months = ['Jan', 'Fév', 'Mar', 'Avr', 'Mai', 'Juin', 'Juil', 'Aoû', 'Sep', 'Oct', 'Nov', 'Déc'];
      const mStr = `${monday.getDate().toString().padStart(2, '0')} ${months[monday.getMonth()]}`;
      const sStr = `${sunday.getDate().toString().padStart(2, '0')} ${months[sunday.getMonth()]}`;

      const weekId = `${monday.getFullYear()}-W${weekNum.toString().padStart(2, '0')}`;
      const weekLabel = `Semaine ${weekNum} • ${mStr} au ${sStr} ${sunday.getFullYear()}`;
      const shortTitle = `Semaine ${weekNum}`;

      return { weekId, weekLabel, shortTitle, weekNum };
    }

          strains: (v7State.strains && v7State.strains.length > 0) ? v7State.strains : initialSeedState.strains,
          stocks: (v7State.stocks && v7State.stocks.some(s => s.strain)) ? v7State.stocks : initialSeedState.stocks,
          tables: (v7State.tables && v7State.tables.length > 0) ? v7State.tables.map(t => {
            if (!t.weekId && t.date) {
              const w = getWeekInfo(t.date);
              return { ...t, weekId: w.weekId, weekLabel: w.weekLabel };
            }
            return t;
          }) : initialSeedState.tables,

    function formatDisplayDate(isoDateStr) {
      if (!isoDateStr) return '';
      const parts = isoDateStr.split('-');
      if (parts.length === 3) {
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
      }
      return isoDateStr;
    }

    function getTodayIso() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getYesterdayIso() {
      const d = new Date();
      d.setDate(d.getDate() - 1);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function getNavDateDisplay(type) {
      const isSales = type === 'sales';
      const filterMode = isSales ? salesFilterMode : expenseFilterMode;
      const dateVal = isSales ? salesDateFilter : expenseDateFilter;
      const today = getTodayIso();
      const yesterday = getYesterdayIso();

      if (filterMode === 'today' || dateVal === today) {
        return 'Aujourd\'hui';
      }
      if (dateVal === yesterday) {
        return 'Hier';
      }
      if (dateVal) {
        const parts = dateVal.split('-');
        if (parts.length === 3) {
          return `${parts[2]}/${parts[1]}`;
        }
        return dateVal;
      }
      return 'Date';
    }

    function navigateDate(type, offset) {
      const isSales = type === 'sales';
      const curIso = isSales ? salesDateFilter : expenseDateFilter;
      const filterMode = isSales ? salesFilterMode : expenseFilterMode;

      let baseDate;
      if (curIso) {
        const [y, m, d] = curIso.split('-').map(Number);
        baseDate = new Date(y, m - 1, d);
      } else if (filterMode === 'today') {
        baseDate = new Date();
      } else {
        baseDate = new Date();
      }

      baseDate.setDate(baseDate.getDate() + offset);

      const y = baseDate.getFullYear();
      const m = String(baseDate.getMonth() + 1).padStart(2, '0');
      const d = String(baseDate.getDate()).padStart(2, '0');
      const newIso = `${y}-${m}-${d}`;

      if (isSales) {
        salesDateFilter = newIso;
        salesFilterMode = 'date';
        renderSalesView();
      } else {
        expenseDateFilter = newIso;
        expenseFilterMode = 'date';
        renderStockView();
      }
    }

    function renderDashboardView() {
      const container = document.getElementById('app-content');
      
      // Calculs financiers rigoureux
      // 1. Chiffre d'Affaires Brut (Total des ventes passées)
      const totalRevenue = state.deliveries.reduce((sum, d) => sum + (d.totalAmount || 0), 0);
      
      // 2. Frais livreurs déduits
      const totalDelivererFees = state.deliveries.reduce((sum, d) => sum + (d.deliveryFee || 0), 0);
      
      // 3. Montant réel encaissé en caisse ferme (Net versé en caisse)
      const totalNetCashInFarm = state.deliveries.reduce((sum, d) => sum + (d.netCashToFarm || 0), 0);
      
      // 4. Impayés / Restes à payer des clients
      const totalRemainingDue = state.clients.reduce((sum, c) => sum + (c.due || 0), 0);
      
      // 5. Total des dépenses d'exploitation
      const totalExpenses = state.expenses.reduce((sum, e) => sum + (e.amount || 0), 0);
      
      // 6. Bénéfice Net Réel = Chiffre d'affaires - Frais livreurs - Dépenses
      const netProfit = totalRevenue - totalDelivererFees - totalExpenses;
      const profitRate = totalRevenue > 0 ? ((netProfit / totalRevenue) * 100).toFixed(1) : 0;

      // Alertes
      const lowStocks = state.stocks.filter(s => s.quantity <= s.threshold);
      const pendingDeliveries = state.deliveries.filter(d => d.status !== 'settled');

      container.innerHTML = `

          <button onclick="openNewSaleModal()" class="text-[11px] bg-[#4a9e4e] text-white px-2.5 py-1 rounded-lg font-bold shadow hover:bg-emerald-600 transition-all flex items-center gap-1">

                    <button onclick="openSettlementModal('${d.id}')" class="flex-1 py-1.5 bg-[#4a9e4e] text-white rounded-xl text-xs font-bold shadow hover:bg-emerald-600 flex items-center justify-center gap-1">
                      <span>💰</span> <span>Valider Paiement & Caisse</span>

                      <span>🔍</span> <span>Voir Reçu Caisse</span>
                    </button>
                  `}
                </div>
              </div>
            `;
          }).join('')}

          <!-- Option ergonomique : Bouton déroulant pour voir l'historique complet -->
          ${isTruncated5 ? `
            <div class="pt-2">
              <button onclick="setSalesFilterMode('all')" class="w-full py-3 bg-[#1a2a1a] hover:bg-[#223822] text-[#7bc67e] border border-[#2d4a2d] rounded-2xl text-xs font-bold transition-all shadow flex items-center justify-center gap-2">
                <span>📜</span>
                <span>Afficher les ${state.deliveries.length - 5} ventes plus anciennes</span>
                <span>↓</span>
              </button>
            </div>
          ` : ''}

          ${(salesFilterMode === 'all' && state.deliveries.length > 5) ? `
            <div class="pt-2">
              <button onclick="setSalesFilterMode('recent5')" class="w-full py-2 bg-[#1a2a1a] hover:bg-[#223822] text-[#aaa] border border-[#2d4a2d] rounded-2xl text-xs font-semibold transition-all flex items-center justify-center gap-1">
                <span>▲</span>
                <span>Réduire aux 5 dernières ventes</span>
              </button>
            </div>
          ` : ''}
        </div>
      `;
    }

    // Modale de Création de Vente avec calculs automatiques
    function openNewSaleModal(preselectedClientId = null) {
      showModal(`
        <h3 class="text-sm font-bold text-white mb-2 flex items-center gap-1.5">
          <span>🛒</span> <span>Créer une Vente & Assigner un Livreur</span>
        </h3>
        <p class="text-[11px] text-[#888] mb-3">Sélectionnez le client et le livreur. Les montants et frais se calculent automatiquement.</p>
        
        <div class="space-y-2.5 text-xs">
          <!-- 1. Client -->
          <div>
            <label class="text-[#888] block mb-1">Client acheteur *</label>
            <select id="vte-client-id" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white" onchange="recalculateSaleForm()">
              ${state.clients.map(c => `
                <option value="${c.id}" ${c.id === preselectedClientId ? 'selected' : ''}>

          </div>

          <!-- 3. Livreur assigné & Prix de la course (Modifiable) -->
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[#888] block mb-1">Livreur assigné *</label>
              <select id="vte-deliverer-id" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white" onchange="onSaleDelivererChanged()">
                ${(state.deliverers || []).map(deliv => `
                  <option value="${deliv.id}">
                    ${deliv.name} (${deliv.vehicle || 'Livreur'})
                  </option>
                `).join('')}

            <div>
              <label class="text-[#888] block mb-1">Course livreur (DA) *</label>
              <input id="vte-course-fee" type="number" step="50" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white font-bold" oninput="recalculateSaleForm()">
            </div>

          <!-- 4. Récapitulatif calculé en direct -->
          <div id="vte-calc-summary" class="bg-[#0f1a0f] p-3 rounded-xl border border-[#7bc67e]/40 space-y-1.5 text-xs">

              Valider & Notifier Livreur
            </button>
          </div>

      `);

    function onSaleDelivererChanged() {
      const delivId = document.getElementById('vte-deliverer-id').value;
      const deliverer = (state.deliverers || []).find(d => d.id === delivId);
      if (deliverer) {
        document.getElementById('vte-course-fee').value = deliverer.fee;
      }
      recalculateSaleForm();
    }

    function recalculateSaleForm() {
      const cliId = document.getElementById('vte-client-id').value;
      const client = state.clients.find(c => c.id === cliId);
      const qty = parseFloat(document.getElementById('vte-qty').value) || 0;
      const delivId = document.getElementById('vte-deliverer-id').value;
      const deliverer = (state.deliverers || []).find(d => d.id === delivId);
      const fee = parseFloat(document.getElementById('vte-course-fee').value) || (deliverer ? deliverer.fee : 0);

      if (!client || !deliverer) return;

      const totalFacture = Math.round(qty * client.price);
      const netEstime = totalFacture - fee;

      document.getElementById('vte-calc-summary').innerHTML = `
        <div class="flex justify-between text-[#aaa]">
          <span>Prix négocié client :</span>
          <span class="text-white font-semibold">${client.price} DA / kg</span>
        </div>
        <div class="flex justify-between text-[#aaa]">
          <span>Total facturé client :</span>
          <strong class="text-white text-sm">${totalFacture.toLocaleString()} DA</strong>
        </div>
        <div class="flex justify-between text-[#aaa] border-t border-[#2d4a2d] pt-1">
          <span>Frais course livreur :</span>
          <span class="text-[#e0b87a] font-semibold">${fee} DA <span class="text-[10px] text-[#888]">(modifiable)</span></span>
        </div>
        <div class="flex justify-between text-xs pt-1 border-t border-[#7bc67e]/30">
          <span class="text-[#7bc67e]">Net caisse estimé (si payé 100%) :</span>
          <strong class="text-[#7bc67e] text-sm">+${netEstime.toLocaleString()} DA</strong>
        </div>
      `;
    }

    function saveNewSale() {
      const cliId = document.getElementById('vte-client-id').value;
      const client = state.clients.find(c => c.id === cliId);
      const qty = parseFloat(document.getElementById('vte-qty').value) || 0;
      const delivId = document.getElementById('vte-deliverer-id').value;
      const deliverer = (state.deliverers || []).find(d => d.id === delivId);
      const fee = parseFloat(document.getElementById('vte-course-fee').value) || (deliverer ? deliverer.fee : 350);

      if (!client || qty <= 0 || !deliverer) return alert('Veuillez saisir une quantité valide.');

      const totalAmount = Math.round(qty * client.price);
      const orderNum = 'VTE-2026-' + String(state.deliveries.length + 1).padStart(3, '0');

      const newOrder = {
        id: 'vte_' + Date.now(),
        orderNumber: orderNum,
        clientId: client.id,
        clientName: client.name,
        clientPhone: client.phone,
        clientAddress: client.address,
        quantityKg: qty,
        pricePerKg: client.price,
        totalAmount: totalAmount,
        delivererId: deliverer.id,
        delivererName: deliverer.name,
        deliveryFee: fee, // Tarif course modifiable pour cette vente
        status: 'pending_acceptance', // Actif pour le livreur !
        isClientPaid: false,
        amountCollected: 0,
        clientRemainingDue: totalAmount,
        delivererFeeDeducted: 0,
        netCashToFarm: 0,
        dateIso: new Date().toISOString().slice(0, 10),
        createdAt: new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
      };

      state.deliveries.unshift(newOrder);
      saveState();
      closeModal();
      showToast(`Vente ${orderNum} créée ! Livreur ${deliverer.name} notifié (Course : ${fee} DA).`);

      triggerSystemPush(
        `🛵 Nouvelle Course : ${client.name}`,
        `Commande ${orderNum} • ${qty} kg • Facture : ${totalAmount.toLocaleString()} DA • Frais course : +${fee} DA. Confirmez la prise en charge.`,
        () => setRole('delivery'),
        'delivery',
        [
          { label: '✅ Accepter (+' + fee + ' DA)', onclick: `acceptDelivery('${newOrder.id}'); dismissFloatingPush();`, primary: true },
          { label: '❌ Refuser', onclick: `rejectDelivery('${newOrder.id}'); dismissFloatingPush();`, danger: true }
        ]
      );
    }

    function saveWorkerDispatch() {

      const qty = parseFloat(document.getElementById('worker-dispatch-qty')?.value) || 0;
      const delivererId = document.getElementById('worker-dispatch-deliverer')?.value;

      if (!clientId) return alert('Veuillez sélectionner un client.');
      if (qty <= 0) return alert('Veuillez renseigner un poids valide en kg.');
      if (!delivererId) return alert('Veuillez sélectionner un livreur.');

      const client = (state.clients || []).find(c => c.id === clientId) || { name: 'Client Express', phone: '0550000000', address: 'Alger' };

        pricePerKg: clientPrice,
        totalAmount: totalAmount,

        cashCollected: 0,
        netCashToFarm: 0,
        clientRemainingDue: totalAmount,

    // ==========================================
    // 3. VALIDATION ENCAISSEMENT & DÉCOMPTE CAISSE
    // ==========================================
    function openSettlementModal(orderId) {
      const d = state.deliveries.find(x => x.id === orderId);
      if (!d) return;

      showModal(`
        <h3 class="text-sm font-bold text-white mb-1 flex items-center gap-1.5">
          <span>💰</span> <span>Validation Encaissement & Décompte Caisse</span>
        </h3>
        <p class="text-xs text-[#7bc67e] mb-2 font-mono">${d.orderNumber} • ${d.clientName}</p>

        <div class="bg-[#0f1a0f] p-3 rounded-2xl border border-[#2d4a2d] space-y-1.5 text-xs mb-3">
          <div class="flex justify-between text-[#aaa]">
            <span>Marchandise livrée :</span>
            <span class="text-white font-bold">${d.quantityKg} kg à ${d.pricePerKg} DA/kg</span>
          </div>
          <div class="flex justify-between text-[#aaa]">
            <span>Total dû par le client :</span>
            <strong class="text-white text-base">${d.totalAmount.toLocaleString()} DA</strong>
          </div>
          <div class="flex justify-between text-[#aaa]">
            <span>Frais du livreur (${d.delivererName}) :</span>
            <strong class="text-[#e0b87a]">${d.deliveryFee} DA</strong>
          </div>
        </div>

        <div class="space-y-3 text-xs">
          <!-- Question : Le client a-t-il payé ? -->
          <div>
            <label class="text-white font-bold block mb-1.5">Le client a-t-il réglé la commande ?</label>
            <div class="grid grid-cols-2 gap-2">
              <button onclick="setClientPaymentChoice(true, ${d.totalAmount}, ${d.deliveryFee})" id="btn-pay-yes" class="py-2.5 rounded-xl border border-[#4a9e4e] bg-[#1f3a1f] text-[#7bc67e] font-bold text-xs flex items-center justify-center gap-1">
                <span>✅</span> <span>OUI (Payé 100%)</span>
              </button>
              <button onclick="setClientPaymentChoice(false, ${d.totalAmount}, ${d.deliveryFee})" id="btn-pay-no" class="py-2.5 rounded-xl border border-[#e07a7a]/50 bg-[#2a1a1a] text-[#e07a7a] font-bold text-xs flex items-center justify-center gap-1">
                <span>⚠️</span> <span>NON / Partiel</span>
              </button>
            </div>
          </div>

          <!-- Montant effectivement perçu -->
          <div id="collected-box" class="space-y-1">
            <label class="text-[#888] block">Montant effectivement perçu du client (DA) :</label>
            <input id="collected-input" type="number" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-3 text-white text-lg font-bold" value="${d.totalAmount}" oninput="updateSettlementBreakdown(${d.totalAmount}, ${d.deliveryFee})">
          </div>

          <!-- Décompte automatique en direct -->
          <div id="settlement-breakdown" class="bg-[#142214] p-3 rounded-2xl border border-[#4a9e4e]/40 space-y-2 text-xs">
            <!-- Rempli dynamiquement -->
          </div>

          <div class="pt-2 flex gap-2">
            <button onclick="closeModal()" class="flex-1 py-2.5 bg-[#2d4a2d] rounded-xl text-white font-bold">Annuler</button>
            <button onclick="applySettlement('${d.id}')" class="flex-1 py-2.5 bg-[#4a9e4e] rounded-xl text-white font-bold shadow hover:bg-emerald-600">
              Valider & Clôturer Caisse
            </button>
          </div>

      updateSettlementBreakdown(d.totalAmount, d.deliveryFee);

    function setClientPaymentChoice(isFull, totalAmount, fee) {
      const input = document.getElementById('collected-input');
      const yesBtn = document.getElementById('btn-pay-yes');
      const noBtn = document.getElementById('btn-pay-no');

      if (isFull) {
        input.value = totalAmount;
        yesBtn.className = "py-2.5 rounded-xl border-2 border-[#4a9e4e] bg-[#1f3a1f] text-[#7bc67e] font-bold text-xs shadow";
        noBtn.className = "py-2.5 rounded-xl border border-[#2d4a2d] bg-[#1a2a1a] text-slate-400 font-semibold text-xs";
      } else {
        input.value = 0;
        noBtn.className = "py-2.5 rounded-xl border-2 border-[#e07a7a] bg-[#3a1a1a] text-[#e07a7a] font-bold text-xs shadow";
        yesBtn.className = "py-2.5 rounded-xl border border-[#2d4a2d] bg-[#1a2a1a] text-slate-400 font-semibold text-xs";
      }
      updateSettlementBreakdown(totalAmount, fee);
    }

    function updateSettlementBreakdown(totalAmount, delivererFee) {
      const val = parseFloat(document.getElementById('collected-input').value) || 0;
      const remainingDue = Math.max(0, totalAmount - val);
      const isFeeCovered = val >= delivererFee;
      const netToFarm = isFeeCovered ? (val - delivererFee) : 0;
      const delivererDueFromFarm = isFeeCovered ? 0 : (delivererFee - val);

      document.getElementById('settlement-breakdown').innerHTML = `
        <div class="flex justify-between text-xs">
          <span class="text-[#aaa]">Reste à payer client (Impayé) :</span>
          <strong class="${remainingDue > 0 ? 'text-[#e07a7a] text-sm font-bold' : 'text-[#7bc67e]'}">
            ${remainingDue > 0 ? `${remainingDue.toLocaleString()} DA` : '0 DA (✓ Réglé)'}
          </strong>
        </div>

        <div class="flex justify-between text-xs border-t border-[#2d4a2d] pt-1.5">
          <span class="text-[#aaa]">Frais livreur déduits sur cash :</span>
          <strong class="text-[#e0b87a]">-${delivererFee} DA</strong>
        </div>

        <div class="flex justify-between text-xs border-t border-[#7bc67e]/40 pt-1.5">
          <span class="text-[#7bc67e] font-bold">Net remis en Caisse Ferme :</span>
          <strong class="text-[#7bc67e] text-base font-bold">+${netToFarm.toLocaleString()} DA</strong>
        </div>

        ${delivererDueFromFarm > 0 ? `
          <p class="text-[10px] text-[#e07a7a] bg-[#2a1a1a] p-1.5 rounded-lg border border-[#5a2a2a] mt-1">
            ⚠️ Attention : Le client n'a pas versé assez pour payer la course. La ferme doit encore régler <strong>${delivererDueFromFarm} DA</strong> au livreur.
          </p>
        ` : ''}
      `;
    }

    function applySettlement(orderId) {
      const d = state.deliveries.find(x => x.id === orderId);
      if (!d) return;

      const collected = parseFloat(document.getElementById('collected-input').value) || 0;
      const remainingDue = Math.max(0, d.totalAmount - collected);
      const isFeeCovered = collected >= d.deliveryFee;
      const netToFarm = isFeeCovered ? (collected - d.deliveryFee) : 0;

      // Mise à jour de la commande
      d.status = 'settled';
      d.amountCollected = collected;
      d.clientRemainingDue = remainingDue;
      d.isClientPaid = remainingDue === 0;
      d.delivererFeeDeducted = d.deliveryFee;
      d.netCashToFarm = netToFarm;

      // Mise à jour du compte client (si impayé)
      const client = state.clients.find(c => c.id === d.clientId);
      if (client) {
        if (remainingDue > 0) {

      saveState();
      closeModal();
      showToast(`Commande ${d.orderNumber} clôturée ! Net en caisse : +${netToFarm.toLocaleString()} DA`);

      const d = state.deliveries.find(x => x.id === id);

          null,
          'delivery'
        );
      }
    }

    function rejectDelivery(id) {
      const d = state.deliveries.find(x => x.id === id);
      if (d) {
        if (confirm(`Refuser la prise en charge de la course ${d.orderNumber} pour ${d.clientName} ? Elle retournera aux commandes à réassigner.`)) {
          d.status = 'refused';
          saveState();
          triggerSystemPush(
            `⚠️ Course Refusée par le Livreur`,
            `La commande ${d.orderNumber} (${d.clientName}) a été refusée par ${d.delivererName} et doit être réassignée.`,
            () => switchTab('sales'),
            'warning'
          );
          showToast(`Course ${d.orderNumber} refusée.`);
          renderCurrentView();
        }
      }
    }

    function deleteDeliverer(id) {
      const d = (state.deliverers || []).find(x => x.id === id);
      if (!d) return;

      // Vérifier les livraisons en cours
      const pendingDeliveries = state.deliveries.filter(x => x.delivererId === id && (x.status === 'in_delivery' || x.status === 'pending_acceptance'));
      if (pendingDeliveries.length > 0) {
        return alert(`Impossible de supprimer ${d.name} car il a ${pendingDeliveries.length} livraison(s) en cours. Terminez ou réassignez d'abord ces livraisons.`);
      }

      if (confirm(`Confirmer la suppression du livreur "${d.name}" du Carnet Pro ?`)) {
        state.deliverers = state.deliverers.filter(x => x.id !== id);
        saveState();
        showToast(`Livreur ${d.name} supprimé.`);
      }
    }

    function saveNewTeamMember() {
      const name = (document.getElementById('team-new-name')?.value || '').trim();
      const phone = (document.getElementById('team-new-phone')?.value || '').trim();
      const role = document.getElementById('team-new-role')?.value || 'culture';
      const pin = (document.getElementById('team-new-pin')?.value || '').trim();

      if (!name) return alert('Veuillez saisir le nom et prénom de l\'employé.');
      if (!phone || phone.length < 9) return alert('Veuillez saisir un numéro de téléphone valide (ex: 0661112233).');
      if (!pin || pin.length < 4) return alert('Veuillez renseigner un code PIN à 4 chiffres.');

      const newUserId = 'usr_' + Date.now();
      const newUser = {
        id: newUserId,
        name: name,
        email: `${name.toLowerCase().replace(/[^a-z0-9]/g, '')}@ferme.dz`,
        phone: phone,
        role: role,
        pin: pin,
        password: role === 'admin' ? 'password123' : undefined,
        farmId: state.farm ? state.farm.id : 'farm_01',
        status: 'active',
        title: role === 'culture' ? 'Ouvrier Culture & Expédition' : (role === 'delivery' ? 'Livreur Express' : 'Co-Gérant')
      };

      if (!state.users) state.users = [];
      state.users.push(newUser);

      // Si livreur, l'ajouter aussi au carnet des livreurs pour les courses
      if (role === 'delivery') {
        if (!state.deliverers) state.deliverers = [];
        state.deliverers.push({
          id: 'deliv_' + Date.now(),
          name: name,
          phone: phone,
          vehicle: 'Moto rapide',
          address: 'Alger',
          fee: 350,
          status: 'active'
        });
      }

      saveState();
      closeModal();
      showToast(`Employé ${name} ajouté ! Connexion avec Tél: ${phone} & PIN: ${pin}`);
      renderCarnetView();
    }

      if (mode !== 'date') {
        expenseDateFilter = '';
      }
      renderStockView();
    }

    function onExpenseDateChange(val) {
      expenseDateFilter = val;

    function onModalStrainSelectChange(val) {
      const box = document.getElementById('spawn-custom-strain-box');
      if (box) {
        if (val === '__NEW_STRAIN__') {
          box.classList.remove('hidden');
          const input = document.getElementById('spawn-custom-strain-name');
          if (input) input.focus();
        } else {
          box.classList.add('hidden');
        }
      }
    }

    function updateSpawnTotalCalc() {
      const qtyEl = document.getElementById('spawn-qty-sacs');
      const wtEl = document.getElementById('spawn-bag-weight');
      const priceEl = document.getElementById('spawn-price-per-sac');
      const kgEl = document.getElementById('spawn-calc-total-kg');
      const priceOutEl = document.getElementById('spawn-calc-total-price');

      if (!qtyEl || !wtEl || !priceEl || !kgEl || !priceOutEl) return;

      const qty = parseFloat(qtyEl.value) || 0;
      const wt = parseFloat(wtEl.value) || 0;
      const price = parseFloat(priceEl.value) || 0;

      const totalKg = (qty * wt).toFixed(1);
      const totalPrice = Math.round(qty * price);

      kgEl.innerText = `${totalKg} kg de blanc`;

    function saveAddSpawnStrain() {
      const selectVal = document.getElementById('spawn-strain-select').value;
      let strainName = selectVal;
      if (selectVal === '__NEW_STRAIN__') {
        const customInput = document.getElementById('spawn-custom-strain-name');
        strainName = (customInput ? customInput.value : '').trim();
        if (!strainName) {
          alert('Veuillez saisir le nom de la nouvelle souche.');
          return;
        }
        if (!state.strains) state.strains = [];
        if (!state.strains.includes(strainName)) {
          state.strains.push(strainName);
        }
      }

      const qty = parseFloat(document.getElementById('spawn-qty-sacs').value) || 0;
      const bagWeight = parseFloat(document.getElementById('spawn-bag-weight').value) || 2.0;
      const pricePerSac = parseFloat(document.getElementById('spawn-price-per-sac').value) || 0;
      const threshold = parseFloat(document.getElementById('spawn-threshold-sacs').value) || 2;
      const recordExpense = document.getElementById('spawn-record-expense') ? document.getElementById('spawn-record-expense').checked : true;

      if (qty <= 0) {
        alert('Veuillez saisir un nombre de sacs valide (> 0).');
        return;
      }

      // Chercher si un stock existe déjà pour cette souche
      let stockItem = (state.stocks || []).find(s => 
        (s.strain && s.strain.toLowerCase() === strainName.toLowerCase()) ||
        (s.category === 'Semence/Blanc' && s.name.toLowerCase().includes(strainName.toLowerCase()))
      );

      if (stockItem) {
        stockItem.quantity = Math.round((stockItem.quantity + qty) * 10) / 10;
        stockItem.bagWeightKg = bagWeight;
        stockItem.cost = pricePerSac > 0 ? pricePerSac : stockItem.cost;
        if (threshold > 0) stockItem.threshold = threshold;
        if (!stockItem.strain) stockItem.strain = strainName;
      } else {
        const newId = 'stk_spawn_' + Date.now();
        stockItem = {
          id: newId,
          name: `Mycélium ${strainName}`,
          strain: strainName,
          bagWeightKg: bagWeight,
          category: 'Semence/Blanc',
          quantity: qty,
          unit: 'sacs',
          threshold: threshold,
          cost: pricePerSac
        };
        state.stocks.push(stockItem);
      }

      // Enregistrement optionnel de la dépense
      if (recordExpense && pricePerSac > 0) {
        const totalAmount = Math.round(qty * pricePerSac);
        const today = new Date();
        const dateStr = today.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' });
        const dateIso = today.toISOString().slice(0, 10);

        if (!state.expenses) state.expenses = [];
        state.expenses.unshift({
          id: 'exp_' + Date.now(),
          label: `Achat Mycélium ${strainName}`,
          amount: totalAmount,
          category: 'Matière première (Paille/Blanc)',
          qty: qty,
          unit: 'sacs',
          unitPrice: pricePerSac,
          supplier: 'Producteur semence',
          isStockable: true,
          stockItemId: stockItem.id,
          date: dateStr,
          dateIso: dateIso
        });
      }

      saveState();
      closeModal();
      showToast(`+${qty} sacs de ${strainName} (${(qty * bagWeight).toFixed(1)} kg) ajoutés au stock !`);
    }

    let productionSubTab = 'weeks'; // 'weeks' | 'archives'
    let productionViewMode = 'tables'; // 'tables' | 'table_detail'
    let selectedTableId = null;
    let productionContainerFilter = 'all'; // 'all' | 'fruiting' | 'incubation' | 'contaminated' | 'sacs' | 'seaux'
    let bulkSelectedBagIds = new Set();

    let expandedWeekIds = new Set();

    function renderBagsView() {
      renderProductionView();

      productionSubTab = tab;
      productionViewMode = 'tables';
      selectedTableId = null;
      renderProductionView();
    }

    function toggleWeekAccordion(weekId) {
      if (expandedWeekIds.has(weekId)) {
        expandedWeekIds.delete(weekId);
      } else {
        expandedWeekIds.add(weekId);
      }
      renderProductionView();
    }

    function groupTablesByWeek(tables) {
      const weekMap = new Map();
      tables.forEach(t => {
        const wInfo = getWeekInfo(t.date);
        const wId = t.weekId || wInfo.weekId;
        const wLabel = t.weekLabel || wInfo.weekLabel;

        if (!weekMap.has(wId)) {
          weekMap.set(wId, {
            weekId: wId,
            weekLabel: wLabel,
            shortTitle: wInfo.shortTitle,
            weekNum: wInfo.weekNum,
            date: t.date,
            tables: []
          });
        }
        weekMap.get(wId).tables.push(t);
      });

      return Array.from(weekMap.values()).sort((a, b) => b.weekId.localeCompare(a.weekId));
    }

    function renderProductionView() {
      const container = document.getElementById('app-content');
      const allTables = state.tables || [];
      const bags = state.bags || [];

      const activeTables = allTables.filter(t => !t.archived && t.status !== 'Archivé');
      const archivedTables = allTables.filter(t => t.archived === true || t.status === 'Archivé');

      const activeBags = bags.filter(b => {
        const t = allTables.find(tbl => tbl.id === b.tableId || tbl.id === b.batchId);
        return t ? (!t.archived && t.status !== 'Archivé') : true;
      });

      const totalContainers = activeBags.length;
      const fruitingBags = activeBags.filter(b => b.status === 'fruiting');
      const incubationBags = activeBags.filter(b => b.status === 'incubation');
      const contaminatedBags = activeBags.filter(b => b.status === 'contaminated');
      const totalHarvestedKg = activeBags.reduce((acc, b) => acc + (b.harvestedKg || 0), 0);

      const activeWeeks = groupTablesByWeek(activeTables);
      if (expandedWeekIds.size === 0 && activeWeeks.length > 0) {
        expandedWeekIds.add(activeWeeks[0].weekId);
      }

      let html = `
        <div class="space-y-3 pb-6">
          <!-- Entête & Actions Rapides Globales -->
          <div class="flex justify-between items-center">
            <div>
              <h2 class="text-xs font-bold text-[#7bc67e] tracking-wider uppercase flex items-center gap-1.5">
                <span>🍄</span> <span>Production Mycologique</span>
              </h2>
              <p class="text-[10px] text-[#888]">${activeTables.length} table(s) active(s) • ${totalContainers} contenants (${fruitingBags.length} en fructification)</p>
            </div>
            <div class="flex items-center gap-1.5">
              <button onclick="openBulkHarvestModal()" class="text-xs bg-[#e0b87a] text-black px-2.5 py-1.5 rounded-xl font-bold shadow hover:bg-amber-400 transition-all flex items-center gap-1">
                <span>⚖️</span> <span>Récolte Multi-Sacs</span>
              </button>
              <button onclick="openNewTableModal()" class="text-xs bg-[#4a9e4e] text-white px-2.5 py-1.5 rounded-xl font-bold shadow hover:bg-emerald-600 transition-all flex items-center gap-1">
                <span>+</span> <span>Nouvelle Table</span>
              </button>
            </div>
          </div>

          <!-- Métriques Clés Production -->
          <div class="grid grid-cols-4 gap-1.5">
            <div class="bg-[#1a2a1a] p-2 rounded-xl border border-[#2d4a2d] text-center">
              <span class="text-[10px] text-[#888] block">Tables</span>
              <span class="text-xs font-bold text-white">${activeTables.length}</span>
            </div>
            <div class="bg-[#1a2a1a] p-2 rounded-xl border border-[#2d4a2d] text-center">
              <span class="text-[10px] text-[#7bc67e] block">Fructif.</span>
              <span class="text-xs font-bold text-[#7bc67e]">${fruitingBags.length}</span>
            </div>
            <div class="bg-[#1a2a1a] p-2 rounded-xl border border-[#2d4a2d] text-center">
              <span class="text-[10px] text-[#e0b87a] block">Incubat.</span>
              <span class="text-xs font-bold text-[#e0b87a]">${incubationBags.length}</span>
            </div>
            <div class="bg-[#1a2a1a] p-2 rounded-xl border border-[#2d4a2d] text-center">
              <span class="text-[10px] text-emerald-400 block">Récolté</span>
              <span class="text-xs font-bold text-emerald-400">${totalHarvestedKg.toFixed(1)}k</span>
            </div>
          </div>

          <!-- Sous-Navigation : Semaines vs Archives (Option 'Tous les sacs & seaux' supprimée) -->
          <div class="flex bg-[#0f1a0f] p-1 rounded-xl border border-[#2d4a2d] text-xs">
            <button onclick="setProductionSubTab('weeks')" class="flex-1 py-1.5 rounded-lg font-bold transition-all text-center ${productionSubTab === 'weeks' && productionViewMode !== 'table_detail' ? 'bg-[#2d4a2d] text-white shadow' : 'text-[#888] hover:text-white'}">
              📅 Semaines de Production (${activeWeeks.length})
            </button>
            <button onclick="setProductionSubTab('archives')" class="flex-1 py-1.5 rounded-lg font-bold transition-all text-center ${productionSubTab === 'archives' ? 'bg-[#2d4a2d] text-white shadow' : 'text-[#888] hover:text-white'}">
              📦 Archives (${archivedTables.length})
            </button>
          </div>
      `;

      if (productionViewMode === 'table_detail') {
        // VUE DÉTAIL D'UNE TABLE SÉLECTIONNÉE
        const table = allTables.find(t => t.id === selectedTableId) || allTables[0];
        if (!table) {
          productionViewMode = 'tables';
          return renderProductionView();
        }
        const tableBags = bags.filter(b => b.tableId === table.id || b.batchId === table.id);
        const sacsCount = tableBags.filter(b => b.type !== 'seau').length;
        const seauxCount = tableBags.filter(b => b.type === 'seau').length;
        const tableFruit = tableBags.filter(b => b.status === 'fruiting').length;
        const tableIncub = tableBags.filter(b => b.status === 'incubation').length;
        const tableContam = tableBags.filter(b => b.status === 'contaminated').length;
        const tableKg = tableBags.reduce((sum, b) => sum + (b.harvestedKg || 0), 0);

        let displayedBags = [...tableBags];
        if (productionContainerFilter === 'fruiting') displayedBags = displayedBags.filter(b => b.status === 'fruiting');
        else if (productionContainerFilter === 'incubation') displayedBags = displayedBags.filter(b => b.status === 'incubation');
        else if (productionContainerFilter === 'contaminated') displayedBags = displayedBags.filter(b => b.status === 'contaminated');
        else if (productionContainerFilter === 'sacs') displayedBags = displayedBags.filter(b => b.type !== 'seau');
        else if (productionContainerFilter === 'seaux') displayedBags = displayedBags.filter(b => b.type === 'seau');

        html += `
          <div class="space-y-3">
            <button onclick="setProductionViewMode('tables')" class="text-xs text-[#7bc67e] font-bold flex items-center gap-1 hover:underline">
              <span>←</span> <span>Retour aux semaines de production</span>
            </button>

            <div class="bg-[#1a2a1a] p-3.5 rounded-2xl border border-[#2d4a2d] space-y-2">
              <div class="flex justify-between items-start">
                <div>
                  <span class="text-[10px] font-bold text-[#7bc67e] bg-[#0f1a0f] border border-[#2d4a2d] px-2 py-0.5 rounded-md font-mono">${table.id}</span>
                  <h3 class="font-bold text-white text-sm mt-1">${table.name || ('Table ' + table.id)}</h3>
                  <p class="text-[11px] text-[#aaa]">Souche : <strong class="text-white">${table.strain || 'Pleurote'}</strong> • Date : ${table.date}</p>
                </div>
                <div class="text-right">
                  <span class="text-sm font-bold text-emerald-400 block">${tableKg.toFixed(2)} kg</span>
                  <span class="text-[9px] text-[#888]">Total récolté</span>
                </div>
              </div>
              <div class="text-xs text-[#bbb] bg-[#0f1a0f] p-2 rounded-xl border border-[#2d4a2d] flex justify-between">
                <span>🌾 <strong>${table.strawBottes || 1} botte(s)</strong></span>
                <span>🍄 <strong>${table.spawnSacs || 1.5} sac(s)</strong></span>
                <span>📦 <strong>${tableBags.length}</strong> contenants</span>
              </div>
              ${table.notes ? `<p class="text-[10px] text-[#888] italic">${table.notes}</p>` : ''}
              <div class="flex gap-2 pt-1">
                <button onclick="openPrintLabelsModal('${table.id}')" class="flex-1 py-1.5 bg-[#0f1a0f] text-[#7bc67e] border border-[#2d4a2d] rounded-xl text-xs font-bold hover:border-[#7bc67e] transition-all flex items-center justify-center gap-1">
                  <span>🖨️</span> <span>Imprimer étiquettes (${tableBags.length})</span>
                </button>
                <button onclick="openBulkHarvestModal('${table.id}')" class="flex-1 py-1.5 bg-[#4a9e4e] text-white rounded-xl text-xs font-bold shadow hover:bg-emerald-600 transition-all flex items-center justify-center gap-1">
                  <span>⚖️</span> <span>Récolter sur cette table</span>
                </button>
              </div>
            </div>

            <!-- Filtres rapides contenants -->
            <div class="flex gap-1.5 overflow-x-auto pb-1 text-xs">
              <button onclick="setProductionContainerFilter('all')" class="px-2.5 py-1 rounded-lg font-bold text-[11px] whitespace-nowrap ${productionContainerFilter === 'all' ? 'bg-[#2d4a2d] text-white' : 'bg-[#1a2a1a] text-[#888]'}">
                Tous (${tableBags.length})
              </button>
              <button onclick="setProductionContainerFilter('fruiting')" class="px-2.5 py-1 rounded-lg font-bold text-[11px] whitespace-nowrap ${productionContainerFilter === 'fruiting' ? 'bg-[#1f3a1f] text-[#7bc67e] border border-[#7bc67e]/30' : 'bg-[#1a2a1a] text-[#888]'}">
                💧 Fructification (${tableFruit})
              </button>
              <button onclick="setProductionContainerFilter('incubation')" class="px-2.5 py-1 rounded-lg font-bold text-[11px] whitespace-nowrap ${productionContainerFilter === 'incubation' ? 'bg-[#3a2e1a] text-[#e0b87a] border border-[#e0b87a]/30' : 'bg-[#1a2a1a] text-[#888]'}">
                🌡️ Incubation (${tableIncub})
              </button>
              <button onclick="setProductionContainerFilter('contaminated')" class="px-2.5 py-1 rounded-lg font-bold text-[11px] whitespace-nowrap ${productionContainerFilter === 'contaminated' ? 'bg-[#3a1a1a] text-[#e07a7a] border border-[#e07a7a]/30' : 'bg-[#1a2a1a] text-[#888]'}">
                ☣️ Avaries (${tableContam})
              </button>
              <button onclick="setProductionContainerFilter('seaux')" class="px-2.5 py-1 rounded-lg font-bold text-[11px] whitespace-nowrap ${productionContainerFilter === 'seaux' ? 'bg-[#2d4a2d] text-white' : 'bg-[#1a2a1a] text-[#888]'}">
                🪣 Seaux (${seauxCount})
              </button>
            </div>

            <!-- Liste des Contenants de la Table -->
            <div class="space-y-2">
              ${displayedBags.map(b => renderContainerCard(b, table)).join('')}
            </div>
          </div>
        `;
      } else if (productionSubTab === 'archives') {
        // VUE ARCHIVES
        html += renderArchivesViewHtml(archivedTables);
      } else {
        // VUE SEMAINES DE PRODUCTION
        html += renderWeeksProductionViewHtml(activeWeeks);
      }

      html += `</div>`;
      container.innerHTML = html;
    }

    function renderContainerCard(b, parentTable = null) {
      const isFruit = b.status === 'fruiting';
      const isContam = b.status === 'contaminated';
      const isIncub = b.status === 'incubation';
      const isSeau = b.type === 'seau';
      const tableName = parentTable ? (parentTable.name || parentTable.id) : (b.tableId || 'Table');
      const harvests = b.harvests || [];
      const nextFlush = harvests.length + 1;
      const strainName = b.strain || (parentTable ? parentTable.strain : 'Pleurote');

      let incubDays = '';
      if (b.incubationDate) {
        const d1 = new Date(b.incubationDate);
        const d2 = new Date();
        const diff = Math.max(0, Math.floor((d2 - d1) / (1000 * 60 * 60 * 24)));
        incubDays = `J+${diff}`;
      }

      return `
        <div class="bg-[#1a2a1a] p-3 rounded-2xl border ${isContam ? 'border-[#5a2a2a] bg-[#2a1a1a]/40' : 'border-[#2d4a2d]'} space-y-2">
          <div class="flex justify-between items-center">
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="text-xs font-mono font-bold text-white">${b.id}</span>
              <span class="text-[9px] px-1.5 py-0.5 rounded font-bold ${isSeau ? 'bg-amber-900/60 text-amber-300 border border-amber-500/30' : 'bg-[#0f1a0f] text-[#bbb] border border-[#2d4a2d]'}">
                ${isSeau ? '🪣 Seau' : '🛍️ Sac'}
              </span>
              <span class="text-[10px] font-semibold text-[#7bc67e] bg-[#0f1a0f] px-1.5 py-0.5 rounded border border-[#2d4a2d]">${strainName}</span>
              <span class="text-[10px] text-[#777]">• ${tableName}</span>
            </div>
            <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${
              isFruit ? 'bg-[#1f3a1f] text-[#7bc67e] border border-[#7bc67e]/40' :
              (isContam ? 'bg-[#3a1a1a] text-[#e07a7a] border border-[#e07a7a]/40' : 'bg-[#3a2e1a] text-[#e0b87a] border border-[#e0b87a]/40')
            }">
              ${isFruit ? `💧 Fructif. (Volée ${nextFlush})` : (isContam ? '☣️ Contaminé' : `🌡️ Incubat. ${incubDays}`)}
            </span>
          </div>

          <div class="flex justify-between items-center text-xs text-[#aaa] bg-[#0f1a0f] p-2 rounded-xl border border-[#2d4a2d]">
            <span>Substrat : <strong class="text-white">${b.weight || 4.5} kg</strong></span>
            <span>Total récolté : <strong class="text-emerald-400 text-sm font-bold">${(b.harvestedKg || 0).toFixed(2)} kg</strong></span>
          </div>

          ${harvests.length > 0 ? `
            <div class="flex flex-wrap gap-1 pt-0.5">
              ${harvests.map(h => `
                <span class="bg-[#1f3a1f] border border-[#2d4a2d] text-[#7bc67e] text-[9px] px-1.5 py-0.5 rounded-md font-semibold">
                  Volée ${h.flush} : ${h.weightKg} kg <span class="text-[#777]">(${h.date ? h.date.slice(5) : ''})</span>
                </span>
              `).join('')}
            </div>
          ` : ''}

          ${isContam ? `
            <div class="bg-[#3a1a1a]/40 border border-[#e07a7a]/30 p-2 rounded-xl text-[10px] text-[#e07a7a] flex items-center justify-between">
              <span>⚠️ Écarté pour : <strong>${b.contaminationReason || 'Contamination'}</strong></span>
              <span>${b.contaminationDate || ''}</span>
            </div>
          ` : ''}

          ${!isContam ? `
            <div class="flex gap-1.5 pt-1">
              ${isIncub ? `
                <button onclick="moveToFruiting('${b.id}')" class="flex-1 py-1.5 bg-[#1f3a1f] text-[#7bc67e] border border-[#7bc67e]/30 rounded-xl text-xs font-bold hover:bg-[#254625] transition-all flex items-center justify-center gap-1">
                  <span>💧</span> <span>Passer en Fructification</span>
                </button>
              ` : `
                <button onclick="openSingleBagHarvestModal('${b.id}')" class="flex-1 py-1.5 bg-[#4a9e4e] text-white rounded-xl text-xs font-bold shadow hover:bg-emerald-600 transition-all flex items-center justify-center gap-1">
                  <span>⚖️</span> <span>Peser Volée ${nextFlush}</span>
                </button>
              `}
              <button onclick="openContaminationModal('${b.id}')" class="px-2.5 py-1.5 bg-[#3a1a1a] text-[#e07a7a] border border-[#e07a7a]/30 rounded-xl text-xs font-bold hover:bg-[#4a1f1f] transition-all" title="Déclarer une avarie ou moisissure">
                ☣️ Avarie
              </button>
              <button onclick="openPrintLabelsModal(null, '${b.id}')" class="px-2 py-1.5 bg-[#0f1a0f] text-slate-300 border border-[#2d4a2d] rounded-xl text-xs font-bold hover:text-white" title="Étiquette thermique 50x30mm">
                🖨️
              </button>
            </div>
          ` : `
            <div class="flex justify-end pt-0.5">
              <button onclick="restoreBag('${b.id}')" class="text-[10px] text-[#888] hover:text-[#bbb] underline">
                Rétablir ce contenant en culture
              </button>
            </div>
          `}
        </div>
      `;
    }

    function renderWeeksProductionViewHtml(activeWeeks) {
      if (activeWeeks.length === 0) {
        return `
          <div class="text-center py-10 bg-[#1a2a1a] rounded-2xl border border-dashed border-[#2d4a2d] p-6 space-y-3">
            <span class="text-3xl block">🌾</span>
            <h3 class="text-sm font-bold text-white">Aucune table active</h3>
            <p class="text-xs text-[#888] max-w-xs mx-auto">Créez votre première table pour lancer la production d'une semaine.</p>
            <button onclick="openNewTableModal()" class="px-4 py-2 bg-[#4a9e4e] text-white text-xs font-bold rounded-xl shadow">
              + Créer une Table
            </button>
          </div>
        `;
      }

      return `
        <div class="space-y-3">
          ${activeWeeks.map(w => {
            const isExpanded = expandedWeekIds.has(w.weekId);
            const weekBags = (state.bags || []).filter(b => w.tables.some(t => t.id === b.tableId || t.id === b.batchId));
            const weekKg = weekBags.reduce((sum, b) => sum + (b.harvestedKg || 0), 0);

            return `
              <div class="bg-[#142214] rounded-2xl border ${isExpanded ? 'border-[#4a9e4e]/50' : 'border-[#2d4a2d]'} overflow-hidden transition-all shadow-md">
                <!-- Entête de Semaine (Accordéon cliquable) -->
                <div class="p-3 bg-[#1a2a1a] flex justify-between items-center cursor-pointer select-none hover:bg-[#1f331f] transition-all" onclick="toggleWeekAccordion('${w.weekId}')">
                  <div class="flex items-center gap-2.5">
                    <span class="text-lg">${isExpanded ? '📂' : '📁'}</span>
                    <div>
                      <h3 class="text-xs font-bold text-white">${w.weekLabel}</h3>
                      <p class="text-[10px] text-[#888] mt-0.5">
                        <strong class="text-slate-300">${w.tables.length} table(s)</strong> • <strong class="text-[#bbb]">${weekBags.length} sacs & seaux</strong> • <span class="text-emerald-400 font-bold">${weekKg.toFixed(1)} kg récolté</span>
                      </p>
                    </div>
                  </div>

                  <!-- Actions au niveau de la Semaine -->
                  <div class="flex items-center gap-1.5" onclick="event.stopPropagation()">
                    <button onclick="openNewTableModal(null, '${w.tables[0]?.date || ''}')" class="px-2 py-1 bg-[#1f3a1f] hover:bg-[#2e4d2e] text-[#7bc67e] border border-[#7bc67e]/30 rounded-lg text-[10px] font-bold flex items-center gap-0.5" title="Créer une table rattachée à cette semaine">
                      <span>+</span> <span>Table</span>
                    </button>
                    <button onclick="archiveWeek('${w.weekId}')" class="p-1.5 bg-[#0f1a0f] hover:bg-[#1f2f1f] text-slate-300 hover:text-sky-300 border border-[#2d4a2d] rounded-lg text-xs" title="Archiver toute cette semaine">
                      📦
                    </button>
                    <button onclick="openDeleteWeekModal('${w.weekId}')" class="p-1.5 bg-[#0f1a0f] hover:bg-[#2f1f1f] text-slate-400 hover:text-red-400 border border-[#2d4a2d] rounded-lg text-xs" title="Supprimer toute la semaine (Option A)">
                      🗑️
                    </button>
                    <span class="text-xs text-slate-400 ml-1 font-bold">${isExpanded ? '▲' : '▼'}</span>
                  </div>
                </div>

                <!-- Contenu déployé : Tables de cette semaine -->
                ${isExpanded ? `
                  <div class="p-2.5 space-y-2.5 border-t border-[#2d4a2d]/50">
                    ${w.tables.map(table => renderTableCard(table)).join('')}
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderTableCard(table) {
      const tableBags = (state.bags || []).filter(b => b.tableId === table.id || b.batchId === table.id);
      const sacsCount = tableBags.filter(b => b.type !== 'seau').length;
      const seauxCount = tableBags.filter(b => b.type === 'seau').length;
      const tableFruit = tableBags.filter(b => b.status === 'fruiting').length;
      const tableIncub = tableBags.filter(b => b.status === 'incubation').length;
      const tableContam = tableBags.filter(b => b.status === 'contaminated').length;
      const tableKg = tableBags.reduce((sum, b) => sum + (b.harvestedKg || 0), 0);

      let daysElapsed = 0;
      if (table.date) {
        const d1 = new Date(table.date);
        const d2 = new Date();
        daysElapsed = Math.max(0, Math.floor((d2 - d1) / (1000 * 60 * 60 * 24)));
      }

      return `
        <div class="bg-[#1a2a1a] p-3 rounded-2xl border border-[#2d4a2d] space-y-2.5">
          <div class="flex justify-between items-start">
            <div>
              <div class="flex items-center gap-1.5">
                <span class="text-[10px] font-bold text-[#7bc67e] bg-[#0f1a0f] border border-[#2d4a2d] px-2 py-0.5 rounded-md font-mono">${table.id}</span>
                <h4 class="text-xs font-bold text-white">${table.name || ('Table ' + table.id)}</h4>
              </div>
              <p class="text-[11px] text-[#aaa] mt-0.5">
                ${table.isSplitStrains ? `
                  <strong class="text-[#7bc67e]">🛍️ ${table.sacsStrain || 'Sacs'}</strong> <span class="text-slate-500">•</span> <strong class="text-amber-400">🪣 ${table.seauxStrain || 'Seaux'}</strong>
                ` : `
                  <strong class="text-[#7bc67e]">${table.strain || 'Pleurote Gris'}</strong>
                `} • Ensemencée le ${table.date || ''} 
                <span class="text-slate-400 font-semibold">(J+${daysElapsed})</span>
              </p>
            </div>
            <div class="flex items-center gap-1">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${table.status === 'Actif' ? 'bg-[#1f3a1f] text-[#7bc67e] border border-[#7bc67e]/30' : 'bg-[#2a2a2a] text-[#888]'}">
                ${table.status}
              </span>
            </div>
          </div>

          <div class="bg-[#0f1a0f] p-2.5 rounded-xl border border-[#2d4a2d] text-xs space-y-1">
            <div class="flex justify-between text-[#bbb]">
              <span>🌾 Paille : <strong class="text-white">${table.strawBottes || 1} botte(s)</strong></span>
              <span>🍄 Blanc : <strong class="text-white">${table.spawnSacs || 1.5} sac(s)</strong> ${table.isSplitStrains ? `<span class="text-[10px] text-[#888]">(${table.sacsSpawnSacs || 0}s sacs / ${table.seauxSpawnSacs || 0}s seaux)</span>` : ''}</span>
            </div>
            <div class="flex justify-between text-[#888] text-[11px] pt-0.5 border-t border-[#2d4a2d]/50">
              <span>Contenants : <strong class="text-[#bbb]">${sacsCount} sacs</strong> ${seauxCount > 0 ? `• <strong class="text-[#bbb]">${seauxCount} seaux</strong>` : ''}</span>
              <span class="text-emerald-400 font-bold">Total récolté : ${tableKg.toFixed(2)} kg</span>
            </div>
          </div>

          <!-- Compteurs statut contenants -->
          <div class="grid grid-cols-4 gap-1 text-center text-[10px]">
            <div class="bg-[#1f3a1f]/60 border border-[#7bc67e]/20 p-1 rounded-lg text-[#7bc67e]">
              <span class="font-bold">${tableFruit}</span>
              <span class="block text-[8px] opacity-80">Fructif.</span>
            </div>

    function archiveTable(tableId) {
      const table = (state.tables || []).find(t => t.id === tableId);
      if (!table) return;

      table.archived = true;
      table.status = 'Archivé';
      saveState();
      closeModal();
      showToast(`📦 Table ${table.id} archivée ! Retrouvez-la dans l'onglet Archives.`);
    }

    function unarchiveTable(tableId) {
      const table = (state.tables || []).find(t => t.id === tableId);
      if (!table) return;

      table.archived = false;
      table.status = 'Actif';
      saveState();
      showToast(`🔄 Table ${table.id} rétablie en production active !`);
    }

    function archiveWeek(weekId) {
      const weekTables = (state.tables || []).filter(t => (t.weekId === weekId || getWeekInfo(t.date).weekId === weekId) && !t.archived);
      if (weekTables.length === 0) return;

      if (confirm(`Archiver les ${weekTables.length} table(s) de cette semaine ?\nToutes les récoltes et statistiques seront préservées dans les archives.`)) {
        weekTables.forEach(t => {
          t.archived = true;
          t.status = 'Archivé';
        });
        saveState();
        showToast(`📦 Semaine archivée (${weekTables.length} tables déplacées dans les archives) !`);
      }
    }

    function openDeleteTableModal(tableId) {
      const table = (state.tables || []).find(t => t.id === tableId);
      if (!table) return;

      const tableBags = (state.bags || []).filter(b => b.tableId === table.id || b.batchId === table.id);
      const tableKg = tableBags.reduce((sum, b) => sum + (b.harvestedKg || 0), 0);

          <div class="space-y-3 text-xs">

                <span>↩️</span> <span>Annuler la Table (Erreur de Saisie)</span>

              </p>

                Toutes les matières premières seront automatiquement réintégrées au stock physique :
              </p>
              <ul class="text-[10px] text-[#aaa] list-disc list-inside space-y-0.5 pt-0.5">
                <li>Paille de blé : +${strawBottes} botte(s)</li>
                ${isSplit ? `
                  <li>Blanc Sacs (${table.sacsStrain || 'Sacs'}) : +${table.sacsSpawnSacs || 0} sac(s)</li>
                  <li>Blanc Seaux (${table.seauxStrain || 'Seaux'}) : +${table.seauxSpawnSacs || 0} sac(s)</li>
                ` : `
                  <li>Mycélium (${strainName}) : +${spawnSacs} sac(s)</li>
                `}

              </ul>
            </div>

            <div class="pt-2 flex gap-2">
              <button onclick="closeModal()" class="flex-1 py-2.5 bg-[#2d4a2d] rounded-xl text-white font-bold">Conserver la Table</button>
              <button onclick="executeDeleteTable('${tableId}', true)" class="flex-1 py-2.5 bg-[#1f3a1f] hover:bg-[#2e4d2e] text-[#7bc67e] border border-[#7bc67e]/60 rounded-xl text-xs font-bold shadow flex items-center justify-center gap-1">
                <span>↩️</span> <span>Confirmer l'Annulation</span>
              </button>
            </div>
          </div>
        `);
        return;
      }

      // Cas 2 : Propriétaire & Administrateur (Options complètes)
      showModal(`
        <div class="space-y-3 text-xs">
          <div class="flex justify-between items-center border-b border-[#2d4a2d] pb-2">
            <h3 class="text-sm font-bold text-white flex items-center gap-1.5 text-red-400">
              <span>🗑️</span> <span>Suppression Table : ${table.id}</span>
            </h3>
            <span class="text-[10px] font-mono text-[#888]">${table.name}</span>
          </div>

          ${tableKg > 0 ? `
            <div class="p-2.5 bg-amber-950/70 border border-amber-500/80 rounded-xl text-amber-200 space-y-1">
              <p class="font-bold flex items-center gap-1 text-xs">
                <span>⚠️</span> <span>ATTENTION : RÉCOLTES DÉJÀ ENREGISTRÉES</span>
              </p>
              <p class="text-[11px] leading-relaxed">
                Cette table a déjà produit <strong>${tableKg.toFixed(2)} kg</strong> de récoltes vendables.
                La supprimer détruira l'historique de ces cueillettes.
              </p>
              <p class="text-[10px] text-amber-300/90 font-semibold">
                👉 Si vous voulez juste désencombrer l'écran, utilisez plutôt <strong>📦 Archiver</strong> !
              </p>
            </div>
          ` : ''}

          <div class="bg-[#0f1a0f] p-3 rounded-2xl border border-[#2d4a2d] space-y-1.5">
            <p class="text-white font-bold text-xs">Matières consommées lors de l'ensemencement :</p>
            <div class="flex justify-between text-[#bbb]">
              <span>🌾 Paille de blé :</span>
              <strong class="text-white">${strawBottes} botte(s)</strong>
            </div>
            ${isSplit ? `
              <div class="flex justify-between text-[#bbb]">
                <span>🍄 Blanc Sacs (${table.sacsStrain || 'Sacs'}) :</span>
                <strong class="text-[#7bc67e]">${table.sacsSpawnSacs || 0} sac(s)</strong>
              </div>
              <div class="flex justify-between text-[#bbb]">
                <span>🍄 Blanc Seaux (${table.seauxStrain || 'Seaux'}) :</span>
                <strong class="text-amber-400">${table.seauxSpawnSacs || 0} sac(s)</strong>

            <button onclick="executeDeleteTable('${tableId}', false)" class="w-full py-2.5 bg-[#2a1a1a] hover:bg-[#3a2020] text-[#e07a7a] border border-[#e07a7a]/40 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5">
              <span>❌</span> <span>Non, considérer comme perte réelle (0 restitution)</span>
            </button>

            <button onclick="archiveTable('${tableId}')" class="w-full py-2 bg-[#1a2233] hover:bg-[#25324d] text-sky-300 border border-sky-500/30 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5">
              <span>📦</span> <span>Préférer archiver la table (Garder stats & historique)</span>
            </button>

            <button onclick="closeModal()" class="w-full py-2 bg-[#2d4a2d] text-white rounded-xl text-xs font-semibold">
              Annuler
            </button>
          </div>
        </div>
      `);
    }

    function executeDeleteTable(tableId, restoreStock) {
      const table = (state.tables || []).find(t => t.id === tableId);
      if (!table) return;

      const strawBottes = table.strawBottes || 1.0;
      const spawnSacs = table.spawnSacs || 1.5;
      const strainName = table.strain || 'Pleurote';
      let restMsg = '';

      if (restoreStock) {
        const strawStock = state.stocks.find(s => s.id === 'stk_01' || s.unit === 'bottes' || s.name.toLowerCase().includes('paille'));
        if (strawStock) {
          strawStock.quantity = Math.round((strawStock.quantity + strawBottes) * 10) / 10;
        }

        if (table.isSplitStrains) {
          const sacsStock = (table.sacsSpawnStockId ? state.stocks.find(s => s.id === table.sacsSpawnStockId) : null) ||
                            state.stocks.find(s => (s.strain && s.strain.toLowerCase() === (table.sacsStrain || '').toLowerCase()) || (s.category === 'Semence/Blanc' && s.name.toLowerCase().includes((table.sacsStrain || '').toLowerCase())));
          if (sacsStock && table.sacsSpawnSacs) {
            sacsStock.quantity = Math.round((sacsStock.quantity + table.sacsSpawnSacs) * 10) / 10;
          }

          const seauxStock = (table.seauxSpawnStockId ? state.stocks.find(s => s.id === table.seauxSpawnStockId) : null) ||
                             state.stocks.find(s => (s.strain && s.strain.toLowerCase() === (table.seauxStrain || '').toLowerCase()) || (s.category === 'Semence/Blanc' && s.name.toLowerCase().includes((table.seauxStrain || '').toLowerCase())));
          if (seauxStock && table.seauxSpawnSacs) {
            seauxStock.quantity = Math.round((seauxStock.quantity + table.seauxSpawnSacs) * 10) / 10;
          }

          restMsg = ` • Restitué au stock : +${strawBottes} botte(s), +${table.sacsSpawnSacs} sac(s) [${table.sacsStrain}], +${table.seauxSpawnSacs} sac(s) [${table.seauxStrain}]`;
        } else {
          const spawnStock = (table.spawnStockId ? state.stocks.find(s => s.id === table.spawnStockId) : null) ||
                             state.stocks.find(s => (s.strain && s.strain.toLowerCase() === strainName.toLowerCase()) || (s.category === 'Semence/Blanc' && s.name.toLowerCase().includes(strainName.toLowerCase())));
          if (spawnStock) {
            spawnStock.quantity = Math.round((spawnStock.quantity + spawnSacs) * 10) / 10;
          }

          restMsg = ` • Restitué au stock : +${strawBottes} botte(s) et +${spawnSacs} sac(s) [${strainName}]`;
        }
      }

      state.bags = (state.bags || []).filter(b => b.tableId !== tableId && b.batchId !== tableId);
      state.tables = (state.tables || []).filter(t => t.id !== tableId);
      if (state.batches) state.batches = state.batches.filter(b => b.id !== tableId);

      saveState();
      closeModal();
      showToast(`Table ${tableId} supprimée !${restMsg}`);
    }

    function openDeleteWeekModal(weekId) {
      const weekTables = (state.tables || []).filter(t => (t.weekId === weekId || getWeekInfo(t.date).weekId === weekId));
      if (weekTables.length === 0) return;

      const totalStraw = weekTables.reduce((sum, t) => sum + (t.strawBottes || 1), 0);
      const totalSpawn = Math.round(weekTables.reduce((sum, t) => sum + (t.spawnSacs || 1.5), 0) * 10) / 10;
      const wInfo = getWeekInfo(weekTables[0]?.date);

      showModal(`
        <div class="space-y-3 text-xs">
          <div class="flex justify-between items-center border-b border-[#2d4a2d] pb-2">
            <h3 class="text-sm font-bold text-white flex items-center gap-1.5 text-red-400">
              <span>🗑️</span> <span>Supprimer toute la Semaine</span>
            </h3>
            <span class="text-[10px] font-mono text-[#888]">${weekId}</span>
          </div>

          <div class="bg-[#0f1a0f] p-3 rounded-2xl border border-[#2d4a2d] space-y-1.5">

            <p class="text-[#bbb]">Cette action supprimera les <strong>${weekTables.length} table(s)</strong> suivantes :</p>

              ${weekTables.map(t => `<li><strong>${t.id}</strong> : ${t.name} (${t.strain})</li>`).join('')}

              <span>Matières totales consommées :</span>
              <span class="text-white font-semibold">${totalStraw} bottes • ${totalSpawn} sacs mycélium</span>
            </div>
          </div>

          <div class="bg-[#142214] p-3 rounded-2xl border border-[#4a9e4e]/40 space-y-2">

            </p>
          </div>

          <div class="space-y-2 pt-1">
            <button onclick="executeDeleteWeek('${weekId}', true)" class="w-full py-2.5 bg-[#1f3a1f] hover:bg-[#2e4d2e] text-[#7bc67e] border border-[#7bc67e]/60 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5 shadow">
              <span>✅</span> <span>Oui, réintégrer au stock (+${totalStraw} bottes, +${totalSpawn} sacs)</span>
            </button>
            <button onclick="executeDeleteWeek('${weekId}', false)" class="w-full py-2.5 bg-[#2a1a1a] hover:bg-[#3a2020] text-[#e07a7a] border border-[#e07a7a]/40 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5">
              <span>❌</span> <span>Non, perte réelle (0 restitution)</span>
            </button>
            <button onclick="archiveWeek('${weekId}')" class="w-full py-2 bg-[#1a2233] hover:bg-[#25324d] text-sky-300 border border-sky-500/30 rounded-xl text-xs font-bold flex items-center justify-center gap-1.5">
              <span>📦</span> <span>Préférer archiver la semaine</span>
            </button>
            <button onclick="closeModal()" class="w-full py-2 bg-[#2d4a2d] text-white rounded-xl text-xs font-semibold">
              Annuler
            </button>
          </div>
        </div>
      `);
    }

    function executeDeleteWeek(weekId, restoreStock) {
      const weekTables = (state.tables || []).filter(t => (t.weekId === weekId || getWeekInfo(t.date).weekId === weekId));
      if (weekTables.length === 0) return;

      weekTables.forEach(t => {
        executeDeleteTable(t.id, restoreStock);
      });

      closeModal();
