<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>MycoTrack — Gestion Ventes, Livraisons & Finances</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    body {
      background-color: #050a05;
      color: #ffffff;
      -webkit-tap-highlight-color: transparent;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    .bg-myco-dark { background-color: #0f1a0f; }
    .bg-myco-card { background-color: #1a2a1a; }
    .border-myco { border-color: #2d4a2d; }
    .text-myco-green { color: #7bc67e; }
    .bg-myco-green { background-color: #4a9e4e; }
    .text-myco-red { color: #e07a7a; }
    .text-myco-yellow { color: #e0b87a; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #2d4a2d; border-radius: 4px; }
  </style>
</head>

    <!-- Scrollable Screen Content -->

      </button>
      <button onclick="switchTab('bags')" id="nav-bags" class="flex flex-col items-center text-slate-400 hover:text-[#7bc67e] p-1">
        <span class="text-lg">🍄</span>

      <button onclick="switchTab('expenses')" id="nav-exp" class="flex flex-col items-center text-slate-400 hover:text-[#7bc67e] p-1">

    let state = JSON.parse(localStorage.getItem('mycotrack_state_v5') || 'null') || initialSeedState;

    function saveState() {
      localStorage.setItem('mycotrack_state_v5', JSON.stringify(state));
      checkBadges();
      renderCurrentView();
    }

    // Gestion de l'onglet Carnet Pro (Clients vs Livreurs)
    let carnetSubTab = 'clients'; // 'clients' | 'deliverers'
    function setCarnetSubTab(sub) {
      carnetSubTab = sub;
      renderCarnetView();
    }

    // Gestion du filtrage des ventes (5 récentes par défaut, recherche par date, impayés, tout)
    let salesFilterMode = 'recent5'; // 'recent5' | 'today' | 'unpaid' | 'all' | 'date'
    let salesDateFilter = '';
    let salesSearchQuery = '';

    function setSalesFilterMode(mode) {
      salesFilterMode = mode;
      if (mode !== 'date') {
        salesDateFilter = '';
      }
      renderSalesView();
    }

    function onSalesDateChange(val) {
      salesDateFilter = val;
      if (val) {
        salesFilterMode = 'date';
      } else {
        salesFilterMode = 'recent5';
      }
      renderSalesView();
    }

    function clearSalesDateFilter() {
      salesDateFilter = '';
      salesFilterMode = 'recent5';
      renderSalesView();
    }

    function onSalesSearchInput(val) {
      salesSearchQuery = val;
      renderSalesView();
    }

    function formatDisplayDate(isoDateStr) {
      if (!isoDateStr) return '';
      const parts = isoDateStr.split('-');
      if (parts.length === 3) {
        return `${parts[2]}/${parts[1]}/${parts[0]}`;
      }
      return isoDateStr;
    }

    function resetDemoData() {
      if (confirm('Réinitialiser toutes les données aux valeurs de démonstration ?')) {
        state = JSON.parse(JSON.stringify(initialSeedState));
        saveState();
        showToast('Données réinitialisées !');
      }
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.remove('opacity-0');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0');
      }, 2400);
    }

    function checkBadges() {
      // Badge alerte stock
      const lowCount = state.stocks.filter(s => s.quantity <= s.threshold).length;
      const dot = document.getElementById('stock-alert-dot');
      if (dot) {
        if (lowCount > 0) dot.classList.remove('hidden');
        else dot.classList.add('hidden');
      }

      // Badge courses livreur en attente
      const pendingDeliveries = state.deliveries.filter(d => d.status === 'pending_acceptance' || d.status === 'in_delivery').length;
      const delivBadge = document.getElementById('role-delivery-badge');
      if (delivBadge) {
        if (pendingDeliveries > 0) delivBadge.classList.remove('hidden');
        else delivBadge.classList.add('hidden');
      }

      // Badge onglet ventes
      const activeSales = state.deliveries.filter(d => d.status !== 'settled').length;
      const salesBadge = document.getElementById('active-sales-badge');
      if (salesBadge) {
        if (activeSales > 0) {
          salesBadge.innerText = activeSales;
          salesBadge.classList.remove('hidden');
        } else {
          salesBadge.classList.add('hidden');
        }
      }
    }

    function setRole(role) {
      currentRole = role;
      const adminBtn = document.getElementById('role-admin-btn');
      const deliveryBtn = document.getElementById('role-delivery-btn');
      const statusText = document.getElementById('role-status-text');
      const bottomNav = document.getElementById('bottom-nav');

      if (role === 'delivery') {
        adminBtn.className = "px-2.5 py-1 rounded-lg text-xs font-semibold text-slate-400 hover:text-white";
        deliveryBtn.className = "px-2.5 py-1 rounded-lg text-xs font-bold transition-all bg-[#e0b87a] text-black shadow";
        statusText.innerText = "Mode Livreur • Chauffeur terrain";
        statusText.className = "text-[11px] text-[#e0b87a] font-semibold";
        bottomNav.classList.add('hidden');
        renderDeliveryView();
      } else {
        deliveryBtn.className = "px-2.5 py-1 rounded-lg text-xs font-semibold text-slate-400 hover:text-white";
        adminBtn.className = "px-2.5 py-1 rounded-lg text-xs font-bold transition-all bg-[#4a9e4e] text-white shadow";
        statusText.innerText = "Mode Propriétaire & Responsable";
        statusText.className = "text-[11px] text-[#7bc67e] font-semibold";
        bottomNav.classList.remove('hidden');
        switchTab(currentTab === 'delivery' ? 'dashboard' : currentTab);
      }
    }

    function switchTab(tab, subTab = null) {
      if (tab === 'clients') {
        tab = 'carnet';
        carnetSubTab = 'clients';
      } else if (tab === 'deliverers') {
        tab = 'carnet';
        carnetSubTab = 'deliverers';
      }
      if (subTab) {
        carnetSubTab = subTab;
      }
      currentTab = tab;
      ['dash', 'sales', 'carnet', 'stock', 'bags', 'exp'].forEach(t => {
        const el = document.getElementById(`nav-${t}`);
        if (el) {
          if ((tab === 'dashboard' && t === 'dash') || 
              (tab === 'sales' && t === 'sales') || 
              (tab === 'carnet' && t === 'carnet') || 
              (tab === 'stock' && t === 'stock') || 
              (tab === 'bags' && t === 'bags') || 
              (tab === 'expenses' && t === 'exp')) {
            el.className = "flex flex-col items-center text-[#7bc67e] font-bold p-1";
          } else {
            el.className = "flex flex-col items-center text-slate-400 hover:text-[#7bc67e] p-1";
          }
        }
      });
      renderCurrentView();
    }

    function renderCurrentView() {
      if (currentRole === 'delivery') {
        renderDeliveryView();
      } else {
        if (currentTab === 'dashboard') renderDashboardView();
        else if (currentTab === 'sales') renderSalesView();
        else if (currentTab === 'carnet' || currentTab === 'clients') renderCarnetView();
        else if (currentTab === 'stock') renderStockView();
        else if (currentTab === 'bags') renderBagsView();
        else if (currentTab === 'expenses') renderExpensesView();
      }
    }

    // ==========================================
    // 1. DASHBOARD PRINCIPAL (FINANCES COMPLÈTES)
    // ==========================================
    function renderDashboardView() {
      const container = document.getElementById('app-content');
      
      // Calculs financiers rigoureux
      // 1. Chiffre d'Affaires Brut (Total des ventes passées)
      const totalRevenue = state.deliveries.reduce((sum, d) => sum + (d.totalAmount || 0), 0);
      
      // 2. Frais livreurs déduits
      const totalDelivererFees = state.deliveries.reduce((sum, d) => sum + (d.deliveryFee || 0), 0);
      
      // 3. Montant réel encaissé en caisse ferme (Net versé en caisse)
      const totalNetCashInFarm = state.deliveries.reduce((sum, d) => sum + (d.netCashToFarm || 0), 0);
      
      // 4. Impayés / Restes à payer des clients
      const totalRemainingDue = state.clients.reduce((sum, c) => sum + (c.due || 0), 0);
      
      // 5. Total des dépenses d'exploitation
      const totalExpenses = state.expenses.reduce((sum, e) => sum + (e.amount || 0), 0);
      
      // 6. Bénéfice Net Réel = Chiffre d'affaires - Frais livreurs - Dépenses
      const netProfit = totalRevenue - totalDelivererFees - totalExpenses;
      const profitRate = totalRevenue > 0 ? ((netProfit / totalRevenue) * 100).toFixed(1) : 0;

      // Alertes
      const lowStocks = state.stocks.filter(s => s.quantity <= s.threshold);
      const pendingDeliveries = state.deliveries.filter(d => d.status !== 'settled');

      container.innerHTML = `

            <p class="text-base font-bold text-white mt-0.5">${totalRevenue.toLocaleString()} DA</p>
            <p class="text-[9px] text-[#666] mt-0.5">${state.deliveries.length} ventes enregistrées</p>
          </div>

          <!-- Frais livreurs déduits -->
          <div class="bg-[#1a2a1a] p-3 rounded-2xl border border-[#2d4a2d]">

            <p class="text-base font-bold text-[#e0b87a] mt-0.5">-${totalDelivererFees.toLocaleString()} DA</p>
            <p class="text-[9px] text-[#666] mt-0.5">Prélevés sur cash remis</p>
          </div>

          <!-- Dépenses exploitation -->
          <div class="bg-[#1a2a1a] p-3 rounded-2xl border border-[#2d4a2d]">
            <p class="text-[11px] text-[#888]">Dépenses exploitation</p>
            <p class="text-base font-bold text-[#e07a7a] mt-0.5">-${totalExpenses.toLocaleString()} DA</p>
            <p class="text-[9px] text-[#666] mt-0.5">Substrats, gaz, sacs...</p>
          </div>

          <!-- Bénéfice net réel -->
          <div class="bg-[#1a2a1a] p-3 rounded-2xl border border-[#2d4a2d]">
            <p class="text-[11px] text-[#888]">Bénéfice net réel</p>
            <p class="text-base font-bold text-[#7bc67e] mt-0.5">${netProfit.toLocaleString()} DA</p>
            <p class="text-[9px] text-[#7bc67e]/80 mt-0.5">Marge nette : ${profitRate}%</p>
          </div>

          <!-- Encaissé Net en Caisse -->
          <div class="bg-[#1a2a1a] p-3 rounded-2xl border border-[#2d4a2d]">
            <p class="text-[11px] text-[#888]">En caisse ferme (Net)</p>
            <p class="text-base font-bold text-[#7bc67e] mt-0.5">${totalNetCashInFarm.toLocaleString()} DA</p>
            <p class="text-[9px] text-[#666] mt-0.5">Liquidités remises</p>
          </div>

          <!-- Impayés / Reste à payer -->
          <div class="bg-[#1a2a1a] p-3 rounded-2xl border border-[#2d4a2d]">
            <p class="text-[11px] text-[#888]">Reste à payer (Impayés)</p>
            <p class="text-base font-bold text-[#e0b87a] mt-0.5">${totalRemainingDue.toLocaleString()} DA</p>
            <p class="text-[9px] text-[#666] mt-0.5">${state.clients.filter(c=>c.due>0).length} client(s) à terme</p>
          </div>
        </div>

        <!-- Alerte active si commande en cours ou impayé -->
        ${pendingDeliveries.length > 0 || totalRemainingDue > 0 || lowStocks.length > 0 ? `
          <div class="mt-2 space-y-1.5">
            <h2 class="text-xs font-bold text-[#e0b87a] tracking-wider uppercase flex items-center gap-1.5">
              <span>⚠️</span> <span>SUIVI OPÉRATIONNEL & CRÉDITS</span>
            </h2>

            ${pendingDeliveries.map(d => `
              <div class="bg-[#1f2a1a] p-2.5 rounded-xl border border-[#4a9e4e]/40 text-xs flex justify-between items-center">
                <div>
                  <p class="font-bold text-white flex items-center gap-1.5">
                    <span class="font-mono text-[10px] text-[#7bc67e]">${d.orderNumber}</span>
                    <span>• ${d.clientName} (${d.quantityKg} kg)</span>
                  </p>
                  <p class="text-[10px] text-[#aaa]">Livreur : <strong>${d.delivererName}</strong> • ${d.totalAmount.toLocaleString()} DA</p>
                </div>
                <div class="text-right">
                  <span class="text-[9px] font-bold px-2 py-0.5 rounded-full ${
                    d.status === 'pending_acceptance' ? 'bg-amber-900/60 text-amber-300 border border-amber-500/40' :
                    (d.status === 'in_delivery' ? 'bg-blue-900/60 text-blue-300 border border-blue-500/40' : 'bg-emerald-900/60 text-emerald-300 border border-emerald-500/40')
                  }">
                    ${d.status === 'pending_acceptance' ? 'En attente livreur' : (d.status === 'in_delivery' ? 'En livraison' : 'Livré • Clôture')}
                  </span>
                  <button onclick="switchTab('sales')" class="block mt-1 text-[10px] text-[#7bc67e] underline text-right">Voir détails</button>
                </div>
              </div>
            `).join('')}

            ${state.clients.filter(c => c.due > 0).map(c => `
              <div class="bg-[#2a1a1a] p-2.5 rounded-xl border border-[#5a2a2a] text-xs text-[#e0b87a] flex justify-between items-center">
                <div>
                  <p class="font-bold">🔴 Reste à payer client : ${c.name}</p>
                  <p class="text-[10px] text-[#aaa]">Montant dû : <strong>${c.due.toLocaleString()} DA</strong></p>
                </div>
                <a href="tel:${c.phone}" class="px-2.5 py-1 bg-[#3a2e1a] text-[#e0b87a] border border-[#e0b87a]/40 rounded-lg text-[10px] font-bold">
                  📞 Relancer
                </a>
              </div>
            `).join('')}

            ${lowStocks.map(s => `
              <div class="bg-[#2a1a1a] p-2.5 rounded-xl border border-[#5a2a2a] text-xs text-[#e07a7a] flex justify-between items-center">
                <div>
                  <p class="font-bold">🔴 Stock critique : ${s.name}</p>
                  <p class="text-[10px] text-[#aaa]">Reste <strong>${s.quantity} ${s.unit}</strong> (seuil alerte : ${s.threshold} ${s.unit})</p>
                </div>
                <button onclick="switchTab('stock')" class="px-2 py-0.5 bg-[#4a9e4e] text-white rounded text-[10px] font-bold">
                  Stock
                </button>
              </div>
            `).join('')}
          </div>
        ` : ''}

        <!-- Modules Raccourcis -->
        <h2 class="text-xs font-bold text-[#7bc67e] tracking-wider uppercase mt-2 mb-1">MODULES DE GESTION</h2>
        <div class="grid grid-cols-2 gap-2">
          <div onclick="switchTab('sales')" class="bg-[#1a2a1a] p-3 rounded-2xl border border-[#2d4a2d] cursor-pointer hover:border-[#7bc67e] transition-all">
            <span class="text-xl">🛒</span>
            <h3 class="text-xs font-bold text-white mt-1">Ventes & Courses</h3>
            <p class="text-[10px] text-[#888]">${state.deliveries.length} commandes totales</p>
          </div>
          <div onclick="switchTab('carnet')" class="bg-[#1a2a1a] p-3 rounded-2xl border border-[#2d4a2d] cursor-pointer hover:border-[#7bc67e] transition-all">
            <span class="text-xl">📖</span>
            <h3 class="text-xs font-bold text-white mt-1">Carnet Pro</h3>
            <p class="text-[10px] text-[#888]">${state.clients.length} clients & ${(state.deliverers || []).length} livreurs</p>
          </div>
          <div onclick="switchTab('stock')" class="bg-[#1a2a1a] p-3 rounded-2xl border border-[#2d4a2d] cursor-pointer hover:border-[#7bc67e] transition-all">
            <span class="text-xl">📦</span>
            <h3 class="text-xs font-bold text-white mt-1">Stocks & Intrants</h3>
            <p class="text-[10px] text-[#888]">${state.stocks.length} articles suivis</p>
          </div>
          <div onclick="switchTab('bags')" class="bg-[#1a2a1a] p-3 rounded-2xl border border-[#2d4a2d] cursor-pointer hover:border-[#7bc67e] transition-all">
            <span class="text-xl">🍄</span>
            <h3 class="text-xs font-bold text-white mt-1">Culture & Sacs</h3>
            <p class="text-[10px] text-[#888]">${state.bags.length} sacs en cycle</p>
          </div>
        </div>
      `;
    }

    // ==========================================
    // 2. MODULE VENTES & LIVRAISONS (FLUX ERGONOMIQUE AVEC FILTRE DATE & 5 RÉCENTES)
    // ==========================================
    function renderSalesView() {
      const container = document.getElementById('app-content');
      
      const todayIso = new Date().toISOString().slice(0, 10);
      const todayCount = state.deliveries.filter(d => (d.dateIso && d.dateIso === todayIso) || (d.createdAt && d.createdAt.includes('24 Sep'))).length;
      const unpaidCount = state.deliveries.filter(d => (d.clientRemainingDue && d.clientRemainingDue > 0) || (!d.isClientPaid && d.status === 'settled')).length;

      // 1. Filtrage selon texte de recherche
      let filtered = [...state.deliveries];
      if (salesSearchQuery.trim()) {
        const q = salesSearchQuery.trim().toLowerCase();
        filtered = filtered.filter(d => 
          (d.clientName && d.clientName.toLowerCase().includes(q)) ||
          (d.orderNumber && d.orderNumber.toLowerCase().includes(q)) ||
          (d.delivererName && d.delivererName.toLowerCase().includes(q)) ||
          (d.createdAt && d.createdAt.toLowerCase().includes(q)) ||
          (d.dateIso && d.dateIso.includes(q))
        );
      }

      // 2. Filtrage selon mode ou date sélectionnée
      let isTruncated5 = false;
      if (salesFilterMode === 'date' && salesDateFilter) {
        filtered = filtered.filter(d => 
          (d.dateIso && d.dateIso === salesDateFilter) ||
          (d.createdAt && d.createdAt.includes(salesDateFilter))
        );
      } else if (salesFilterMode === 'today') {
        filtered = filtered.filter(d => 
          (d.dateIso && d.dateIso === todayIso) ||
          (d.createdAt && d.createdAt.includes('24 Sep'))
        );
      } else if (salesFilterMode === 'unpaid') {
        filtered = filtered.filter(d => 
          (d.clientRemainingDue && d.clientRemainingDue > 0) || (!d.isClientPaid && d.status === 'settled')
        );
      } else if (salesFilterMode === 'recent5') {
        if (filtered.length > 5) {
          isTruncated5 = true;
          filtered = filtered.slice(0, 5);
        }
      }

      container.innerHTML = `
        <!-- En-tête -->
        <div class="flex justify-between items-center mb-1">
          <div>
            <h2 class="text-xs font-bold text-[#7bc67e] tracking-wider uppercase">Commandes & Ventes</h2>
            <p class="text-[10px] text-[#888]">Suivi des livraisons, des encaissements et historique</p>
          </div>
          <button onclick="openNewSaleModal()" class="text-xs bg-[#4a9e4e] text-white px-3 py-1.5 rounded-xl font-bold shadow hover:bg-emerald-600 transition-all flex items-center gap-1">
            <span>+</span> <span>Nouvelle Vente</span>
          </button>
        </div>

        <!-- Panneau de recherche & filtres ergonomiques -->
        <div class="bg-[#1a2a1a] p-2.5 rounded-2xl border border-[#2d4a2d] space-y-2 mt-2">
          <!-- 1. Recherche par texte libre (client, N° vente, etc.) -->
          <div class="relative">
            <span class="absolute left-3 top-2.5 text-xs text-[#888]">🔍</span>
            <input 
              type="text" 
              placeholder="Rechercher client, N° vente, date..." 
              value="${salesSearchQuery}" 
              oninput="onSalesSearchInput(this.value)"
              class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl pl-8 pr-7 py-1.5 text-xs text-white placeholder-[#666] focus:border-[#7bc67e] outline-none"
            />
            ${salesSearchQuery ? `
              <button onclick="onSalesSearchInput('');" class="absolute right-2.5 top-2 text-xs text-[#888] hover:text-white">✕</button>
            ` : ''}
          </div>

          <!-- 2. Recherche par Date précise (Calendrier) -->
          <div class="flex items-center gap-2">
            <div class="flex-1 flex items-center bg-[#0f1a0f] border ${salesDateFilter ? 'border-[#7bc67e]' : 'border-[#2d4a2d]'} rounded-xl px-2.5 py-1.5">
              <span class="text-xs mr-2">📅</span>
              <label class="text-[10px] text-[#888] mr-2">Filtrer par date :</label>
              <input 
                type="date" 
                value="${salesDateFilter}" 
                onchange="onSalesDateChange(this.value)"
                class="bg-transparent text-xs text-white outline-none cursor-pointer flex-1"
              />
              ${salesDateFilter ? `
                <button onclick="clearSalesDateFilter()" class="text-xs text-[#e07a7a] hover:text-red-400 font-bold ml-1.5" title="Effacer le filtre">✕</button>
              ` : ''}
            </div>
          </div>

          <!-- 3. Raccourcis et filtres rapides (Solutions proposées) -->
          <div class="flex items-center gap-1.5 overflow-x-auto pb-0.5 no-scrollbar text-[11px]">
            <button onclick="setSalesFilterMode('recent5')" class="px-2.5 py-1 rounded-lg font-semibold whitespace-nowrap transition-all ${salesFilterMode === 'recent5' ? 'bg-[#7bc67e] text-[#0f1a0f] font-bold shadow' : 'bg-[#0f1a0f] text-[#aaa] border border-[#2d4a2d] hover:text-white'}">
              ⏱️ 5 Dernières
            </button>

            <button onclick="setSalesFilterMode('today')" class="px-2.5 py-1 rounded-lg font-semibold whitespace-nowrap transition-all ${salesFilterMode === 'today' ? 'bg-[#7bc67e] text-[#0f1a0f] font-bold shadow' : 'bg-[#0f1a0f] text-[#aaa] border border-[#2d4a2d] hover:text-white'}">
              📅 Aujourd'hui (${todayCount})
            </button>

            <button onclick="setSalesFilterMode('unpaid')" class="px-2.5 py-1 rounded-lg font-semibold whitespace-nowrap transition-all ${salesFilterMode === 'unpaid' ? 'bg-red-500 text-white font-bold shadow' : 'bg-[#0f1a0f] text-[#e07a7a] border border-[#2d4a2d] hover:border-red-500/50'}">
              🔴 Reste à payer (${unpaidCount})
            </button>

            <button onclick="setSalesFilterMode('all')" class="px-2.5 py-1 rounded-lg font-semibold whitespace-nowrap transition-all ${salesFilterMode === 'all' ? 'bg-[#7bc67e] text-[#0f1a0f] font-bold shadow' : 'bg-[#0f1a0f] text-[#aaa] border border-[#2d4a2d] hover:text-white'}">
              📜 Tout (${state.deliveries.length})
            </button>
          </div>
        </div>

        <!-- Indicateur de statut des ventes affichées -->
        <div class="flex justify-between items-center px-1 text-[11px] text-[#888] mt-2">
          <span>
            ${salesFilterMode === 'recent5' ? 'Affichage des <strong>5 dernières ventes</strong>' :
              (salesFilterMode === 'date' ? `Ventes du <strong>${formatDisplayDate(salesDateFilter)}</strong>` :
              (salesFilterMode === 'today' ? 'Ventes d\'<strong>aujourd\'hui</strong>' :
              (salesFilterMode === 'unpaid' ? 'Commandes avec <strong>reste à payer</strong>' :
              '<strong>Toutes les ventes</strong>')))}
          </span>
          <span class="text-[#7bc67e] font-mono font-bold">${filtered.length} affichée(s)</span>
        </div>

        <!-- Liste des Ventes filtrées -->
        <div class="space-y-2.5 mt-2">
          ${filtered.length === 0 ? `
            <div class="bg-[#1a2a1a] p-8 text-center rounded-2xl border border-[#2d4a2d]">
              <p class="text-sm text-[#888]">Aucune vente ne correspond à ce filtre.</p>
              ${salesFilterMode !== 'recent5' || salesSearchQuery ? `
                <button onclick="clearSalesDateFilter(); onSalesSearchInput('');" class="mt-3 px-3 py-1.5 bg-[#2d4a2d] text-white rounded-lg text-xs font-semibold">Réinitialiser le filtre</button>
              ` : `
                <button onclick="openNewSaleModal()" class="mt-3 px-3 py-1.5 bg-[#4a9e4e] text-white rounded-lg text-xs font-bold">+ Créer une Vente</button>
              `}
            </div>
          ` : ''}

          ${filtered.map(d => {
            const isSettled = d.status === 'settled';
            const isPendingAccept = d.status === 'pending_acceptance';
            const isInDelivery = d.status === 'in_delivery';
            const isDelivered = d.status === 'delivered_pending_settlement';

            return `
              <div class="bg-[#1a2a1a] p-3.5 rounded-2xl border ${isSettled ? 'border-[#2d4a2d]' : 'border-[#e0b87a] bg-[#1d271d]'} space-y-2">
                <div class="flex justify-between items-start">
                  <div>
                    <div class="flex items-center gap-2">
                      <span class="text-xs font-bold font-mono text-[#7bc67e] bg-[#0f1a0f] border border-[#2d4a2d] px-2 py-0.5 rounded-md">${d.orderNumber}</span>
                      <span class="text-[10px] text-[#888]">${d.createdAt}</span>
                    </div>
                    <h3 class="font-bold text-white text-sm mt-1">${d.clientName}</h3>
                  </div>

                  <!-- Badge statut commande -->
                  <span class="px-2.5 py-0.5 rounded-full text-[10px] font-bold ${
                    isSettled ? 'bg-[#1f3a1f] text-[#7bc67e] border border-[#7bc67e]/40' :
                    (isPendingAccept ? 'bg-amber-900/60 text-amber-300 border border-amber-500/40 animate-pulse' :
                    (isInDelivery ? 'bg-blue-900/60 text-blue-300 border border-blue-500/40' : 'bg-purple-900/60 text-purple-300 border border-purple-500/40'))
                  }">
                    ${isSettled ? '✅ Clôturée & Encaissée' :
                      (isPendingAccept ? '⏳ Livreur notifié (Attente)' :
                      (isInDelivery ? '🛵 En cours de livraison' : '📦 Livré (À clôturer)'))}
                  </span>
                </div>

                <!-- Détails financiers de la commande -->
                <div class="bg-[#0f1a0f] p-2.5 rounded-xl border border-[#2d4a2d] text-xs space-y-1">
                  <div class="flex justify-between text-[#aaa]">
                    <span>Quantité : <strong>${d.quantityKg} kg</strong> × ${d.pricePerKg} DA</span>
                    <strong class="text-white text-sm">${d.totalAmount.toLocaleString()} DA</strong>
                  </div>
                  <div class="flex justify-between text-[#aaa] border-t border-[#2d4a2d]/50 pt-1">
                    <span>Livreur assigné : <strong>${d.delivererName}</strong></span>
                    <span class="text-[#e0b87a]">Course : ${d.deliveryFee} DA</span>

                  ${isSettled ? `
                    <div class="flex justify-between text-xs border-t border-[#2d4a2d]/50 pt-1">
                      <span class="${d.clientRemainingDue > 0 ? 'text-[#e07a7a] font-bold' : 'text-[#7bc67e]'}">

                      <strong class="text-[#7bc67e]">Net caisse : +${d.netCashToFarm.toLocaleString()} DA</strong>

                <!-- Actions contextuelles selon statut -->

                  <a href="tel:${d.clientPhone}" class="py-1.5 px-3 bg-[#1f3a1f] text-[#7bc67e] border border-[#7bc67e]/30 rounded-xl text-xs font-bold flex items-center justify-center gap-1">
                    <span>📞</span> <span>Client</span>
                  </a>

                  ${!isSettled ? `
                    <button onclick="openSettlementModal('${d.id}')" class="flex-1 py-1.5 bg-[#4a9e4e] text-white rounded-xl text-xs font-bold shadow hover:bg-emerald-600 flex items-center justify-center gap-1">
                      <span>💰</span> <span>Valider Paiement & Caisse</span>
                    </button>
                  ` : `
                    <button onclick="openSettlementModal('${d.id}')" class="flex-1 py-1.5 bg-[#1a2a1a] text-slate-300 border border-[#2d4a2d] rounded-xl text-xs font-semibold flex items-center justify-center gap-1">
                      <span>🔍</span> <span>Voir Reçu Caisse</span>
                    </button>
                  `}
                </div>
              </div>
            `;

          <!-- Option ergonomique : Bouton déroulant pour voir l'historique complet -->
          ${isTruncated5 ? `
            <div class="pt-2">
              <button onclick="setSalesFilterMode('all')" class="w-full py-3 bg-[#1a2a1a] hover:bg-[#223822] text-[#7bc67e] border border-[#2d4a2d] rounded-2xl text-xs font-bold transition-all shadow flex items-center justify-center gap-2">
                <span>📜</span>
                <span>Afficher les ${state.deliveries.length - 5} ventes plus anciennes</span>
                <span>↓</span>
              </button>
            </div>

    function onSaleDelivererChanged() {
      const delivId = document.getElementById('vte-deliverer-id').value;
      const deliverer = (state.deliverers || []).find(d => d.id === delivId);
      if (deliverer) {
        document.getElementById('vte-course-fee').value = deliverer.fee;
      }
      recalculateSaleForm();
    }

    function recalculateSaleForm() {
      const cliId = document.getElementById('vte-client-id').value;
      const client = state.clients.find(c => c.id === cliId);
      const qty = parseFloat(document.getElementById('vte-qty').value) || 0;
      const delivId = document.getElementById('vte-deliverer-id').value;
      const deliverer = (state.deliverers || []).find(d => d.id === delivId);
      const fee = parseFloat(document.getElementById('vte-course-fee').value) || (deliverer ? deliverer.fee : 0);

      if (!client || !deliverer) return;

      const totalFacture = Math.round(qty * client.price);
      const netEstime = totalFacture - fee;

      document.getElementById('vte-calc-summary').innerHTML = `
        <div class="flex justify-between text-[#aaa]">
          <span>Prix négocié client :</span>
          <span class="text-white font-semibold">${client.price} DA / kg</span>
        </div>
        <div class="flex justify-between text-[#aaa]">
          <span>Total facturé client :</span>
          <strong class="text-white text-sm">${totalFacture.toLocaleString()} DA</strong>
        </div>
        <div class="flex justify-between text-[#aaa] border-t border-[#2d4a2d] pt-1">
          <span>Frais course livreur :</span>
          <span class="text-[#e0b87a] font-semibold">${fee} DA <span class="text-[10px] text-[#888]">(modifiable)</span></span>
        </div>
        <div class="flex justify-between text-xs pt-1 border-t border-[#7bc67e]/30">
          <span class="text-[#7bc67e]">Net caisse estimé (si payé 100%) :</span>
          <strong class="text-[#7bc67e] text-sm">+${netEstime.toLocaleString()} DA</strong>
        </div>
      `;
    }

    function saveNewSale() {
      const cliId = document.getElementById('vte-client-id').value;
      const client = state.clients.find(c => c.id === cliId);
      const qty = parseFloat(document.getElementById('vte-qty').value) || 0;
      const delivId = document.getElementById('vte-deliverer-id').value;
      const deliverer = (state.deliverers || []).find(d => d.id === delivId);
      const fee = parseFloat(document.getElementById('vte-course-fee').value) || (deliverer ? deliverer.fee : 350);

      if (!client || qty <= 0 || !deliverer) return alert('Veuillez saisir une quantité valide.');

      const totalAmount = Math.round(qty * client.price);
      const orderNum = 'VTE-2026-' + String(state.deliveries.length + 1).padStart(3, '0');

      const newOrder = {
        id: 'vte_' + Date.now(),
        orderNumber: orderNum,
        clientId: client.id,
        clientName: client.name,
        clientPhone: client.phone,
        clientAddress: client.address,
        quantityKg: qty,
        pricePerKg: client.price,
        totalAmount: totalAmount,
        delivererId: deliverer.id,
        delivererName: deliverer.name,
        deliveryFee: fee, // Tarif course modifiable pour cette vente
        status: 'pending_acceptance', // Actif pour le livreur !
        isClientPaid: false,
        amountCollected: 0,
        clientRemainingDue: totalAmount,
        delivererFeeDeducted: 0,
        netCashToFarm: 0,
        dateIso: new Date().toISOString().slice(0, 10),
        createdAt: new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })
      };

      state.deliveries.unshift(newOrder);
      saveState();
      closeModal();
      showToast(`Vente ${orderNum} créée ! Livreur ${deliverer.name} notifié (Course : ${fee} DA).`);
    }

                <span>✅</span> <span>OUI (Payé 100%)</span>

          </div>

    function setClientPaymentChoice(isFull, totalAmount, fee) {
      const input = document.getElementById('collected-input');
      const yesBtn = document.getElementById('btn-pay-yes');
      const noBtn = document.getElementById('btn-pay-no');

      if (isFull) {
        input.value = totalAmount;
        yesBtn.className = "py-2.5 rounded-xl border-2 border-[#4a9e4e] bg-[#1f3a1f] text-[#7bc67e] font-bold text-xs shadow";
        noBtn.className = "py-2.5 rounded-xl border border-[#2d4a2d] bg-[#1a2a1a] text-slate-400 font-semibold text-xs";
      } else {
        input.value = 0;
        noBtn.className = "py-2.5 rounded-xl border-2 border-[#e07a7a] bg-[#3a1a1a] text-[#e07a7a] font-bold text-xs shadow";
        yesBtn.className = "py-2.5 rounded-xl border border-[#2d4a2d] bg-[#1a2a1a] text-slate-400 font-semibold text-xs";
      }
      updateSettlementBreakdown(totalAmount, fee);
    }

    function updateSettlementBreakdown(totalAmount, delivererFee) {
      const val = parseFloat(document.getElementById('collected-input').value) || 0;
      const remainingDue = Math.max(0, totalAmount - val);
      const isFeeCovered = val >= delivererFee;
      const netToFarm = isFeeCovered ? (val - delivererFee) : 0;
      const delivererDueFromFarm = isFeeCovered ? 0 : (delivererFee - val);

      document.getElementById('settlement-breakdown').innerHTML = `
        <div class="flex justify-between text-xs">
          <span class="text-[#aaa]">Reste à payer client (Impayé) :</span>
          <strong class="${remainingDue > 0 ? 'text-[#e07a7a] text-sm font-bold' : 'text-[#7bc67e]'}">
            ${remainingDue > 0 ? `${remainingDue.toLocaleString()} DA` : '0 DA (✓ Réglé)'}
          </strong>
        </div>

        <div class="flex justify-between text-xs border-t border-[#2d4a2d] pt-1.5">
          <span class="text-[#aaa]">Frais livreur déduits sur cash :</span>
          <strong class="text-[#e0b87a]">-${delivererFee} DA</strong>
        </div>

        <div class="flex justify-between text-xs border-t border-[#7bc67e]/40 pt-1.5">
          <span class="text-[#7bc67e] font-bold">Net remis en Caisse Ferme :</span>
          <strong class="text-[#7bc67e] text-base font-bold">+${netToFarm.toLocaleString()} DA</strong>
        </div>

        ${delivererDueFromFarm > 0 ? `
          <p class="text-[10px] text-[#e07a7a] bg-[#2a1a1a] p-1.5 rounded-lg border border-[#5a2a2a] mt-1">
            ⚠️ Attention : Le client n'a pas versé assez pour payer la course. La ferme doit encore régler <strong>${delivererDueFromFarm} DA</strong> au livreur.
          </p>
        ` : ''}
      `;
    }

    function applySettlement(orderId) {
      const d = state.deliveries.find(x => x.id === orderId);
      if (!d) return;

      const collected = parseFloat(document.getElementById('collected-input').value) || 0;
      const remainingDue = Math.max(0, d.totalAmount - collected);
      const isFeeCovered = collected >= d.deliveryFee;
      const netToFarm = isFeeCovered ? (collected - d.deliveryFee) : 0;

      // Mise à jour de la commande
      d.status = 'settled';
      d.amountCollected = collected;
      d.clientRemainingDue = remainingDue;
      d.isClientPaid = remainingDue === 0;
      d.delivererFeeDeducted = d.deliveryFee;
      d.netCashToFarm = netToFarm;

      // Mise à jour du compte client (si impayé)
      const client = state.clients.find(c => c.id === d.clientId);
      if (client) {
        if (remainingDue > 0) {
          client.due = (client.due || 0) + remainingDue;
        }
      }

      saveState();
      closeModal();
      showToast(`Commande ${d.orderNumber} clôturée ! Net en caisse : +${netToFarm.toLocaleString()} DA`);
    }

    function saveNewDeliverer() {
      const name = document.getElementById('deliv-name').value.trim();
      const phone = document.getElementById('deliv-phone').value.trim();
      const vehicle = document.getElementById('deliv-vehicle').value;
      const address = document.getElementById('deliv-address').value.trim();
      const fee = parseFloat(document.getElementById('deliv-fee').value) || 350;

      if (!name) return alert('Nom obligatoire.');
      if (!phone || phone === '+213') return alert('Numéro de téléphone obligatoire.');

      if (!state.deliverers) state.deliverers = [];

      state.deliverers.unshift({
        id: 'deliv_' + Date.now(),
        name,
        phone,
        vehicle,
        address: address || 'Alger',
        fee,
        status: 'active'
      });

      saveState();
      closeModal();
      showToast(`Livreur ${name} ajouté au Carnet Pro !`);
    }

    function saveEditDeliverer(id) {
      const d = (state.deliverers || []).find(x => x.id === id);
      if (!d) return;

      d.name = document.getElementById('edit-deliv-name').value.trim() || d.name;
      d.phone = document.getElementById('edit-deliv-phone').value.trim() || d.phone;
      d.vehicle = document.getElementById('edit-deliv-vehicle').value.trim() || d.vehicle;
      d.address = document.getElementById('edit-deliv-address').value.trim() || d.address;
      d.fee = parseFloat(document.getElementById('edit-deliv-fee').value) || d.fee;

      saveState();
      closeModal();
      showToast(`Fiche de ${d.name} mise à jour !`);
    }

    function deleteDeliverer(id) {
      const d = (state.deliverers || []).find(x => x.id === id);
      if (!d) return;

      // Vérifier les livraisons en cours
      const pendingDeliveries = state.deliveries.filter(x => x.delivererId === id && (x.status === 'in_delivery' || x.status === 'pending_acceptance'));
      if (pendingDeliveries.length > 0) {
        return alert(`Impossible de supprimer ${d.name} car il a ${pendingDeliveries.length} livraison(s) en cours. Terminez ou réassignez d'abord ces livraisons.`);
      }

      if (confirm(`Confirmer la suppression du livreur "${d.name}" du Carnet Pro ?`)) {
        state.deliverers = state.deliverers.filter(x => x.id !== id);
        saveState();
        showToast(`Livreur ${d.name} supprimé.`);
      }
    }

                    + Entrée (Réappro)
                  </button>
                  <button onclick="openStockMvtModal('${s.id}', 'out')" class="flex-1 py-1.5 bg-[#2a1a1a] hover:bg-[#3a2020] text-[#e07a7a] border border-[#e07a7a]/30 rounded-xl text-xs font-bold">
                    - Sortie (Usage)
                  </button>
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function openNewStockModal() {
      showModal(`
        <h3 class="text-sm font-bold text-white mb-2">Ajouter un Article au Stock</h3>
        <div class="space-y-2 text-xs">
          <div>
            <label class="text-[#888] block mb-1">Désignation</label>
            <input id="stk-name" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white" placeholder="ex: Chaux éteinte">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[#888] block mb-1">Quantité initiale</label>
              <input id="stk-qty" type="number" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white font-bold" value="25">
            </div>
            <div>
              <label class="text-[#888] block mb-1">Unité</label>
              <select id="stk-unit" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white">
                <option value="kg">kg</option>
                <option value="unités">unités / sacs</option>
                <option value="L">L (Litres)</option>
              </select>
            </div>
          </div>
          <div>
            <label class="text-[#888] block mb-1">Seuil d'alerte critique</label>
            <input id="stk-threshold" type="number" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white font-bold" value="5">
          </div>
          <div class="pt-3 flex gap-2">
            <button onclick="closeModal()" class="flex-1 py-2.5 bg-[#2d4a2d] rounded-xl text-white font-bold">Annuler</button>
            <button onclick="saveNewStockItem()" class="flex-1 py-2.5 bg-[#4a9e4e] rounded-xl text-white font-bold shadow">Enregistrer</button>
          </div>
        </div>
      `);
    }

    function saveNewStockItem() {
      const name = document.getElementById('stk-name').value.trim();
      const qty = parseFloat(document.getElementById('stk-qty').value) || 0;
      const unit = document.getElementById('stk-unit').value;
      const threshold = parseFloat(document.getElementById('stk-threshold').value) || 5;

      if (!name) return alert('Désignation requise.');
      state.stocks.push({ id: 'stk_' + Date.now(), name, quantity: qty, unit, threshold, cost: 400 });
      saveState();
      closeModal();
      showToast('Article ajouté !');
    }

    function openStockMvtModal(id, type) {
      const item = state.stocks.find(s => s.id === id);
      if (!item) return;

      showModal(`
        <h3 class="text-sm font-bold text-white mb-1">${type === 'in' ? '+ Réapprovisionnement' : '- Sortie Consommation'}</h3>
        <p class="text-xs text-[#7bc67e] mb-3">${item.name} • Actuel : ${item.quantity} ${item.unit}</p>
        <div class="space-y-3 text-xs">
          <div>
            <label class="text-[#888] block mb-1">Quantité (${item.unit})</label>
            <input id="mvt-qty" type="number" step="0.5" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-3 text-white text-lg font-bold" placeholder="10" autofocus>
          </div>
          <div class="flex gap-2 pt-2">
            <button onclick="closeModal()" class="flex-1 py-2.5 bg-[#2d4a2d] rounded-xl text-white font-bold">Annuler</button>
            <button onclick="applyStockMvt('${id}', '${type}')" class="flex-1 py-2.5 bg-[#4a9e4e] rounded-xl text-white font-bold shadow">Valider</button>
          </div>
        </div>
      `);
    }

    function applyStockMvt(id, type) {
      const val = parseFloat(document.getElementById('mvt-qty').value);
      if (!val || val <= 0) return alert('Quantité invalide.');
      const item = state.stocks.find(s => s.id === id);
      if (item) {
        if (type === 'in') item.quantity = Math.round((item.quantity + val) * 100) / 100;
        else item.quantity = Math.max(0, Math.round((item.quantity - val) * 100) / 100);
        saveState();
        showToast('Stock mis à jour.');
      }
      closeModal();
    }

    function deleteStockItem(id) {
      if (confirm('Supprimer cet article ?')) {
        state.stocks = state.stocks.filter(s => s.id !== id);
        saveState();
        showToast('Article supprimé.');
      }
    }

    // ==========================================
    // 7. SACS & LOTS (PASTEURISATION 200L)
    // ==========================================
    function renderBagsView() {
      const container = document.getElementById('app-content');
      container.innerHTML = `
        <div class="flex justify-between items-center mb-1">
          <div>
            <h2 class="text-xs font-bold text-[#7bc67e] tracking-wider uppercase">Lots & Sacs de Culture</h2>
            <p class="text-[10px] text-[#888]">${state.batches.length} lot(s) • ${state.bags.length} sacs</p>
          </div>
          <button onclick="openNewBatchModal()" class="text-xs bg-[#4a9e4e] text-white px-3 py-1.5 rounded-xl font-bold shadow hover:bg-emerald-600 transition-all flex items-center gap-1">
            <span>+</span> <span>Nouveau Lot (200L)</span>
          </button>
        </div>

        ${state.batches.map(batch => `
          <div class="bg-[#1a2a1a] p-3 rounded-2xl border border-[#2d4a2d] space-y-1 mb-2">
            <span class="text-[10px] font-bold text-[#7bc67e] bg-[#0f1a0f] border border-[#2d4a2d] px-2 py-0.5 rounded-md font-mono">${batch.id}</span>
            <h3 class="font-bold text-white text-xs mt-1">${batch.strain}</h3>
            <p class="text-[10px] text-[#aaa]">Paille sèche : ${batch.strawDry}kg (${batch.strawWet}kg humide) • ${batch.bagCount} sacs</p>
          </div>
        `).join('')}

        <h3 class="text-xs font-bold text-white mt-3 mb-1">Sacs & Pesées de Récolte :</h3>
        <div class="space-y-2">
          ${state.bags.map(b => {
            const isFruit = b.status === 'fruiting';
            const isContam = b.status === 'contaminated';
            return `
              <div class="bg-[#1a2a1a] p-3 rounded-2xl border ${isContam ? 'border-[#5a2a2a] bg-[#2a1a1a]/40' : 'border-[#2d4a2d]'} space-y-2">
                <div class="flex justify-between items-center">
                  <span class="text-xs font-mono font-bold text-white">${b.id}</span>
                  <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${
                    isFruit ? 'bg-[#1f3a1f] text-[#7bc67e] border border-[#7bc67e]/40' :
                    (isContam ? 'bg-[#3a1a1a] text-[#e07a7a]' : 'bg-[#3a2e1a] text-[#e0b87a]')
                  }">
                    ${isFruit ? '🍄 Fructification' : (isContam ? '☣️ Contaminé' : '🌡️ Incubation')}
                  </span>
                </div>

                <div class="flex justify-between text-xs text-[#aaa] bg-[#0f1a0f] p-2 rounded-xl border border-[#2d4a2d]">
                  <span>Poids : ${b.weight} kg</span>
                  <span>Récolté : <strong class="text-[#7bc67e] text-sm">${b.harvestedKg || 0} kg</strong></span>
                </div>

                ${!isContam ? `
                  <div class="flex gap-2 pt-1">
                    ${!isFruit ? `
                      <button onclick="moveToFruiting('${b.id}')" class="flex-1 py-1.5 bg-[#1f3a1f] text-[#7bc67e] border border-[#7bc67e]/30 rounded-xl text-xs font-bold">
                        💧 Fructification
                      </button>
                    ` : `
                      <button onclick="openHarvestModal('${b.id}')" class="flex-1 py-1.5 bg-[#4a9e4e] text-white rounded-xl text-xs font-bold shadow flex items-center justify-center gap-1">
                        <span>⚖️</span> <span>Peser Récolte</span>
                      </button>
                    `}
                    <button onclick="markContaminated('${b.id}')" class="px-3 py-1.5 bg-[#3a1a1a] text-[#e07a7a] border border-[#e07a7a]/30 rounded-xl text-xs font-bold">
                      ☣️ Avarie
                    </button>
                  </div>
                ` : `
                  <p class="text-[10px] text-[#e07a7a] font-bold">Sac retiré (Contamination).</p>
                `}
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function openNewBatchModal() {
      showModal(`
        <h3 class="text-sm font-bold text-white mb-2">Nouveau Lot (Pasteurisation 200L)</h3>
        <div class="space-y-2 text-xs">
          <div>
            <label class="text-[#888] block mb-1">Code du Lot</label>
            <input id="batch-code" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white font-mono font-bold" value="LOT-${new Date().toISOString().slice(5,10)}-01">
          </div>
          <div>
            <label class="text-[#888] block mb-1">Souche</label>
            <input id="batch-strain" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white" value="Pleurote Gris HK35">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="text-[#888] block mb-1">Paille sèche (kg)</label>
              <input id="batch-dry" type="number" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white font-bold" value="50">
            </div>
            <div>
              <label class="text-[#888] block mb-1">Nombre de sacs</label>
              <input id="batch-bags" type="number" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white font-bold" value="32">
            </div>
          </div>
          <div class="pt-3 flex gap-2">
            <button onclick="closeModal()" class="flex-1 py-2.5 bg-[#2d4a2d] rounded-xl text-white font-bold">Annuler</button>
            <button onclick="saveNewBatch()" class="flex-1 py-2.5 bg-[#4a9e4e] rounded-xl text-white font-bold shadow">Créer</button>
          </div>
        </div>
      `);
    }

    function saveNewBatch() {
      const code = document.getElementById('batch-code').value.trim();
      const strain = document.getElementById('batch-strain').value.trim();
      const dry = parseFloat(document.getElementById('batch-dry').value) || 50;
      const count = parseInt(document.getElementById('batch-bags').value) || 10;

      state.batches.unshift({
        id: code, strain, substrate: 'Paille hachée (Fût 200L)',
        strawDry: dry, strawWet: Math.round(dry * 3.2), spawnKg: 7, bagCount: count, date: new Date().toISOString().slice(0, 10), status: 'Actif'
      });

      for (let i = 1; i <= Math.min(count, 8); i++) {
        state.bags.unshift({
          id: `BAG-${code.slice(-5)}-${i.toString().padStart(3, '0')}`,
          batchId: code, status: 'incubation', weight: 5.0, strain: strain, harvestedKg: 0
        });
      }
      saveState();
      closeModal();
      showToast(`Lot ${code} généré !`);
    }

    function moveToFruiting(id) {
      const b = state.bags.find(x => x.id === id);
      if (b) { b.status = 'fruiting'; saveState(); showToast('Passé en fructification'); }
    }
    function markContaminated(id) {
      const b = state.bags.find(x => x.id === id);
      if (b && confirm(`Déclarer ${id} contaminé ?`)) {
        b.status = 'contaminated'; saveState(); showToast('Sac écarté.');
      }
    }
    function openHarvestModal(id) {
      showModal(`
        <h3 class="text-sm font-bold text-white mb-2">⚖️ Pesée Récolte (${id})</h3>
        <div class="space-y-3 text-xs">
          <div>
            <label class="text-[#888] block mb-1">Kilos récoltés (kg frais)</label>
            <input id="harvest-val" type="number" step="0.05" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-3 text-white text-lg font-bold" value="1.25" autofocus>
          </div>
          <div class="flex gap-2 pt-2">
            <button onclick="closeModal()" class="flex-1 py-2.5 bg-[#2d4a2d] rounded-xl text-white font-bold">Annuler</button>
            <button onclick="applyHarvest('${id}')" class="flex-1 py-2.5 bg-[#4a9e4e] rounded-xl text-white font-bold shadow">Valider Pesée</button>
          </div>
        </div>
      `);
    }
    function applyHarvest(id) {
      const val = parseFloat(document.getElementById('harvest-val').value) || 0;
      const b = state.bags.find(x => x.id === id);
      if (b && val > 0) {
        b.harvestedKg = Math.round(((b.harvestedKg || 0) + val) * 100) / 100;
        saveState();
        showToast(`+${val} kg enregistrés !`);
      }
      closeModal();
    }

    // ==========================================
    // 8. DÉPENSES EXPLOITATION
    // ==========================================
    function renderExpensesView() {
      const container = document.getElementById('app-content');
      const totalExp = state.expenses.reduce((s, e) => s + e.amount, 0);

      container.innerHTML = `
        <div class="flex justify-between items-center mb-1">
          <div>
            <h2 class="text-xs font-bold text-[#7bc67e] tracking-wider uppercase">Dépenses Exploitation</h2>
            <p class="text-[10px] text-[#888]">Total engagé : <strong>${totalExp.toLocaleString()} DA</strong></p>
          </div>
          <button onclick="openNewExpenseModal()" class="text-xs bg-[#4a9e4e] text-white px-3 py-1.5 rounded-xl font-bold shadow hover:bg-emerald-600 transition-all flex items-center gap-1">
            <span>+</span> <span>Nouvelle Dépense</span>
          </button>
        </div>

        <div class="space-y-2 mt-2">
          ${state.expenses.map(e => `
            <div class="bg-[#1a2a1a] p-3 rounded-2xl border border-[#2d4a2d] flex justify-between items-center text-xs">
              <div>
                <p class="font-bold text-white">${e.label}</p>
                <p class="text-[10px] text-[#888]">${e.date} • ${e.category}</p>
              </div>
              <div class="flex items-center gap-2">
                <span class="text-[#e07a7a] font-bold text-sm">-${e.amount.toLocaleString()} DA</span>
                <button onclick="deleteExpense('${e.id}')" class="text-slate-500 hover:text-red-400 p-1 text-xs">🗑️</button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function openNewExpenseModal() {
      showModal(`
        <h3 class="text-sm font-bold text-white mb-2">Ajouter une Dépense</h3>
        <div class="space-y-2 text-xs">
          <div>
            <label class="text-[#888] block mb-1">Motif / Justification</label>
            <input id="exp-label" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white" placeholder="ex: Facture électricité chambre">
          </div>
          <div>
            <label class="text-[#888] block mb-1">Montant en Dinars (DA)</label>
            <input id="exp-amount" type="number" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white font-bold" placeholder="2500">
          </div>
          <div>
            <label class="text-[#888] block mb-1">Catégorie</label>
            <select id="exp-cat" class="w-full bg-[#0f1a0f] border border-[#2d4a2d] rounded-xl p-2.5 text-white">
              <option value="Matière première">Matière première (Paille/Mycélium)</option>
              <option value="Sanitation">Désinfection & Alcool</option>
              <option value="Énergie">Électricité / Eau</option>
              <option value="Transport">Carburant</option>
              <option value="Consommables">Sacs micro-perforés</option>
            </select>
          </div>
          <div class="pt-3 flex gap-2">
            <button onclick="closeModal()" class="flex-1 py-2.5 bg-[#2d4a2d] rounded-xl text-white font-bold">Annuler</button>
            <button onclick="saveNewExpense()" class="flex-1 py-2.5 bg-[#4a9e4e] rounded-xl text-white font-bold shadow">Enregistrer</button>
          </div>
        </div>
      `);
    }

    function saveNewExpense() {
      const label = document.getElementById('exp-label').value.trim();
      const amount = parseFloat(document.getElementById('exp-amount').value) || 0;
      const category = document.getElementById('exp-cat').value;
      if (!label || amount <= 0) return alert('Motif et montant requis.');

      state.expenses.unshift({
        id: 'exp_' + Date.now(), label, amount, category,
        date: new Date().toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' })
      });
      saveState();
      closeModal();
      showToast('Dépense ajoutée !');
    }

    function deleteExpense(id) {
      if (confirm('Supprimer cette dépense ?')) {
        state.expenses = state.expenses.filter(e => e.id !== id);
        saveState();
        showToast('Dépense retirée.');
      }
    }

    // Modal Helpers
    function showModal(content) {
      document.getElementById('modal-container').innerHTML = content;
      document.getElementById('modal-backdrop').classList.remove('hidden');
    }
    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    function openScanModal() {
      showModal(`
        <h3 class="text-sm font-bold text-white mb-2 text-center">📷 Scanner QR Sac</h3>
        <div class="space-y-2 max-h-60 overflow-y-auto">
          ${state.bags.map(b => `
            <button onclick="closeModal(); switchTab('bags'); showToast('Scan : ' + '${b.id}');" class="w-full text-left bg-[#0f1a0f] p-3 rounded-xl border border-[#2d4a2d] text-xs flex justify-between items-center hover:border-[#7bc67e]">
              <span class="font-mono text-white font-bold">${b.id}</span>
              <span class="text-[#7bc67e]">${b.status}</span>
            </button>
          `).join('')}
        </div>
        <button onclick="closeModal()" class="w-full mt-3 py-2.5 bg-[#2d4a2d] rounded-xl text-white text-xs font-bold">Fermer</button>
      `);
    }

    function updateClock() {
      const d = new Date();
      const h = d.getHours().toString().padStart(2, '0');
      const m = d.getMinutes().toString().padStart(2, '0');
      const el = document.getElementById('live-clock');
      if (el) el.innerText = `${h}:${m}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Initialisation
    checkBadges();
    setRole('admin');
  </script>
</body>
</html>
