<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071207"/>
      <stop offset="50%" stop-color="#112411"/>
      <stop offset="100%" stop-color="#050c05"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#84d687"/>
      <stop offset="60%" stop-color="#4a9e4e"/>
      <stop offset="100%" stop-color="#2d6b30"/>
    </linearGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dce8d6"/>
      <stop offset="50%" stop-color="#f5f8f3"/>
      <stop offset="100%" stop-color="#c1d6b8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background container squircle (centered with safe margins: 52px inset = 408x408 box) -->
  <rect x="52" y="52" width="408" height="408" rx="96" fill="url(#bgGrad)" stroke="#3e8842" stroke-width="6"/>

  <!-- Elegant Mycelium Accent Dots -->
  <circle cx="125" cy="135" r="4" fill="#7bc67e" opacity="0.35"/>
  <circle cx="380" cy="145" r="4.5" fill="#7bc67e" opacity="0.3"/>
  <circle cx="115" cy="375" r="3.5" fill="#7bc67e" opacity="0.35"/>
  <circle cx="395" cy="370" r="4" fill="#7bc67e" opacity="0.3"/>

  <!-- Mushroom Cluster centered inside 72% safe-zone -->
  <g filter="url(#shadow)">
    <!-- Main stem -->
    <path d="M236 265 C236 230, 276 230, 276 265 L282 355 C282 368, 230 368, 230 355 Z" fill="url(#stemGrad)"/>
    
    <!-- Baby mushroom left stem -->
    <path d="M192 305 C192 285, 216 285, 216 305 L220 352 C220 360, 188 360, 188 352 Z" fill="#cfdec8"/>
    
    <!-- Baby mushroom left cap -->
    <path d="M168 308 C168 280, 240 280, 240 308 C224 312, 184 312, 168 308 Z" fill="#58a85c"/>

    <!-- Main Oyster Mushroom Cap (Fan shape) -->
    <path d="M155 254 C155 170, 357 170, 357 254 C323 264, 298 258, 256 260 C214 258, 189 264, 155 254 Z" fill="url(#capGrad)"/>

    <!-- Subtle gills texture -->
    <path d="M182 252 Q256 228 330 252" stroke="#255827" stroke-width="2.5" fill="none" opacity="0.6"/>
    <path d="M202 245 Q256 220 310 245" stroke="#255827" stroke-width="2" fill="none" opacity="0.45"/>
    <path d="M222 237 Q256 215 290 237" stroke="#255827" stroke-width="1.8" fill="none" opacity="0.35"/>
  </g>

  <!-- App Label inside squircle -->
  <text x="256" y="405" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">MYCOTRACK</text>
  <text x="256" y="426" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#7bc67e" text-anchor="middle" letter-spacing="4">PRO</text>
</svg>